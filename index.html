<style>
  /* Core layout lives in plain CSS (not Tailwind) so the feed still
     scrolls and snaps even if the compiled block above were missing. */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --ink: #0a0a14;
    --right: #34d399;
    --wrong: #fb7185;
    --gold: #fcd34d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink); color: #fff;
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    overscroll-behavior: none;
  }

  /* Hide every scrollbar; this should feel like an app, not a web page. */
  ::-webkit-scrollbar { display: none !important; width: 0 !important; }
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }

  /* The feed: one full-screen card at a time, snapped. */
  #feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
  .reel {
    position: relative;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* Soft moving blobs behind the text, so each reel has depth. */
  .blob {
    position: absolute; border-radius: 9999px;
    filter: blur(70px); opacity: .5; pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(8%, -6%, 0) scale(1.25); }
  }

  /* Legibility scrim: text sits over gradients, so darken top and bottom. */
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,5,12,.72) 0%, rgba(5,5,12,0) 26%),
      linear-gradient(to top,   rgba(5,5,12,.9) 0%, rgba(5,5,12,0) 60%);
  }

  /* XP bar fill. */
  #xpFill { transition: width .6s cubic-bezier(.22,1,.36,1); }

  /* Toasts sit under the HUD so they never cover the answer buttons. */
  #toasts {
    position: fixed; z-index: 95; left: 0; right: 0;
    top: calc(var(--sat) + 62px);
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    pointer-events: none;
  }
  .toast { animation: toastIn .35s cubic-bezier(.22,1,.36,1), toastOut .4s ease 1.9s forwards; }
  @keyframes toastIn  { from { transform: translateY(-10px) scale(.9); opacity: 0; } }
  @keyframes toastOut { to   { transform: translateY(-8px); opacity: 0; } }

  /* Level-up celebration. */
  #levelup {
    position: fixed; inset: 0; z-index: 99;
    display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(251,191,36,.22), rgba(3,3,10,.94));
  }
  #levelup.show { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .lv-card { animation: lvPop .6s cubic-bezier(.22,1,.36,1); }
  @keyframes lvPop {
    0%   { transform: scale(.6) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Safe-area offsets as plain CSS: `calc(var(--sab)+10px)` without
     spaces is invalid, so these can't be Tailwind arbitrary values. */
  .hud-pad  { padding-top: calc(var(--sat) + 10px); }
  .hint-pos { bottom: calc(var(--sab) + 14px); }

  /* The text column. A reel with its question can be taller than a small
     phone, so it scrolls inside the reel; at the end of it, the next swipe
     moves the feed on. */
  .content-pad {
    padding-top: calc(var(--sat) + 68px);   /* clears the HUD */
    padding-bottom: calc(var(--sab) + 40px);
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Type scales with viewport HEIGHT, so a 640px Android gets smaller text
     instead of a wall to scroll. Checked at 360x640, 390x844 and 430x932. */
  .eyebrow {
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,255,255,.62);
  }
  .reel-hook {
    font-size: clamp(21px, 3.1vh, 28px);
    line-height: 1.13; font-weight: 900;
    letter-spacing: -0.02em; margin: 8px 0 10px;
    text-wrap: balance;
  }
  .reel-body {
    font-size: clamp(14px, 1.9vh, 16px);
    line-height: 1.5; color: rgba(255,255,255,.9);
  }
  .verse-text { font-size: clamp(13.5px, 1.8vh, 15px); line-height: 1.42; }

  /* ---- The question at the end of each reel ---- */
  .quiz { margin-top: 16px; }
  .quiz-q {
    font-size: clamp(15px, 2vh, 17px); font-weight: 800;
    line-height: 1.3; margin: 6px 0 10px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 46px; padding: 10px 14px;
    border-radius: 14px; text-align: left;
    font: inherit; font-size: 14.5px; font-weight: 600; line-height: 1.3;
    color: #fff; background: rgba(0,0,0,.38);
    border: 1.5px solid rgba(255,255,255,.22);
    cursor: pointer; transition: transform .12s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .choice:active { transform: scale(.98); }
  .choice:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .choice .mark {
    flex: 0 0 22px; height: 22px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
    border: 1.5px solid rgba(255,255,255,.35);
  }
  .quiz.done .choice { cursor: default; opacity: .45; }
  .quiz.done .choice:active { transform: none; }
  .quiz .choice.is-right { opacity: 1; background: rgba(52,211,153,.2); border-color: var(--right); }
  .quiz .choice.is-right .mark { background: var(--right); border-color: var(--right); color: #052e1c; }
  .quiz .choice.is-wrong { opacity: 1; background: rgba(251,113,133,.18); border-color: var(--wrong); }
  .quiz .choice.is-wrong .mark { background: var(--wrong); border-color: var(--wrong); color: #3b0512; }
  .quiz-why {
    margin-top: 10px; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; background: rgba(0,0,0,.4);
    animation: whyIn .3s ease;
  }
  .quiz-why b { font-weight: 900; }
  .quiz-why .ok { color: var(--right); }
  .quiz-why .no { color: var(--wrong); }
  @keyframes whyIn { from { opacity: 0; transform: translateY(-4px); } }

  /* A picture fills the reel behind the text; a heavier scrim keeps the
     words readable over a busy painting. */
  .reel-photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 25%;
  }
  .has-photo .scrim {
    background:
      linear-gradient(to bottom, rgba(5,5,12,.7) 0%, rgba(5,5,12,0) 20%),
      linear-gradient(to top, rgba(5,5,12,.96) 0%, rgba(5,5,12,.9) 55%, rgba(5,5,12,.6) 80%, rgba(5,5,12,.35) 100%);
  }
  .has-photo .eyebrow, .has-photo .credit, .has-photo .reel-hook, .has-photo .reel-body {
    text-shadow: 0 1px 10px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6);
  }
  /* Text that scrolls up inside a tall reel fades out under the HUD. */
  header { background: linear-gradient(to bottom, rgba(5,5,12,.88) 0%, rgba(5,5,12,.6) 65%, rgba(5,5,12,0) 100%); }
  .credit { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 3px; }
  .credit a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.3); }

  /* Tap-to-play clip. Nothing loads from YouTube until he taps. */
  .clip {
    margin-top: 14px; display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 10px 12px; border-radius: 14px; text-align: left;
    font: inherit; color: #fff; cursor: pointer; text-decoration: none;
    background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.22);
  }
  .clip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .clip-play {
    flex: 0 0 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center; background: #fff; color: #111; font-size: 16px;
  }
  .clip.watched { border-color: rgba(52,211,153,.6); }
  .clip.watched .clip-play { background: var(--right); color: #052e1c; font-weight: 900; }
  .clip-title { font-size: 14px; font-weight: 800; line-height: 1.25; }
  .clip-meta  { font-size: 11.5px; color: rgba(255,255,255,.6); margin-top: 2px; }
  .clip-frame { margin-top: 14px; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
  .clip-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Bonus question: the answer is only in the chapter or the lesson. */
  .quiz.bonus { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.25); }
  .find-link {
    display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px;
    font-size: 13px; font-weight: 700; color: var(--gold);
    text-decoration: underline; text-decoration-color: rgba(252,211,77,.4);
  }

  /* ---- Family rewards (set by a parent) ---- */
  .reward { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.35); font-size: 14px; border: 1.5px solid transparent; }
  .reward.unlocked { border-color: var(--right); }
  .reward-bar { margin-top: 7px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .reward-bar div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a78bfa, var(--gold)); }
  .reward.unlocked .reward-bar div { background: var(--right); }
  .parent-link, .board-link {
    display: block; margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700; text-align: left;
    color: rgba(255,255,255,.7); text-decoration: underline; text-decoration-color: rgba(255,255,255,.3);
  }
  .board-link {
    margin-top: 16px; padding: 12px 16px; border-radius: 14px; text-decoration: none; width: 100%;
    font-size: 15px; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, rgba(124,58,237,.55), rgba(217,119,6,.45));
    border: 1.5px solid rgba(255,255,255,.22);
  }
  .board-link small { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); margin-top: 2px; }

  /* ---- Overlays: the family board and the parent screen ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: flex-end; justify-content: center;
    padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
    background: rgba(3,3,10,.82); backdrop-filter: blur(4px);
  }
  .overlay[hidden], #board[hidden], #play[hidden], #live[hidden] { display: none; }
  .overlay-card {
    width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto;
    padding: 18px; border-radius: 22px; background: #12121f; border: 1px solid rgba(255,255,255,.12);
  }
  .field {
    width: 100%; font: inherit; font-size: 16px; color: #fff;   /* 16px stops iOS zooming in */
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; padding: 10px 12px;
  }
  .field:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .reward-row { display: grid; grid-template-columns: 86px 1fr auto; gap: 8px; align-items: center; }
  .claim { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.75); white-space: nowrap; }
  .parent-msg { margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--gold); }
  .btn {
    font: inherit; font-weight: 800; font-size: clamp(14px, 1.6vw, 22px);
    padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer;
    background: #fff; color: #111;
  }
  .btn.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.22); }
  .btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #board, #play, #live {
    position: fixed; inset: 0; z-index: 110; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: calc(var(--sat) + 14px) 16px calc(var(--sab) + 16px);
    background: radial-gradient(120% 90% at 50% 0%, #1e1b4b 0%, var(--ink) 70%);
  }
  .board-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .board-title { font-weight: 900; font-size: clamp(18px, 2.4vw, 32px); line-height: 1.1; }
  .board-scores { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .score-chip {
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: clamp(13px, 1.4vw, 20px);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }
  .score-chip b, .score-row b { color: var(--gold); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .board-grid { display: grid; gap: 10px; margin-top: 16px; }
  .board-cat {
    display: flex; align-items: center; justify-content: center; min-height: 64px;
    padding: 10px 6px; border-radius: 12px; text-align: center; text-wrap: balance;
    font-weight: 900; font-size: clamp(11px, 1.3vw, 18px); letter-spacing: .04em; text-transform: uppercase;
    background: rgba(76,29,149,.55);
  }
  .tile {
    min-height: clamp(56px, 11vh, 120px); border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 900; font-size: clamp(22px, 3.4vw, 54px); font-variant-numeric: tabular-nums;
    color: var(--gold); background: linear-gradient(160deg, #312e81, #1e1b4b); border: 1px solid rgba(255,255,255,.15);
  }
  .tile:disabled { cursor: default; font-size: clamp(12px, 1.3vw, 18px); color: rgba(255,255,255,.4); background: rgba(255,255,255,.04); }
  .tile.empty { visibility: hidden; }
  .clue { width: 100%; max-width: 1100px; margin: 20px auto 0; }
  .clue-q { font-weight: 900; font-size: clamp(22px, 3.6vw, 52px); line-height: 1.2; margin: 8px 0 16px; text-wrap: balance; }
  .clue-choices .choice { cursor: default; font-size: clamp(15px, 1.9vw, 28px); min-height: clamp(46px, 7vh, 80px); }
  .clue .quiz-why { font-size: clamp(14px, 1.7vw, 24px); }
  .dd-banner {
    display: inline-block; margin-bottom: 10px; padding: 6px 14px; border-radius: 999px;
    font-weight: 900; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(12px, 1.4vw, 20px);
    color: #1c1406; background: var(--gold);
  }
  .board-help { font-size: clamp(14px, 1.5vw, 20px); color: rgba(255,255,255,.72); line-height: 1.45; max-width: 60ch; }
  .board-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 16px; }
  .board-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .score-row {
    display: flex; justify-content: space-between; padding: 12px 16px; border-radius: 14px;
    font-weight: 800; font-size: clamp(16px, 2vw, 28px); background: rgba(255,255,255,.06);
  }

  /* ---- Games: the menu, the weekly puzzle, Who said it? ---- */
  .game-row {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px;
    padding: 12px 14px; border-radius: 16px; text-align: left; cursor: pointer;
    font: inherit; color: #fff; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.14);
  }
  .game-row:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .game-row .gi { flex: 0 0 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.08); }
  .game-row .gt { font-weight: 800; font-size: 15px; }
  .game-row .gd { font-size: 12.5px; color: rgba(255,255,255,.65); margin-top: 2px; line-height: 1.35; }
  .game-row .gs { font-size: 12px; font-weight: 800; margin-top: 4px; color: var(--gold); }
  .game-row.locked { opacity: .6; }

  .pz-wrap { width: 100%; max-width: 560px; margin: 16px auto 0; }
  .pz-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .ptile {
    min-height: 68px; padding: 6px; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 800; font-size: clamp(11.5px, 3.2vw, 15px); line-height: 1.15;
    color: #fff; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.16);
    text-wrap: balance; transition: transform .1s ease, background .15s ease;
  }
  .ptile:active { transform: scale(.96); }
  .ptile.sel { background: #e9e3ff; color: #1e1b4b; border-color: #fff; }
  .ptile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pz-solved { border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; color: #111; }
  .pz-solved b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .pz-solved span { font-size: 13.5px; font-weight: 600; }
  .pz-solved small { display: block; font-size: 11.5px; margin-top: 3px; opacity: .75; }
  .pz-c0 { background: #fcd34d; } .pz-c1 { background: #6ee7b7; } .pz-c2 { background: #fda4af; } .pz-c3 { background: #93c5fd; }
  .pz-lives { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.7); }
  .pz-lives i { width: 10px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.8); display: inline-block; }
  .pz-lives i.gone { background: rgba(255,255,255,.18); }
  .pz-msg { text-align: center; min-height: 22px; margin-top: 10px; font-weight: 800; color: var(--gold); }

  .say-quote { font-weight: 900; font-size: clamp(22px, 5.4vw, 40px); line-height: 1.2; margin: 10px 0 18px; text-wrap: balance; }
  .say-quote::before { content: "“"; } .say-quote::after { content: "”"; }

  /* ---- Notes: his own words, then into his scriptures ---- */
  .note-box { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.25); }
  .note-q { display: block; font-size: 15px; font-weight: 800; line-height: 1.3; margin: 6px 0 8px; }
  .note-input { resize: vertical; min-height: 84px; line-height: 1.4; }
  .note-text { font-size: 15px; line-height: 1.5; margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.35); white-space: pre-wrap; }
  .note-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .note-btn {
    display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 800; text-decoration: none; border: 0; background: #fff; color: #111;
  }
  .note-btn.ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.22); }
  .note-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .note-msg { min-height: 18px; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--gold); }
  .note-help { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 8px; line-height: 1.4; }
  .journal-item { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); }

  /* ---- Verse Word (Wordle-style, with the verse as the clue) ---- */
  .vw-clue { font-size: clamp(15px, 4vw, 20px); line-height: 1.45; text-align: center; margin: 6px 0 14px; }
  .vw-clue b { color: var(--gold); letter-spacing: .12em; }
  .vw-grid { display: grid; gap: 6px; justify-content: center; }
  .vw-row { display: grid; gap: 6px; }
  .vw-cell {
    width: clamp(40px, 12vw, 58px); height: clamp(40px, 12vw, 58px);
    display: grid; place-items: center; border-radius: 8px;
    font-weight: 900; font-size: clamp(20px, 6vw, 30px); text-transform: uppercase;
    border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.04);
  }
  .vw-cell.filled { border-color: rgba(255,255,255,.55); }
  .vw-cell.g { background: #16a34a; border-color: #16a34a; }
  .vw-cell.y { background: #ca8a04; border-color: #ca8a04; }
  .vw-cell.x { background: rgba(255,255,255,.14); border-color: transparent; }
  .vw-kb { display: grid; gap: 6px; margin-top: 16px; }
  .vw-kr { display: flex; gap: 5px; justify-content: center; }
  .vw-key {
    flex: 1 1 0; max-width: 42px; height: 50px; border-radius: 8px; border: 0; cursor: pointer;
    font: inherit; font-weight: 800; font-size: 15px; color: #fff; background: rgba(255,255,255,.18);
  }
  .vw-key.wide { max-width: 68px; font-size: 12px; }
  .vw-key.g { background: #16a34a; } .vw-key.y { background: #ca8a04; } .vw-key.x { background: rgba(255,255,255,.06); color: rgba(255,255,255,.4); }

  /* ---- Scripture Climb (Millionaire-style) ---- */
  .climb-ladder { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 14px; }
  .climb-ladder span {
    padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.07); color: rgba(255,255,255,.55);
  }
  .climb-ladder span.done { background: rgba(52,211,153,.2); color: var(--right); }
  .climb-ladder span.now { background: var(--gold); color: #1c1406; }
  .climb-ladder span.missed { background: rgba(251,113,133,.2); color: var(--wrong); }
  .lifelines { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .lifeline {
    font: inherit; font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 999px; cursor: pointer;
    color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); text-decoration: none;
  }
  .lifeline:disabled, .lifeline.used { opacity: .35; cursor: default; pointer-events: none; }

  /* ---- Year trail on the first card ---- */
  .trail { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-width: 340px; }
  .trail i { width: 9px; height: 9px; border-radius: 99px; background: rgba(255,255,255,.12); display: inline-block; }
  .trail i.past { background: rgba(255,255,255,.28); }
  .trail i.did { background: var(--right); }
  .trail i.now { background: var(--gold); box-shadow: 0 0 0 3px rgba(252,211,77,.3); }

  /* ---- Live game (Kahoot-style): TV hosts, phones answer ---- */
  .live-code { font-weight: 900; font-size: clamp(56px, 14vw, 150px); letter-spacing: .12em; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
  .live-players { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .live-players span { padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: clamp(14px, 1.8vw, 22px); background: rgba(255,255,255,.1); }
  .live-choices { display: grid; gap: 10px; margin-top: 14px; }
  .live-choice {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: clamp(60px, 10vh, 110px);
    padding: 12px 16px; border-radius: 16px; border: 0; cursor: pointer; text-align: left;
    font: inherit; font-weight: 800; font-size: clamp(16px, 2.4vw, 32px); color: #fff;
  }
  .live-choice .lt { flex: 0 0 auto; width: 1.6em; height: 1.6em; border-radius: 10px; display: grid; place-items: center; background: rgba(0,0,0,.25); }
  .live-choice.dim { opacity: .3; }
  .live-choice.right { outline: 4px solid #fff; outline-offset: 2px; }
  .live-clock { font-weight: 900; font-size: clamp(28px, 5vw, 64px); font-variant-numeric: tabular-nums; color: var(--gold); }
  .live-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .live-bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 4px; }
  .live-bar div { height: 100%; }
  .live-big { font-weight: 900; font-size: clamp(30px, 8vw, 64px); line-height: 1.1; text-align: center; margin-top: 18vh; }
  .live-sub { text-align: center; font-size: clamp(16px, 4vw, 24px); color: rgba(255,255,255,.75); margin-top: 12px; }
  .live-mode { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 16px; }

  /* Week report on the last card. */
  .report-row { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; line-height: 1.35; }
  .report-row .st { flex: 0 0 16px; font-weight: 900; text-align: center; }
  .st-right { color: var(--right); }
  .st-wrong { color: var(--wrong); }
  .st-open  { color: rgba(255,255,255,.4); }

  /* Position dots down the right edge. */
  #rail { position: fixed; right: 6px; top: 50%; transform: translateY(-50%);
          z-index: 40; display: flex; flex-direction: column;
          gap: 5px; align-items: center; pointer-events: none; }
  .rail-dot { width: 4px; height: 4px; border-radius: 999px;
              background: rgba(255,255,255,.3); transition: all .3s ease; }
  .rail-dot.on { background: #fff; height: 15px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .blob { animation: none; }
  }
</style>
</head>
<body>

<!-- ==================== TOP HUD: level, XP bar, streak ==================== -->
<header class="fixed top-0 left-0 right-0 z-50 px-4 hud-pad pb-3 pointer-events-none">
  <div class="flex items-center gap-3">

    <!-- Level badge -->
    <div class="flex items-center gap-2.5 rounded-full bg-black/45 backdrop-blur-md px-2.5 py-1.5 ring-1 ring-white/15">
      <div class="grid place-items-center w-8 h-8 rounded-full bg-gradient-to-br from-amber-300 via-orange-400 to-rose-500 text-[13px] font-black text-black shrink-0">
        <span id="levelNum">1</span>
      </div>
      <div class="pr-1">
        <div id="levelTitle" class="text-[11px] font-bold leading-none tracking-wide">Seeker</div>
        <div id="xpText" class="text-[9px] text-white/60 leading-none mt-1">0 XP</div>
      </div>
    </div>

    <!-- XP progress toward next level -->
    <div class="flex-1 min-w-0">

      </div>

    <!-- Games -->

    <!-- Study streak: days in a row he answered at least one question -->
    <div class="flex items-center gap-1 rounded-full bg-black/45 backdrop-blur-md px-2.5 py-1.5 ring-1 ring-white/15 shrink-0" title="Days in a row with a question answered">

<!-- ==================================================================
     ENGINE
     Scoring, recall, gestures, persistence. Nothing below needs editing
     to change the weekly lesson: that's the CONTENT block at the bottom.

     How XP works, on purpose:
       - XP comes ONLY from answering questions right. Scrolling, tapping
         and opening the app earn nothing.
       - Each reel's question pays once, on the first try.
       - On a new day, up to 3 earlier questions come back as a warm-up,
         missed ones first. Remembering one pays again.
       - A bonus question, shown after the reel's own, can only be answered
         from the chapter or the lesson page. It pays the most.
       - The streak counts days in a row with at least one answer.
     ================================================================== -->
<script>
const TreasureUp = (function () {
  'use strict';

  const STORE_KEY = 'treasureup.v1';

  const XP = { firstTry: 20, recall: 15, bonus: 25 };
  const RECALL_PER_DAY = 3;

  // Level titles double as the level cap (8 levels).
  const LEVEL_TITLES = [
    'Seeker', 'Reader', 'Truth Tracker', 'Rod Holder',
    'Searcher', 'Watchman', "Prophet's Apprentice", 'Disciple'
  ];

  // Cumulative XP needed to *reach* level L. L1=0, L2=80, L3=240, L4=480.
  const xpAt = L => 40 * (L - 1) * L;
  const levelFor = xp => {
    let L = 1;
    while (L < LEVEL_TITLES.length && xpAt(L + 1) <= xp) L++;
    return L;
  };

  // Where "open scriptures" links go. Add a book here if a verse box
  // ever quotes one that isn't listed.
  const BOOK_PATHS = {
    'Isaiah': 'ot/isa', 'Genesis': 'ot/gen', 'Exodus': 'ot/ex', 'Psalms': 'ot/ps',
    '1 Nephi': 'bofm/1-ne', '2 Nephi': 'bofm/2-ne', 'Mosiah': 'bofm/mosiah', 'Alma': 'bofm/alma',
    'Matthew': 'nt/matt', 'John': 'nt/john', 'Revelation': 'nt/rev',
    'D&C': 'dc-testament/dc', 'Moses': 'pgp/moses'
  };

  /* ---------------- state ---------------- */

  let WEEK = null;
  let S = null;
  let booted = false;

  const freshState = () => ({
    xp: 0,
    streak: 0, lastStudy: null,  // streak = consecutive days with an answer
    answers: {},  // reelId -> { right, day }   first try at the reel's question
    bonus: {},    // reelId -> { right, day }   first try at its bonus question
    recall: {},   // reelId -> { last, misses } last day it came back, times missed
    daily: null,  // { day, ids: [...], done: { reelId: right } }
    freezes: 0,   // streak freezes: each covers one missed day, used automatically
    puzzle: null, // this week's puzzle: { week, day, solved: [groups], mistakes, status, rewarded }
    sayings: {},  // Who said it?: sayingId -> { right }  first try
    notes: {},    // his journal: reelId -> { text, day, hook, ref, rewarded }; kept across weeks
    words: {},    // Verse Word by day: { word, guesses, status, paid }
    climbDay: null,  // last day a Scripture Climb paid XP
    sayRecall: {},   // sayingId -> last day it came back in a warm-up
    history: [],     // finished weeks, for the year trail: { title, num, right, answered }
    weekTitle: null, weekNum: null
  });

  // Every storage access is wrapped: private windows and blocked site data
  // throw here, and the app should still work when they do.
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(freshState(), JSON.parse(raw));
    } catch (e) { /* fall through to a fresh profile */ }
    return freshState();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------------- dates ---------------- */

  const dayKey = (d = new Date()) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const dayDiff = (a, b) =>
    Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

  // The streak shown is 0 once a whole day has been missed.
  // Days missed since the last study day (0 if he studied today or yesterday).
  const missedDays = () => S.lastStudy ? Math.max(0, dayDiff(S.lastStudy, dayKey()) - 1) : 0;

  // A streak survives missed days he has freezes for.
  const liveStreak = () =>
    !S.lastStudy ? 0 : missedDays() <= (S.freezes || 0) ? S.streak : 0;

  function markStudied() {
    const today = dayKey();
    if (S.lastStudy === today) return;
    const missed = missedDays();
    if (S.lastStudy && missed === 0) S.streak += 1;
    else if (S.lastStudy && missed <= (S.freezes || 0)) {
      S.freezes -= missed;                       // spend a freeze per missed day
      S.streak += 1;
      toast('❄️ Streak saved', missed === 1 ? 'Used a streak freeze' : 'Used ' + missed + ' streak freezes');
    } else S.streak = 1;
    S.lastStudy = today;
  }

  // Pick today's warm-up: questions answered on an earlier day, missed ones
  // first, then the ones that have gone longest without coming back.
  function rollDay() {
    const today = dayKey();
    if (S.daily && S.daily.day === today) return;
    const live = new Set(WEEK.reels.map(r => r.id));
    const ids = Object.keys(S.answers)
      .filter(id => live.has(id) && S.answers[id].day < today)
      .map(id => {
        const a = S.answers[id], rc = S.recall[id] || {};
        const missed = !a.right || (rc.misses || 0) > 0;
        return { id, missed, last: rc.last || a.day };
      })
      .sort((x, y) => (y.missed - x.missed) || (x.last < y.last ? -1 : x.last > y.last ? 1 : 0))
      .slice(0, RECALL_PER_DAY)
      .map(x => x.id);
    let say = null;
    if (ids.length && WEEK.sayings && WEEK.sayings.length) {
      const seen = S.sayRecall || {};
      say = WEEK.sayings
        .map(x => ({ id: x.id, missed: !(S.sayings[x.id] && S.sayings[x.id].right), last: seen[x.id] || '' }))
        .sort((a, b) => (b.missed - a.missed) || (a.last < b.last ? -1 : a.last > b.last ? 1 : 0))[0].id;
    }
    S.daily = { day: today, ids, done: {}, say, sayDone: null };
  }

  /* ---------------- helpers ---------------- */

  const $ = id => document.getElementById(id);

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const reduceMotion = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const reelById = id => WEEK.reels.find(r => r.id === id);

  // "Isaiah 14:13–14" -> the chapter page, scrolled to the first verse.
  // `chapterOnly` opens the top of the chapter instead, for bonus questions,
  // so the link doesn't point straight at the answer.
  function readLink(ref, chapterOnly) {
    const m = /^(.+?) (\d+):(\d+)/.exec(ref || '');
    if (!m || !BOOK_PATHS[m[1]]) return null;
    return 'https://www.churchofjesuschrist.org/study/scriptures/' + BOOK_PATHS[m[1]] +
      '/' + m[2] + '?lang=eng' + (chapterOnly ? '' : '&id=p' + m[3] + '#p' + m[3]);
  }

  // Answer order is shuffled so the right one isn't always first. Seeded,
  // so a reel shows the same order every time; recall uses a different seed
  // so he has to read the choices again, not remember a position.
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function choicesFor(q, seed) {
    const list = [q.right].concat(q.wrong);
    let h = hash(seed);
    for (let i = list.length - 1; i > 0; i--) {
      h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
      const j = h % (i + 1);
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  /* ---------------- rendering ---------------- */

  function backdrop(r) {
    const photo = r.media && r.media.image;
    return `
      <div class="absolute inset-0" style="background-image:${r.gradient || 'linear-gradient(150deg,#1e293b,#0f172a)'}"></div>
      ${photo
        ? `<img class="reel-photo" src="${esc(photo.src)}" alt="${esc(photo.alt)}" decoding="async">`
        : `<div class="blob" style="width:58vw;height:58vw;left:-14vw;top:8vh;background:${r.blobA || 'rgba(255,255,255,.28)'}"></div>
           <div class="blob" style="width:48vw;height:48vw;right:-10vw;top:42vh;background:${r.blobB || 'rgba(0,0,0,.3)'};animation-delay:-6s"></div>`}
      <div class="scrim"></div>`;
  }

  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  // Where a page can't embed players (the private preview), the card is a
  // plain link that opens YouTube at the clip's start instead.
  function clipHtml(v) {
    const inner = `
        <span class="clip-play">▶</span>
        <span>
          <span class="clip-title block">${esc(v.title)}</span>
          <span class="clip-meta block">${fmtTime(v.end - v.start)} clip · ${esc(v.channel)}${window.TU_NO_EMBED ? ' · opens YouTube' : ''}${v.previewed === true ? '' : ' · not approved yet, hidden in the app'}</span>
        </span>`;
    return window.TU_NO_EMBED
      ? `<a class="clip" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.youtube)}&t=${v.start}s" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<button class="clip" data-clip="${esc(v.youtube)}" data-start="${v.start}" data-end="${v.end}" aria-label="Play clip: ${esc(v.title)}">${inner}</button>`;
  }

  // A reel can have one bonus or several; each shows once the one before it
  // is answered. A bonus's `source` is a verse ("Isaiah 22:15"), "lesson",
  // or a Gospel Library page (the Friend, For the Strength of Youth, the
  // Liahona, the manual).
  const bonusesOf = r => !r.bonus ? [] : Array.isArray(r.bonus) ? r.bonus : [r.bonus];
  const bonusKey = (id, n) => id + '#' + n;

  function sourceLabel(src) {
    if (src === 'lesson' || /\/study\/manual\//.test(src)) return "this week's lesson";
    if (/\/study\/friend\//.test(src)) return 'the Friend';
    if (/\/study\/ftsoy\//.test(src)) return 'For the Strength of Youth';
    if (/\/study\/liahona\//.test(src)) return 'the Liahona';
    if (/^https:\/\//.test(src)) return 'Gospel Library';
    return src.replace(/:.*/, '');            // "Isaiah 22:15" -> "Isaiah 22"
  }
  function sourceLink(src) {
    if (src === 'lesson') return WEEK.lesson;
    if (/^https:\/\//.test(src)) return src;
    return readLink(src, true);
  }

  // One question block. `kind` is 'reel', 'recall' or 'bonus' (with its
  // index `n`); `picked` is the choice he already made, if any.
  function quizHtml(r, kind, picked, n) {
    const q = kind === 'bonus' ? bonusesOf(r)[n] : r.question;
    const seed = kind === 'recall' ? r.id + '|' + S.daily.day : kind === 'bonus' ? r.id + '|bonus' + n : r.id;
    const choices = choicesFor(q, seed);
    const done = picked != null;
    const where = kind === 'bonus' ? sourceLabel(q.source) : '';
    const label = kind === 'recall' ? 'Remember this? · +' + XP.recall + ' XP'
      : kind === 'bonus' ? 'Bonus · find it in ' + where + ' · +' + XP.bonus + ' XP'
      : 'Quick check · +' + XP.firstTry + ' XP if right';
    const findLink = kind === 'bonus' && !done
      ? `<a class="find-link" href="${esc(sourceLink(q.source))}" target="_blank" rel="noopener noreferrer">Open ${esc(where)} ↗</a>`
      : '';

    const buttons = choices.map(c => {
      const right = c === q.right;
      const cls = done ? (right ? ' is-right' : c === picked ? ' is-wrong' : '') : '';
      const mark = done ? (right ? '✓' : c === picked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-choice="${esc(c)}" ${done ? 'disabled' : ''}>
                <span class="mark">${mark}</span><span>${esc(c)}</span></button>`;
    }).join('');

    let why = '';
    if (done) {
      const ok = picked === q.right;
      why = `<p class="quiz-why">${ok ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${esc(q.why)}` +
            (kind === 'recall' ? `<br><span class="text-white/55 text-[12px]">From “${esc(r.hook)}” · ${esc(r.verse.ref)}</span>` : '') +
            (!ok && kind === 'reel' ? `<br><span class="text-white/55 text-[12px]">You'll see this one again in a warm-up.</span>` : '') +
            `</p>`;
    }

    return `
      <div class="quiz${done ? ' done' : ''}${kind === 'bonus' ? ' bonus' : ''}" data-quiz="${esc(r.id)}" data-kind="${kind}"${kind === 'bonus' ? ` data-n="${n}"` : ''}>
        <div class="eyebrow" style="color:var(--gold)">${label}</div>
        <p class="quiz-q">${esc(q.q)}</p>
        ${findLink}
        <div class="quiz-choices">${buttons}</div>
        ${why}
      </div>`;
  }

  function reelHtml(r, i) {
    const link = readLink(r.verse.ref);
    const a = S.answers[r.id];
    const picked = a ? a.picked : null;
    const media = r.media || {};
    const photo = media.image;
    const credit = photo
      ? `<div class="credit">Picture: <a href="${esc(photo.link)}" target="_blank" rel="noopener noreferrer">${esc(photo.credit)}</a></div>`
      : '';
    // Bonuses show once he's answered the reel's own question, one at a
    // time: the next appears after he answers the one before.
    let bonus = '';
    if (a) {
      for (let n = 0; n < bonusesOf(r).length; n++) {
        const b = S.bonus[bonusKey(r.id, n)];
        bonus += quizHtml(r, 'bonus', b ? b.picked : null, n);
        if (!b) break;
      }
    }
    return `
    <article class="reel${photo ? ' has-photo' : ''}" data-id="${esc(r.id)}" data-index="${i}">
      ${backdrop(r)}
      <div class="relative z-20 px-5 pr-7 content-pad">
        <div class="eyebrow">${esc(WEEK.sections[r.section])}</div>
        ${credit}
        <h2 class="reel-hook">${esc(r.hook)}</h2>
        <p class="reel-body">${esc(r.body)}</p>
        ${media.video && (media.video.previewed === true || window.TU_NO_EMBED) ? clipHtml(media.video) : ''}

        <div class="mt-4 rounded-2xl bg-black/35 backdrop-blur-sm ring-1 ring-white/15 px-4 py-3">
          <p class="verse-text font-medium text-white/95">“${esc(r.verse.text)}”</p>
          <div class="mt-2 flex items-center justify-between gap-3">
            <span class="text-[11px] font-bold tracking-wide text-amber-300">${esc(r.verse.ref)}</span>
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer"
                         class="text-[11px] font-semibold text-white/60 underline decoration-white/30 shrink-0">read the chapter ↗</a>` : ''}
          </div>
        </div>

        ${quizHtml(r, 'reel', picked)}
        ${bonus}
        ${a ? noteHtml(r) : ''}
      </div>
    </article>`;
  }

  function recallHtml(r, n, total, i) {
    const done = S.daily.done[r.id];
    return `
    <article class="reel" data-id="recall-${esc(r.id)}" data-index="${i}">
      ${backdrop({ gradient: 'linear-gradient(160deg,#0b1020 0%,#1c1433 55%,#2a1b10 100%)', blobA: 'rgba(252,211,77,.22)', blobB: 'rgba(0,0,0,.5)' })}
      <div class="relative z-20 px-5 pr-7 content-pad">
        <div class="eyebrow">Warm-up · ${n} of ${total}</div>
        <h2 class="reel-hook">From earlier this week</h2>
        <p class="reel-body text-white/70">No peeking at the verse. See what you remember.</p>
        ${quizHtml(r, 'recall', done == null ? null : done.picked)}
        ${done != null ? keepGoingHtml() : ''}
      </div>
    </article>`;
  }

  function introHtml(i) {
    return `
    <article class="reel" data-id="intro" data-index="${i}">
      ${backdrop({ gradient: 'linear-gradient(155deg,#1e1b4b 0%,#4c1d95 50%,#a16207 118%)', blobA: 'rgba(167,139,250,.45)', blobB: 'rgba(0,0,0,.45)' })}
      <div class="relative z-20 px-5 pr-7 content-pad">
        <div class="eyebrow">Come, Follow Me · ${esc(WEEK.dates)}</div>
        <h2 class="reel-hook" style="font-size:clamp(28px,4.4vh,38px)">${esc(WEEK.title)}</h2>
        <p class="text-[15px] font-bold text-amber-300">${esc(WEEK.reference)}</p>
        <div class="mt-5 space-y-2.5 reel-body">
          <p>${WEEK.reels.length} reels. Each one ends with a quick question.</p>
          <p>You only earn XP for right answers.</p>
          <p>Questions you miss come back in the daily warm-ups.</p>
        </div>
        <a href="${esc(WEEK.lesson)}" target="_blank" rel="noopener noreferrer"
           class="mt-5 inline-block text-[13px] font-semibold text-white/75 underline decoration-white/30">Open this week's lesson ↗</a>
        ${trailHtml()}
        ${boardLinkHtml()}
        ${rewardsHtml()}
      </div>
    </article>`;
  }

  function endHtml(i) {
    const answered = WEEK.reels.filter(r => S.answers[r.id]);
    const right = answered.filter(r => S.answers[r.id].right).length;
    const total = WEEK.reels.length;
    const headline = answered.length === total
      ? `You got ${right} of ${total} right the first time.`
      : `${answered.length} of ${total} questions answered so far.`;
    const allBonus = WEEK.reels.flatMap(r => bonusesOf(r).map((_, n) => bonusKey(r.id, n)));
    const found = allBonus.filter(k => S.bonus[k] && S.bonus[k].right).length;
    const bonusLine = allBonus.length
      ? `<p class="reel-body mt-3"><b class="text-amber-300">Bonus:</b> found ${found} of ${allBonus.length} answers in the reading.</p>`
      : '';

    const rows = WEEK.reels.map(r => {
      const a = S.answers[r.id];
      const st = !a ? '<span class="st st-open">•</span>'
               : a.right ? '<span class="st st-right">✓</span>'
               : '<span class="st st-wrong">✕</span>';
      return `<div class="report-row">${st}<span class="text-white/85">${esc(r.hook)}</span></div>`;
    }).join('');

    return `
    <article class="reel" data-id="end" data-index="${i}">
      ${backdrop({ gradient: 'linear-gradient(150deg,#052e16 0%,#065f46 48%,#0f766e 100%)', blobA: 'rgba(110,231,183,.35)', blobB: 'rgba(0,0,0,.45)' })}
      <div class="relative z-20 px-5 pr-7 content-pad">
        <div class="eyebrow">End of this week's feed</div>
        <h2 class="reel-hook" id="endHeadline">${esc(headline)}</h2>
        <div class="mt-2 space-y-1.5" id="endRows">${rows}</div>
        ${bonusLine}
        ${notesLine()}
        <p class="reel-body mt-4">Missed ones come back in the daily warm-ups.</p>
        <p class="reel-body mt-2">The feed is a start. This week's reading is <b class="text-amber-300">${esc(WEEK.reference)}</b>.</p>
        <a href="${esc(WEEK.lesson)}" target="_blank" rel="noopener noreferrer"
           class="mt-4 inline-block text-[13px] font-semibold text-white/75 underline decoration-white/30">Open this week's lesson ↗</a>
        ${boardLinkHtml()}
        ${rewardsHtml()}
      </div>
    </article>`;
  }

  function renderFeed() {
    // The week cover sits at the very top, one swipe back from wherever
    // the app opens (see landingCard).
    const cards = [introHtml];
    const recall = S.daily.ids.map(reelById).filter(Boolean);
    recall.forEach((r, n) => cards.push(i => recallHtml(r, n + 1, recall.length, i)));
    if (S.daily.say && (WEEK.sayings || []).some(x => x.id === S.daily.say)) cards.push(sayRecallHtml);
    WEEK.reels.forEach(r => cards.push(i => reelHtml(r, i)));
    if (WEEK.puzzle) cards.push(puzzleCardHtml);
    cards.push(endHtml);

    $('feed').innerHTML = cards.map((make, i) => make(i)).join('');
    $('rail').innerHTML = cards.map(() => '<div class="rail-dot"></div>').join('');
  }

  // Where the app opens: today's warm-up if any is left, otherwise the next
  // reel he hasn't answered, so he never swipes past finished work. A fresh
  // week opens on its cover; a finished week on the puzzle, then the report.
  const warmupsLeft = () =>
    S.daily.ids.filter(id => !S.daily.done[id]).map(id => 'recall-' + id)
      .concat(S.daily.say && !S.daily.sayDone ? ['say-' + S.daily.say] : []);
  function landingCard() {
    const warm = warmupsLeft();
    if (warm.length) return warm[0];
    if (!WEEK.reels.some(r => S.answers[r.id])) return 'intro';
    const next = WEEK.reels.find(r => !S.answers[r.id]);
    if (next) return next.id;
    return WEEK.puzzle && puzzleState().status !== 'won' ? 'puzzle' : 'end';
  }
  function goToCard(id, smooth) {
    const el = document.querySelector('.reel[data-id="' + id + '"]');
    if (el) $('feed').scrollTo({ top: el.offsetTop, behavior: smooth && !reduceMotion() ? 'smooth' : 'auto' });
  }
  // Shown on the warm-up card that finishes today's warm-up.
  function keepGoingHtml() {
    if (warmupsLeft().length) return '';
    const next = landingCard();
    const where = next === 'puzzle' ? 'the weekly puzzle' : next === 'end' ? 'your week' : 'your next reel';
    return `<button class="board-link" data-jump>Keep going ↓<small>On to ${where}</small></button>`;
  }

  // Redraw one card in place after an answer, keeping its inner scroll.
  function redrawCard(dataId, html) {
    const old = document.querySelector('.reel[data-id="' + dataId + '"]');
    if (!old) return;
    const pad = old.querySelector('.content-pad');
    const top = pad ? pad.scrollTop : 0;
    const tmp = document.createElement('div');
    tmp.innerHTML = html.trim();
    const card = tmp.firstElementChild;
    old.replaceWith(card);
    const pad2 = card.querySelector('.content-pad');
    if (pad2) pad2.scrollTop = top;
    if (observer) observer.observe(card);
  }

  function refreshEnd() {
    const end = document.querySelector('.reel[data-id="end"]');
    if (end) redrawCard('end', endHtml(Number(end.dataset.index)));
  }

  /* ---------------- HUD ---------------- */

  function renderHud() {
    const L = levelFor(S.xp);
    const capped = L >= LEVEL_TITLES.length;
    const floor = xpAt(L);
    const ceil = capped ? floor : xpAt(L + 1);
    const pct = capped ? 100 : Math.max(0, Math.min(100, ((S.xp - floor) / (ceil - floor)) * 100));

    $('levelNum').textContent = L;
    $('levelTitle').textContent = LEVEL_TITLES[L - 1];
    $('xpText').textContent = S.xp + ' XP';
    $('xpFill').style.width = pct + '%';
    $('nextLevel').textContent = capped
      ? 'Top level reached'
      : (ceil - S.xp) + ' XP to ' + LEVEL_TITLES[L];
    $('streakNum').textContent = liveStreak();
    $('freezeNum').hidden = !(S.freezes > 0);
    $('freezeNum').textContent = '❄️' + (S.freezes || 0);
  }

  /* ---------------- XP ---------------- */

  function grantXp(amount, reason) {
    const beforeXp = S.xp;
    const before = levelFor(S.xp);
    S.xp += amount;
    const after = levelFor(S.xp);
    toast('＋' + amount + ' XP', reason);
    P.rewards
      .filter(r => !r.claimed && beforeXp < r.xp && S.xp >= r.xp)
      .forEach(r => toast('🎁 Reward unlocked', r.text + ' · show a parent'));
    renderHud();
    if (P.rewards.length) refreshCards();
    if (after > before) levelUp(after);
  }

  let lvTimer = null;
  function levelUp(L) {
    $('lvNum').textContent = L;
    $('lvTitle').textContent = LEVEL_TITLES[L - 1];
    $('levelup').classList.add('show');
    clearTimeout(lvTimer);
    lvTimer = setTimeout(closeLevelUp, 5000);
  }
  function closeLevelUp() {
    clearTimeout(lvTimer);
    $('levelup').classList.remove('show');
  }

  function toast(big, small) {
    const wrap = $('toasts');
    while (wrap.children.length >= 2) wrap.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast max-w-[86%] flex items-center gap-2.5 rounded-full bg-black/80 backdrop-blur-md px-4 py-2 ring-1 ring-amber-300/40';
    el.innerHTML = '<span class="text-[13px] font-black text-amber-300">' + esc(big) + '</span>' +
                   (small ? '<span class="text-[11px] font-semibold text-white/70 truncate">' + esc(small) + '</span>' : '');
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }

  /* ---------------- answering ---------------- */

  function answer(quiz, picked) {
    const id = quiz.dataset.quiz;
    const kind = quiz.dataset.kind;
    const r = reelById(id);
    if (!r) return;
    const n = Number(quiz.dataset.n);
    const right = picked === (kind === 'bonus' ? bonusesOf(r)[n].right : r.question.right);
    const today = dayKey();

    if (kind === 'bonus') {
      const key = bonusKey(id, n);
      if (S.bonus[key]) return;                  // first try only
      S.bonus[key] = { right, picked, day: today };
      markStudied();
      if (right) grantXp(XP.bonus, 'Found it in the reading');
      const card = quiz.closest('.reel');
      redrawCard(id, reelHtml(r, Number(card.dataset.index)));
      refreshEnd();
    } else if (kind === 'reel') {
      if (S.answers[id]) return;                 // first try only
      S.answers[id] = { right, picked, day: today };
      markStudied();
      if (right) grantXp(XP.firstTry, 'Got it the first time');
      const card = quiz.closest('.reel');
      redrawCard(id, reelHtml(r, Number(card.dataset.index)));
      refreshEnd();
      refreshPuzzleCard();
    } else {
      if (S.daily.done[id]) return;
      S.daily.done[id] = { right, picked };
      const rc = S.recall[id] || { misses: 0 };
      S.recall[id] = { last: today, misses: right ? 0 : (rc.misses || 0) + 1 };
      markStudied();
      if (right) grantXp(XP.recall, 'Remembered it');
      const card = quiz.closest('.reel');
      const n = S.daily.ids.indexOf(id) + 1;
      redrawCard('recall-' + id, recallHtml(r, n, S.daily.ids.length, Number(card.dataset.index)));
    }
    renderHud();
    save();
  }

  /* ---------------- clips ---------------- */

  // YouTube's player script loads on the first tap, never before.
  let ytReady = null;
  function loadYouTube() {
    if (!ytReady) ytReady = new Promise((resolve, reject) => {
      if (window.YT && window.YT.Player) return resolve();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = () => { ytReady = null; reject(new Error('YouTube did not load')); };
      document.head.appendChild(s);
    });
    return ytReady;
  }

  const players = new Set();

  // Swap the card for the player only when he taps, so nothing from YouTube
  // loads while he scrolls. The player plays just start..end inside the
  // reel, and the moment the clip ends it is replaced by a "Watched" card,
  // so YouTube's grid of suggested videos never appears.
  async function playClip(el) {
    const v = { id: el.dataset.clip, start: Number(el.dataset.start), end: Number(el.dataset.end) };
    const card = el.cloneNode(true);              // put back when the clip ends
    const frame = document.createElement('div');
    frame.className = 'clip-frame';
    const mount = document.createElement('div');
    frame.appendChild(mount);
    el.replaceWith(frame);

    try { await loadYouTube(); }
    catch (e) { frame.replaceWith(card); toast('No internet', 'Videos need a connection'); return; }

    let done = false, timer = null, player = null;
    const finish = () => {
      if (done) return;
      done = true;
      clearInterval(timer);
      players.delete(player);
      try { player.destroy(); } catch (e) {}
      card.classList.add('watched');
      card.querySelector('.clip-play').textContent = '✓';
      card.querySelector('.clip-meta').textContent = 'Watched · tap to watch again';
      frame.replaceWith(card);
    };

    player = new YT.Player(mount, {
      host: 'https://www.youtube-nocookie.com',
      width: '100%', height: '100%',
      videoId: v.id,
      playerVars: { start: v.start, end: v.end, autoplay: 1, rel: 0, playsinline: 1, iv_load_policy: 3 },
      events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED) finish(); } }
    });
    frame._player = player;
    players.add(player);
    // Backstop in case the end event is late: stop at `end` regardless.
    timer = setInterval(() => {
      try { if (player.getCurrentTime && player.getCurrentTime() >= v.end - 0.25) finish(); } catch (e) {}
    }, 400);
  }

  // A clip on a reel he has swiped away from pauses instead of playing on.
  function pauseOffscreen(current) {
    players.forEach(p => {
      try {
        if (!current.contains(p.getIframe()) && p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo();
      } catch (e) {}
    });
  }

  /* ---------------- family rewards ---------------- */

  // A parent sets rewards at XP marks ("Pick Friday's movie at 300 XP").
  // XP only comes from right answers, so a reward is earned by
  // understanding. Kept apart from his progress so it survives a new week.
  // The PIN just keeps an 11-year-old from editing his own rewards; it is
  // not security.
  const PARENT_KEY = 'treasureup.parent';
  let P = { pin: null, rewards: [] };
  let parentUnlocked = false;
  let draft = [];

  function loadParent() {
    try {
      const raw = localStorage.getItem(PARENT_KEY);
      if (raw) return Object.assign({ pin: null, rewards: [] }, JSON.parse(raw));
    } catch (e) {}
    return { pin: null, rewards: [] };
  }
  function saveParent() {
    try { localStorage.setItem(PARENT_KEY, JSON.stringify(P)); } catch (e) {}
  }

  function rewardsHtml() {
    const open = P.rewards.filter(r => !r.claimed).sort((a, b) => a.xp - b.xp);
    const rows = open.map(r => {
      const got = S.xp >= r.xp;
      const pct = Math.min(100, Math.round((S.xp / r.xp) * 100));
      return `
        <div class="reward${got ? ' unlocked' : ''}">
          <div class="flex justify-between items-baseline gap-3">
            <span class="font-bold">${esc(r.text)}</span>
            <span class="text-[12px] shrink-0 ${got ? 'text-emerald-300 font-bold' : 'text-white/60'}">${got ? 'Unlocked! Show a parent' : Math.min(S.xp, r.xp) + ' / ' + r.xp + ' XP'}</span>
          </div>
          <div class="reward-bar"><div style="width:${pct}%"></div></div>
        </div>`;
    }).join('');
    return `
      <div class="mt-5">
        <div class="eyebrow">Family rewards</div>
        ${rows || '<p class="text-[13px] text-white/60 mt-1">No rewards set up yet.</p>'}
        <button class="parent-link" data-parent>Parents: set up rewards</button>
      </div>`;
  }

  const boardLinkHtml = () => `
    <button class="board-link" data-board>Scripture Showdown
      <small>A quiz-show game on this week's questions, for the whole family</small></button>`;

  // Intro and end cards show XP progress toward rewards; redraw both.
  function refreshCards() {
    ['intro', 'end'].forEach(id => {
      const el = document.querySelector('.reel[data-id="' + id + '"]');
      if (el) redrawCard(id, (id === 'intro' ? introHtml : endHtml)(Number(el.dataset.index)));
    });
  }

  function openParent() {
    parentUnlocked = false;
    renderParent();
    $('parent').hidden = false;
  }
  function closeParent() {
    $('parent').hidden = true;
    parentUnlocked = false;
  }

  function rewardRow(r, n) {
    return `
      <div class="reward-row" data-row="${n}">
        <input class="field" type="number" inputmode="numeric" min="1" step="10" value="${r.xp || ''}" placeholder="XP" aria-label="XP needed" data-f="xp">
        <input class="field" type="text" maxlength="60" value="${esc(r.text || '')}" placeholder="Pick Friday's movie" aria-label="Reward" data-f="text">
        <label class="claim"><input type="checkbox" data-f="claimed" ${r.claimed ? 'checked' : ''}> Given</label>
      </div>`;
  }

  function renderParent(msg) {
    const body = $('parentBody');
    const note = msg ? `<p class="parent-msg">${esc(msg)}</p>` : '';
    if (!P.pin) {
      body.innerHTML = `
        <p class="text-[14px] text-white/75 mt-2">Choose a 4-digit parent PIN so rewards can't be changed without you.</p>
        ${note}
        <label class="block mt-4 text-[12px] text-white/60" for="pinNew">New PIN</label>
        <input id="pinNew" class="field" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
        <label class="block mt-3 text-[12px] text-white/60" for="pinAgain">Type it again</label>
        <input id="pinAgain" class="field" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
        <div class="board-actions"><button class="btn" data-act="setpin">Save PIN</button></div>`;
      return;
    }
    if (!parentUnlocked) {
      body.innerHTML = `
        ${note}
        <label class="block mt-3 text-[12px] text-white/60" for="pinEnter">Parent PIN</label>
        <input id="pinEnter" class="field" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
        <div class="board-actions"><button class="btn" data-act="unlock">Unlock</button></div>`;
      return;
    }
    body.innerHTML = `
      <p class="text-[14px] text-white/75 mt-2">He has <b class="text-amber-300">${S.xp} XP</b>. XP only comes from right answers, so every reward is earned by understanding.</p>
      <p class="text-[12px] text-white/50 mt-1">Tick Given once he's had it. Clear a reward's text to remove it.</p>
      ${note}
      <div class="grid gap-2 mt-4" id="rewardRows">${draft.map(rewardRow).join('')}</div>
      <div class="board-actions">
        <button class="btn ghost" data-act="add">Add a reward</button>
        <button class="btn" data-act="save">Save</button>
      </div>
      <div class="eyebrow" style="margin-top:22px">His notes</div>
      ${journalHtml()}`;
  }

  function journalHtml() {
    const notes = Object.values(S.notes).sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));
    if (!notes.length) return '<p class="text-[13px] text-white/60 mt-1">No notes yet.</p>';
    return notes.map(n => `
      <div class="journal-item">
        <div class="text-[12px] text-white/55">${esc(n.day)} · ${esc(n.ref)} · ${esc(n.hook)}</div>
        <p class="text-[14px] mt-1" style="white-space:pre-wrap">${esc(n.text)}</p>
      </div>`).join('');
  }

  const readRows = () => [...document.querySelectorAll('#rewardRows .reward-row')].map(row => ({
    xp: Math.round(Number(row.querySelector('[data-f="xp"]').value)),
    text: row.querySelector('[data-f="text"]').value.trim(),
    claimed: row.querySelector('[data-f="claimed"]').checked
  }));

  function parentAction(act) {
    if (act === 'setpin') {
      const a = $('pinNew').value, b = $('pinAgain').value;
      if (!/^\d{4}$/.test(a)) return renderParent('The PIN needs exactly 4 digits.');
      if (a !== b) return renderParent("The two PINs don't match. Try again.");
      P.pin = a; saveParent();
      parentUnlocked = true; draft = [{ xp: 0, text: '', claimed: false }];
      renderParent('PIN saved. Now add a reward.');
    } else if (act === 'unlock') {
      if ($('pinEnter').value !== P.pin) return renderParent("That PIN isn't right.");
      parentUnlocked = true;
      draft = P.rewards.length ? P.rewards.map(r => Object.assign({}, r)) : [{ xp: 0, text: '', claimed: false }];
      renderParent();
    } else if (act === 'add') {
      draft = readRows().concat({ xp: 0, text: '', claimed: false });
      renderParent();
    } else if (act === 'save') {
      const rows = readRows();
      const bad = rows.find(r => r.text && !(r.xp > 0));
      if (bad) { draft = rows; return renderParent('"' + bad.text + '" needs an XP number above 0.'); }
      P.rewards = rows.filter(r => r.text);
      saveParent();
      closeParent();
      refreshCards();
      toast('Rewards saved', P.rewards.length + ' reward' + (P.rewards.length === 1 ? '' : 's'));
    }
  }

  /* ---------------- family board ---------------- */

  // Scripture Showdown: a quiz-show board built from this week's checked questions.
  // Columns are the lesson's sections; the reel questions are the low
  // values and the reading-only bonus questions the high ones, with one
  // bonus as a Daily Double. A parent hosts: reads each question out loud,
  // shows the answer, and taps who got it. Scores add up to a family total.
  const BOARD_KEY = 'treasureup.board';
  let G = null;           // { names, best, games: { [week title]: { players, done } } }
  let boardView = null;   // the open question: { tile, revealed }

  function loadBoard() {
    try {
      const raw = localStorage.getItem(BOARD_KEY);
      if (raw) return Object.assign({ names: [], best: 0, games: {} }, JSON.parse(raw));
    } catch (e) {}
    return { names: [], best: 0, games: {} };
  }
  function saveBoard() {
    try { localStorage.setItem(BOARD_KEY, JSON.stringify(G)); } catch (e) {}
  }

  function boardTiles() {
    const cols = WEEK.sections.map((name, s) => {
      const reels = WEEK.reels.filter(r => r.section === s);
      const clues = reels.map(r => ({ id: r.id + ':q', q: r.question }))
        .concat(reels.flatMap(r => bonusesOf(r).map((b, n) => ({ id: r.id + ':b' + n, q: b, bonus: true }))));
      clues.forEach((c, k) => { c.value = 100 * (k + 1); c.col = s; });
      return { name, clues };
    });
    const all = cols.flatMap(c => c.clues);
    const bonuses = all.filter(c => c.bonus);
    const dd = bonuses.length ? bonuses[hash(WEEK.title) % bonuses.length].id : null;
    return { cols, all, dd };
  }

  const game = () => G.games[WEEK.title];
  const worthOf = (t, dd) => t.id === dd ? t.value * 2 : t.value;

  function openBoard() {
    G = loadBoard();
    boardView = null;
    $('board').hidden = false;
    renderBoard();
  }
  function closeBoard() { $('board').hidden = true; }

  function renderBoard() {
    const g = game();
    const { cols, all, dd } = boardTiles();
    $('boardTitle').textContent = WEEK.title;
    $('boardScores').innerHTML = g
      ? g.players.map(p => `<span class="score-chip">${esc(p.name)}<b>${p.score}</b></span>`).join('')
      : '';
    const body = $('boardBody');

    if (!g) {
      const names = G.names.length ? G.names : [];
      body.innerHTML = `
        <div class="clue">
          <p class="clue-q">Who's playing?</p>
          <p class="board-help">Best on a laptop hooked up to the TV. A parent hosts: read each question out loud, let players answer out loud, then tap Show answer and pick who got it. Leave extra boxes empty.</p>
          <div class="board-names">${[0, 1, 2, 3, 4, 5].map(n =>
            `<input class="field" id="pl${n}" type="text" maxlength="16" placeholder="Player ${n + 1}" value="${esc(names[n] || '')}" aria-label="Player ${n + 1}">`).join('')}</div>
          <p id="boardMsg" class="parent-msg" hidden></p>
          <div class="board-actions"><button class="btn" data-act="start">Start the game</button></div>
        </div>`;
      return;
    }

    if (boardView) {
      const t = all.find(c => c.id === boardView.tile);
      const shown = boardView.revealed;
      const choices = choicesFor(t.q, 'board|' + t.id).map((c, n) => {
        const right = shown && c === t.q.right;
        return `<div class="choice${right ? ' is-right' : ''}"><span class="mark">${right ? '✓' : 'ABC'[n]}</span><span>${esc(c)}</span></div>`;
      }).join('');
      body.innerHTML = `
        <div class="clue">
          ${t.id === dd ? '<div class="dd-banner">Daily Double · worth double</div>' : ''}
          <div class="eyebrow">${esc(cols[t.col].name)} · ${worthOf(t, dd)}${t.bonus ? ' · from the reading' : ''}</div>
          <p class="clue-q">${esc(t.q.q)}</p>
          <div class="quiz clue-choices${shown ? ' done' : ''}"><div class="quiz-choices">${choices}</div></div>
          ${shown
            ? `<p class="quiz-why"><b class="ok">Answer:</b> ${esc(t.q.right)}. ${esc(t.q.why)}</p>
               <p class="board-help" style="margin-top:16px">Who got it? (${worthOf(t, dd)} points)</p>
               <div class="board-actions">${g.players.map((p, n) => `<button class="btn" data-award="${n}">${esc(p.name)}</button>`).join('')}
                 <button class="btn ghost" data-award="-1">Nobody</button></div>`
            : `<div class="board-actions"><button class="btn" data-act="reveal">Show answer</button>
                 <button class="btn ghost" data-act="back">Back to the board</button></div>`}
        </div>`;
      return;
    }

    if (Object.keys(g.done).length >= all.length) {
      const total = g.players.reduce((n, p) => n + p.score, 0);
      const ranked = g.players.slice().sort((a, b) => b.score - a.score);
      body.innerHTML = `
        <div class="clue">
          <div class="eyebrow">Game over</div>
          <p class="clue-q">Family total: ${total}</p>
          <p class="board-help">${g.newBest ? 'New family best!' : 'Family best: ' + G.best}</p>
          <div class="grid gap-2" style="margin-top:16px">${ranked.map(p => `<div class="score-row"><span>${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>
          <div class="board-actions">
            <button class="btn" data-act="again">Play again</button>
            <button class="btn ghost" data-act="players">Change players</button>
            <button class="btn ghost" data-act="exit">Done</button>
          </div>
        </div>`;
      return;
    }

    const rows = Math.max(...cols.map(c => c.clues.length));
    let grid = cols.map(c => `<div class="board-cat">${esc(c.name)}</div>`).join('');
    for (let k = 0; k < rows; k++) {
      grid += cols.map(c => {
        const t = c.clues[k];
        if (!t) return '<div class="tile empty"></div>';
        const d = g.done[t.id];
        return d
          ? `<button class="tile" disabled>${d.by == null ? '—' : esc(g.players[d.by].name)}</button>`
          : `<button class="tile" data-tile="${esc(t.id)}" aria-label="${esc(c.name)} for ${t.value}">${t.value}</button>`;
      }).join('');
    }
    body.innerHTML = `
      <div class="board-grid" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${grid}</div>
      <div class="board-actions"><button class="btn ghost" data-act="players">Change players</button></div>`;
  }

  function boardClick(e) {
    const el = e.target.closest('[data-tile],[data-act],[data-award]');
    if (!el) return;
    const g = game();

    if (el.dataset.tile) {
      boardView = { tile: el.dataset.tile, revealed: false };
    } else if (el.dataset.award != null) {
      const { all, dd } = boardTiles();
      const t = all.find(c => c.id === boardView.tile);
      const by = Number(el.dataset.award);
      if (by >= 0) g.players[by].score += worthOf(t, dd);
      g.done[t.id] = { by: by >= 0 ? by : null };
      boardView = null;
      if (Object.keys(g.done).length >= all.length) {
        const total = g.players.reduce((n, p) => n + p.score, 0);
        g.newBest = total > (G.best || 0);
        if (g.newBest) G.best = total;
      }
      saveBoard();
    } else {
      const act = el.dataset.act;
      if (act === 'start') {
        const names = [0, 1, 2, 3, 4, 5].map(n => $('pl' + n).value.trim()).filter(Boolean);
        if (!names.length) {
          const m = $('boardMsg'); m.textContent = 'Type at least one name.'; m.hidden = false;
          return;
        }
        G.names = names;
        G.games[WEEK.title] = { players: names.map(name => ({ name, score: 0 })), done: {} };
        saveBoard();
      } else if (act === 'reveal') {
        boardView.revealed = true;
      } else if (act === 'back') {
        boardView = null;
      } else if (act === 'again') {
        g.players.forEach(p => { p.score = 0; });
        g.done = {}; delete g.newBest;
        saveBoard();
      } else if (act === 'players') {
        delete G.games[WEEK.title];
        saveBoard();
      } else if (act === 'exit') {
        closeBoard();
        return;
      }
    }
    renderBoard();
    $('board').scrollTop = 0;
  }

  /* ---------------- notes ---------------- */

  // After a reel's question he can write a note in his own words. Saving
  // one pays XP once per reel. "Put it in my scriptures" copies it and
  // opens the verse in Gospel Library to paste as a note there: no outside
  // app can read Gospel Library notes, so the XP has to come from here.
  // Notes are kept across weeks, so they add up to a journal on his phone;
  // a parent can read them in the parent screen.
  const NOTE_XP = 10, NOTE_MIN_WORDS = 12;
  const noteEditing = new Set();
  const wordsIn = t => t.trim().match(/\S+/g) || [];

  function noteHtml(r) {
    const n = S.notes[r.id];
    const link = readLink(r.verse.ref);
    if (n && !noteEditing.has(r.id)) {
      return `
        <div class="note-box">
          <div class="eyebrow">Your note · ${esc(r.verse.ref)}</div>
          <p class="note-text">${esc(n.text)}</p>
          <div class="note-actions">
            ${link ? `<a class="note-btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer" data-note-copy="${esc(r.id)}">Put it in my scriptures ↗</a>` : ''}
            <button class="note-btn ghost" data-note-edit="${esc(r.id)}">Edit</button>
          </div>
          <p class="note-help">Copies your note and opens ${esc(r.verse.ref)} in Gospel Library. Select the verse, add a note, and paste.</p>
        </div>`;
    }
    return `
      <div class="note-box">
        <div class="eyebrow" style="color:var(--gold)">Write a note · +${NOTE_XP} XP</div>
        <label class="note-q" for="note-${esc(r.id)}">${esc(r.note || 'What does this mean for you? Write it in your own words.')}</label>
        <textarea id="note-${esc(r.id)}" class="field note-input" rows="3" maxlength="600" placeholder="At least ${NOTE_MIN_WORDS} words">${esc(n ? n.text : '')}</textarea>
        <p class="note-msg" data-note-msg="${esc(r.id)}"></p>
        <div class="note-actions"><button class="note-btn" data-note-save="${esc(r.id)}">Save note</button></div>
        <p class="note-help">Your parents can read your notes.</p>
      </div>`;
  }

  function notesLine() {
    const n = WEEK.reels.filter(r => S.notes[r.id]).length;
    return `<p class="reel-body mt-2"><b class="text-amber-300">Notes:</b> you wrote ${n} this week.</p>`;
  }

  function saveNote(id) {
    const r = reelById(id);
    const text = $('note-' + id).value.trim();
    const words = wordsIn(text);
    const msg = document.querySelector('[data-note-msg="' + id + '"]');
    if (words.length < NOTE_MIN_WORDS) { msg.textContent = 'Write at least ' + NOTE_MIN_WORDS + ' words (' + words.length + ' so far).'; return; }
    if (new Set(words.map(w => w.toLowerCase())).size < 6) { msg.textContent = 'Use your own words: say what it means to you.'; return; }
    const old = S.notes[id] || {};
    S.notes[id] = { text, day: old.day || dayKey(), hook: r.hook, ref: r.verse.ref, rewarded: !!old.rewarded };
    noteEditing.delete(id);
    markStudied();
    if (!S.notes[id].rewarded) { S.notes[id].rewarded = true; grantXp(NOTE_XP, 'Wrote a note'); }
    save();
    const card = document.querySelector('.reel[data-id="' + id + '"]');
    redrawCard(id, reelHtml(r, Number(card.dataset.index)));
    refreshEnd();
  }

  function editNote(id) {
    noteEditing.add(id);
    const card = document.querySelector('.reel[data-id="' + id + '"]');
    redrawCard(id, reelHtml(reelById(id), Number(card.dataset.index)));
    const box = $('note-' + id);
    if (box) box.focus();
  }

  // Copy inside the tap itself (browsers only allow it there); the link
  // then opens Gospel Library as normal.
  function copyNote(id) {
    const n = S.notes[id];
    try {
      navigator.clipboard.writeText(n.text).then(
        () => toast('Note copied', 'Paste it into your note in Gospel Library'),
        () => toast("Couldn't copy", 'Hold on your note to copy it'));
    } catch (e) { toast("Couldn't copy", 'Hold on your note to copy it'); }
  }

  /* ---------------- games ---------------- */

  // The 🎮 button opens the games menu: the weekly puzzle and Who said it?
  // (solo) and the family board (together, on the TV).
  const PUZZLE_XP = 40, SAY_XP = 5, PUZZLE_MISTAKES = 4;

  const reelsLeft = () => WEEK.reels.filter(r => !S.answers[r.id]).length;

  function shuffled(list, seed) {
    const out = list.slice();
    let h = hash(seed);
    for (let i = out.length - 1; i > 0; i--) {
      h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
      const j = h % (i + 1);
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // This week's puzzle progress. A lost try resets the next day.
  function puzzleState() {
    const today = dayKey();
    let pz = S.puzzle;
    if (!pz || pz.week !== WEEK.title) {
      pz = S.puzzle = { week: WEEK.title, day: today, solved: [], mistakes: 0, status: 'playing', rewarded: false };
    }
    if (pz.status === 'lost' && pz.day !== today) {
      Object.assign(pz, { day: today, solved: [], mistakes: 0, guesses: [], status: 'playing' });
    }
    return pz;
  }

  function puzzleStatus() {
    if (reelsLeft()) return 'Answer all ' + WEEK.reels.length + ' reels to unlock · ' + reelsLeft() + ' left';
    const pz = puzzleState();
    if (pz.status === 'won') return 'Solved ✓';
    if (pz.status === 'lost') return 'Out of tries today · new try tomorrow';
    return pz.rewarded ? 'Ready' : 'Ready · ' + PUZZLE_XP + ' XP and a streak freeze';
  }

  function puzzleCardHtml(i) {
    const locked = reelsLeft() > 0;
    const won = !locked && puzzleState().status === 'won';
    return `
    <article class="reel" data-id="puzzle" data-index="${i}">
      ${backdrop({ gradient: 'linear-gradient(155deg,#0c4a6e 0%,#1e1b4b 55%,#4c1d95 100%)', blobA: 'rgba(125,211,252,.35)', blobB: 'rgba(0,0,0,.45)' })}
      <div class="relative z-20 px-5 pr-7 content-pad">
        <div class="eyebrow">Weekly puzzle</div>
        <h2 class="reel-hook">${locked ? 'Unlock the weekly puzzle' : won ? 'Puzzle solved' : "Sort this week's ideas"}</h2>
        <p class="reel-body">Sixteen ideas from this week and four lesson sections. Put each idea where it belongs. Solve it for ${PUZZLE_XP} XP and a streak freeze, which saves your streak if you miss a day.</p>
        <p class="reel-body mt-3 font-bold text-amber-300">${esc(puzzleStatus())}</p>
        ${locked ? '' : `<button class="board-link" data-game="puzzle">${won ? 'See the solved puzzle' : 'Play the weekly puzzle'}</button>`}
      </div>
    </article>`;
  }

  function refreshPuzzleCard() {
    const el = document.querySelector('.reel[data-id="puzzle"]');
    if (el) redrawCard('puzzle', puzzleCardHtml(Number(el.dataset.index)));
  }

  const gameRow = (id, icon, title, desc, status, locked) => `
    <button class="game-row${locked ? ' locked' : ''}" data-game="${id}">
      <span class="gi">${icon}</span>
      <span><span class="gt block">${esc(title)}</span><span class="gd block">${esc(desc)}</span><span class="gs block">${esc(status)}</span></span>
    </button>`;

  function renderGames() {
    const rows = [];
    if (WEEK.puzzle) {
      rows.push(gameRow('puzzle', '🧩', 'Weekly puzzle', "Sort 16 ideas into this week's 4 lesson sections.", puzzleStatus(), reelsLeft() > 0));
    }
    if (WEEK.sayings && WEEK.sayings.length) {
      const got = WEEK.sayings.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
      rows.push(gameRow('sayings', '🗣️', 'Who said it?', 'Match ' + WEEK.sayings.length + ' lines from this week to who said them.', got + ' of ' + WEEK.sayings.length + ' right · ' + SAY_XP + ' XP each', false));
    }
    if (WEEK.words && WEEK.words.length) {
      rows.push(gameRow('word', '🔤', 'Verse Word', "Today's word is hiding in a verse. Six tries.", wordStatus(), false));
    }
    rows.push(gameRow('climb', '🪜', 'Scripture Climb', 'Ten questions, each worth more. Three lifelines.', climbStatus(), false));
    rows.push(gameRow('live', '📡', 'Live game', 'The TV shows the questions; everyone answers on their own phone or tablet.', 'Host or join with a code', false));
    rows.push(gameRow('board', '📺', 'Scripture Showdown', 'A quiz-show game for the whole family, best on the TV.', 'Play together', false));
    $('gamesBody').innerHTML = rows.join('');
  }

  function openGames() { renderGames(); $('games').hidden = false; }
  function closeGames() { $('games').hidden = true; }

  function startGame(id) {
    closeGames();
    if (id === 'board') openBoard();
    else if (id === 'puzzle') openPuzzle();
    else if (id === 'sayings') openSayings();
    else if (id === 'word') openWord();
    else if (id === 'climb') openClimb();
    else if (id === 'live') liveStart();
  }

  let playing = null;   // 'puzzle' | 'sayings'
  function openPlay(kind, eyebrow) {
    playing = kind;
    $('playEyebrow').textContent = eyebrow;
    $('playTitle').textContent = WEEK.title;
    $('play').hidden = false;
  }
  function closePlay() {
    $('play').hidden = true;
    playing = null;
    refreshPuzzleCard();
    renderHud();
  }

  /* ----- weekly puzzle: four groups of four, one per lesson section ----- */

  let pzSel = [], pzOrder = null, pzMsg = '';

  function openPuzzle() {
    pzSel = []; pzOrder = null; pzMsg = '';
    openPlay('puzzle', 'Weekly puzzle');
    renderPuzzle();
  }

  function renderPuzzle() {
    const body = $('playBody');
    if (reelsLeft()) {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">Locked for now</p>
          <p class="board-help">Answer all ${WEEK.reels.length} reels this week to unlock the puzzle. ${reelsLeft()} left.</p>
          <div class="board-actions"><button class="btn" data-pz="exit">Back to the feed</button></div>
        </div>`;
      return;
    }
    const pz = puzzleState();
    const groups = WEEK.puzzle.groups;
    const done = pz.status !== 'playing';
    const shownGroups = done ? groups.map((_, gi) => gi) : pz.solved;
    const solvedHtml = shownGroups.map(gi => {
      const g = groups[gi];
      return `<div class="pz-solved pz-c${gi}"><b>${esc(WEEK.sections[g.section])}</b>
        <span>${g.tiles.map(t => esc(t.text)).join(' · ')}</span>
        ${done ? `<small>${g.tiles.map(t => esc(t.ref)).join(' · ')}</small>` : ''}</div>`;
    }).join('');

    if (done) {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">${pz.status === 'won' ? 'Solved!' : 'Out of tries for today'}</p>
          <p class="board-help">${pz.status === 'won'
            ? 'Every idea is in its section. You earned ' + PUZZLE_XP + ' XP and a streak freeze ❄️.'
            : "Here's where everything goes. Tomorrow you get a new try."}</p>
          <div style="margin-top:14px">${solvedHtml}</div>
