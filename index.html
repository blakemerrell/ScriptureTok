  // drawn over the screen (not inside it), so a redraw doesn't cut it short.
  function riskMaybeRoll(g) {
    const d = g && g.dice;
    if (!rk || !g) return;
    if (rk.rolled === undefined) { rk.rolled = d ? d.n : 0; return; }  // this screen's first look: don't replay an old roll
    if (!d || d.n === rk.rolled) return;
    rk.rolled = d.n;
    const box = document.querySelector('#riskBody .rk-mapbox');
    if (!box || reduceMotion()) return;
    const r = box.getBoundingClientRect(), fx = document.createElement('div');
    fx.className = 'rk-fx';
    fx.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    fx.innerHTML = `<div class="rk-fx-row">${d.a.map(n => dieHtml(n, 'att')).join('')}<b>vs</b>${d.d.map(n => dieHtml(n, 'def')).join('')}</div>
      <div class="rk-fx-say">${d.won ? esc(landName(d.to)) + ' falls!' : esc(d.walls ? 'Behind the walls: ' : '') + (d.ld && !d.la ? 'the attack wins' : d.la && !d.ld ? 'the defenders hold' : 'both sides lose')}</div>`;
    $('risk').appendChild(fx);
    const faces = [...fx.querySelectorAll('.rk-die')], finals = d.a.concat(d.d);
    let k = 0;
    const spin = setInterval(() => {
      if (++k < 9) { faces.forEach(f => { f.innerHTML = pips(1 + Math.floor(Math.random() * 6)); }); return; }
      clearInterval(spin);
      faces.forEach((f, i) => { f.innerHTML = pips(finals[i]); });
      fx.classList.add('landed');
    }, 90);
    setTimeout(() => fx.classList.add('gone'), 2400);
    setTimeout(() => fx.remove(), 2900);
  }
  function diceHtml(g) {
    const d = g.dice;
    if (!d) return '';
    const s = seatOf(g, d.by);
    return `<div class="rk-dice"><div class="eyebrow">${esc(s ? s.name : '')}: ${esc(landName(d.from))} attacks ${esc(landName(d.to))}${d.walls ? ' · behind the walls' : ''}</div>
      <div class="rk-roll"><span>${d.a.map(n => dieHtml(n, 'att')).join('')}</span><b>vs</b><span>${d.d.map(n => dieHtml(n, 'def')).join('')}</span></div>
      <p class="rk-note">${d.won ? '🏳️ ' + esc(landName(d.to)) + ' is taken!' : 'Attacker loses ' + d.la + ', defender loses ' + d.ld + '.'}</p></div>`;
  }

  // ----- screens -----

  function openRisk() {
    $('riskTitle').textContent = BOARD() ? BOARD().title : 'Babylon Falls';
    $('risk').hidden = false;
  }
  const riskBody = html => { $('riskBody').innerHTML = html; };
  function stopRisk() {
    if (rk) { (rk.unsub || []).forEach(f => { try { f(); } catch (e) {} }); clearInterval(rk.tick); }
    document.querySelectorAll('.rk-fx').forEach(x => x.remove());
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    rk = null;
  }

  // ----- the narrator's voice, the story, and the coach -----

  // The big screen (the map, or the one shared screen) reads the narrator's
  // lines aloud with the browser's own voice, unless it's turned off.
  const riskVoiceOn = () => { try { return localStorage.getItem(NS + 'risk.voice') !== '0'; } catch (e) { return true; } };
  function riskSpeak(text) {
    try {
      if (!riskVoiceOn() || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[“”]/g, ''));
      u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function riskNarrate(g) {
    if (!rk || !g) return;
    if (g.state === 'play' && g.story && rk.told !== rk.code) {       // the story, once
      rk.told = rk.code;
      const B = BOARD();
      riskSpeak(B.story.concat('How to win: ' + B.goal).join(' '));
    }
    if (rk.spoken === undefined) { rk.spoken = g.say ? g.say.n : 0; return; }   // this screen's first look: don't reread an old line
    const fresh = (g.says || []).filter(x => x.n > rk.spoken);
    if (g.say && fresh.length) { rk.spoken = g.say.n; riskSpeak(fresh.map(x => x.text).join(' ')); }
  }
  const riskSayHtml = g => g.say ? `<div class="rk-say"><span class="mic" aria-hidden="true">🎙️</span><span>${linkRefs(g.say.text)}</span></div>` : '';
  function riskStoryHtml(button) {
    const B = BOARD();
    return `<div class="rk-story"><div class="eyebrow">The story</div>${B.story.map(x => `<p>${linkRefs(x)}</p>`).join('')}
      <div class="eyebrow">How to win</div><p>${esc(B.goal)}</p>
      <div class="eyebrow">Each turn</div><ol>${B.turn.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
      <div class="eyebrow">The dice</div><p>${esc(B.dice)}</p>${button || ''}</div>`;
  }

  // The coach: what each choice means right now, with the real odds.
  const riskCoachOn = () => { try { return localStorage.getItem(NS + 'risk.coach') === '1'; } catch (e) { return false; } };
  function riskCoach(g, me) {
    const B = BOARD(), t = g.turn, sel = rk.sel || {}, mine = landsOf(g, me);
    const pct = x => Math.round(x * 100) + '%', armies = n => n + (n === 1 ? ' army' : ' armies');
    const near = f => B.links.filter(([x, y]) => x === f || y === f).map(([x, y]) => x === f ? y : x);
    const odds = (f, to) => takeOdds(g.lands[f].a, g.lands[to].a, to === B.walls && !t.gates);
    const points = s => { const ls = landsOf(g, s.uid); return ls.length + (ls.includes(B.walls) ? 2 : 0); };
    const score = `<p class="rk-note">Points now: ${g.seats.filter(s => !s.out).map(s => ({ s, p: points(s) })).sort((a, b) => b.p - a.p)
      .map(x => esc(x.s.uid === me ? 'you' : x.s.name) + ' ' + x.p).join(' · ')}. Babylonia counts 3.</p>`;
    if (t.phase === 'choose') {
      const bonus = Math.floor(mine.length / RISK.perLands), timed = g.timer !== false;
      return `<p><b>Easy:</b> ${RISK.easy} armies if you know it${timed ? ` (${RISK.time.easy} seconds)` : ''}. <b>Hunt:</b> ${RISK.hard} if you find the answer in the chapter${timed ? ` (${RISK.time.hard / 60} minutes)` : ''}, but only ${RISK.miss} if you don't.</p>
        <p>You'll also get ${bonus} for holding ${mine.length} ${mine.length === 1 ? 'land' : 'lands'} (1 for every ${RISK.perLands}).</p>${score}`;
    }
    if (t.phase === 'answer') {
      return t.level === 'hard' ? '<p>Open the chapter and look for the words in the question. Read the verses around them to be sure.</p>'
        : "<p>It's from a reel: think back to what it said, and pick the answer it gave.</p>";
    }
    if (t.phase === 'place') {
      const front = [];
      mine.forEach(f => near(f).forEach(to => { if (g.lands[to].o !== me) front.push({ f, to, d: g.lands[to].a }); }));
      front.sort((a, b) => a.d - b.d);
      return (front.length ? `<p>Put them where you'll attack from. An idea: ${esc(landName(front[0].f))}, next to ${esc(landName(front[0].to))} (${armies(front[0].d)}).</p>` : '') +
        `<p>Babylonia is worth 3 lands at the end, but behind its walls its defender rolls 3 dice.</p>${score}`;
    }
    if (t.phase !== 'attack') return '';
    if (sel.mode === 'move') return "<p>Move armies off lands with no enemy next door, toward the lands you'll attack from next turn. It ends your turn.</p>";
    const rule = `<p class="rk-note">${esc(B.dice)}</p>`;
    if (sel.from && sel.to) {
      const o = odds(sel.from, sel.to), cost = o.lost < 0.5 ? 'almost nothing' : 'about ' + armies(Math.round(o.lost));
      const gates = sel.to === B.walls && !t.gates && (g.cards[me] || []).includes('gates');
      return `<p><b>Your odds:</b> attacking ${esc(landName(sel.to))} (${g.lands[sel.to].a}) from ${esc(landName(sel.from))} (${g.lands[sel.from].a}), you'd take it about ${pct(o.win)} of the time if you keep attacking, losing ${cost} on the way.</p>` +
        (o.win < 0.5 ? `<p>That's a long shot.${gates ? ' Play The two leaved gates first, or' : ''} Place more armies here next turn and try then.</p>` : '') + rule;
    }
    const best = [];
    mine.forEach(f => { if (g.lands[f].a >= 2) near(f).forEach(to => { if (g.lands[to].o !== me) best.push({ f, to, o: odds(f, to) }); }); });
    best.sort((a, b) => b.o.win - a.o.win);
    return (best.length ? `<p><b>Best odds right now:</b> ${best.slice(0, 2).map(x => `${esc(landName(x.f))} → ${esc(landName(x.to))}, ${pct(x.o.win)}`).join('; ')}.</p>`
      : '<p>None of your lands has 2 or more armies to attack with. End your turn, or move armies.</p>') +
      `<p>Every roll can cost you armies, and a land left with 1 army is easy to take. Stop when the odds turn against you.</p>${rule}${score}`;
  }
  // Exit on the map screen ends the game for everyone, so mid-game it asks
  // for a second tap.
  function riskExit() {
    if (rk && rk.role === 'host' && rk.g && rk.g.state === 'play' && !rk.sure) {
      rk.sure = true;
      $('riskExit').textContent = 'End the game? Tap again';
      setTimeout(() => { if (rk) rk.sure = false; $('riskExit').textContent = 'Exit'; }, 4000);
      return;
    }
    $('riskExit').textContent = 'Exit';
    closeRisk();
  }
  async function closeRisk() {
    const was = rk;
    stopRisk();
    $('risk').hidden = true;
    if (location.hash.startsWith('#babylon')) history.replaceState(null, '', location.pathname + location.search);
    if (was && was.role === 'host' && was.code) {
      try { sessionStorage.removeItem(NS + 'risk.host'); } catch (e) {}
      try { await riskConn().end(was.code); } catch (e) {}
    }
  }
  const riskModeNote = () => riskConn().kind === 'local'
    ? '<p class="live-mode">Test mode: players join from other tabs of this browser.</p>' : '';

  function riskChooser() {
    stopRisk();
    openRisk();
    const B = BOARD();
    riskBody(`
      <div class="clue" style="max-width:640px">
        <p class="clue-q">${esc(B.title)}</p>
        <p class="board-help">${linkRefs(B.intro)}</p>
        <p class="board-help">A map game for 2 to 5, like Risk. The map goes on a computer or TV; everyone plays on their own phone or tablet. Answer this week's questions to raise armies, then take land. Babylon has walls.</p>
        <div class="board-actions">
          <button class="btn" data-rk="host">Put the map on this screen</button>
          <button class="btn ghost" data-rk="join">Join with a code</button>
        </div>
        <p class="board-help">No TV? <button class="today-alt" style="display:inline;margin:0" data-rk="solo">Play on this one screen</button>, passing it around.</p>
        ${riskModeNote()}
      </div>`);
  }

  // ----- host: the computer with the map -----

  async function riskHost() {
    stopRisk();
    openRisk();
    riskBody('<p class="board-help">Setting up the map…</p>');
    const C = riskConn();
    try { await C.init(); } catch (e) { riskBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`); return; }
    // A reload picks the same game back up.
    let code = null, resumed = null;
    try { code = sessionStorage.getItem(NS + 'risk.host'); } catch (e) {}
    if (code) {
      resumed = await new Promise(ok => { const off = C.watchGame(code, g => { ok(g); setTimeout(() => off && off(), 0); }); });
      if (!resumed || resumed.host !== C.uid()) { code = null; resumed = null; }
    }
    try {
      for (let i = 0; i < 20 && !code; i++) {
        const c = String(1000 + Math.floor(Math.random() * 9000));
        if (await C.create(c, { board: BOARD().id, week: WEEK.title, state: 'lobby', rounds: RISK.rounds[1], timer: true, seats: [] })) code = c;
      }
    } catch (e) {
      riskBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`);
      return;
    }
    if (!code) { riskBody('<div class="clue"><p class="clue-q">Couldn&rsquo;t get a game code. Try again.</p></div>'); return; }
    try { sessionStorage.setItem(NS + 'risk.host', code); } catch (e) {}
    rk = { role: 'host', code, g: null, players: [], done: new Set(), unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    rk.unsub.push(C.watchGame(code, g => {
      if (!rk) return;
      if (!g) { rk.g = null; return renderRiskHost(); }
      if (!rk.g) rk.g = g;                     // after that, this screen's copy is the one that counts
      renderRiskHost();
    }));
    rk.unsub.push(C.watchPlayers(code, ps => { if (!rk) return; rk.players = ps; riskMoves(rk.moves || []); renderRiskHost(); }));
    rk.unsub.push(C.watchMoves(code, ms => { if (!rk) return; rk.moves = ms; riskMoves(ms); }));
  }

  async function riskSave() {
    const g = rk && rk.g;
    if (!g) return;
    const fields = {};
    ['state', 'rounds', 'timer', 'round', 'seats', 'lands', 'cards', 'used', 'turn', 'dice', 'log', 'final', 'say', 'says', 'story'].forEach(k => { if (g[k] !== undefined) fields[k] = g[k]; });
    try { await riskConn().save(rk.code, JSON.parse(JSON.stringify(fields))); }
    catch (e) { toast("Couldn't reach the game", 'Check the internet'); }
  }

  function riskMoves(ms) {
    if (!rk || rk.role !== 'host' || !rk.g) return;
    let changed = false;
    for (const m of ms) {
      if (rk.done.has(m.id)) continue;
      if (riskApply(rk.g, m) === 'wait') continue;
      rk.done.add(m.id);
      changed = true;
      riskConn().dropMove(rk.code, m.id).catch(() => {});
    }
    if (changed) { riskSave(); renderRiskHost(); }
  }

  function riskHostAction(act, el) {
    const g = rk && rk.g;
    if (!g) return;
    // This screen only: the rules again, and the narrator's voice.
    if (act === 'rules') { rk.rules = !rk.rules; return renderRiskHost(); }
    if (act === 'voice') { try { localStorage.setItem(NS + 'risk.voice', riskVoiceOn() ? '0' : '1'); if (!riskVoiceOn()) speechSynthesis.cancel(); } catch (e) {} return renderRiskHost(); }
    if (act === 'rounds' && g.state === 'lobby') g.rounds = Number(el.dataset.n) || RISK.rounds[1];
    else if (act === 'timer' && g.state === 'lobby') g.timer = el.dataset.v !== 'off';
    else if (act === 'begin' && g.state === 'play' && g.story) riskStoryDone(g);
    else if (act === 'start' && g.state === 'lobby' && g.seats.length >= 2) riskBegin(g);
    else if (act === 'skip' && g.state === 'play') { riskLog(g, g.seats[g.turn.i].name + "'s turn was skipped."); riskNextTurn(g); }
    else if (act === 'finish' && g.state === 'play') riskOver(g);
    else if (act === 'again' && g.state === 'over') {
      Object.assign(g, { state: 'lobby', seats: g.seats.map(s => ({ uid: s.uid, name: s.name, k: s.k })), turn: null, dice: null, final: null, log: [] });
    } else return;
    riskSave();
    renderRiskHost();
  }

  const phaseText = t => ({ choose: 'is choosing a question', answer: 'is answering', place: 'is placing armies', attack: 'is attacking' })[t.phase] || '';

  function riskSeatsHtml(g, meUid) {
    return `<div class="rk-seats">${g.seats.map((s, i) => {
      const ls = landsOf(g, s.uid), armies = ls.reduce((n, id) => n + g.lands[id].a, 0), k = kingdomOf(s.k);
      const now = g.turn && g.turn.i === i && g.state === 'play';
      return `<div class="rk-seat${now ? ' now' : ''}${s.out ? ' out' : ''}${s.uid === meUid ? ' me' : ''}">
        <span class="rk-dot" style="background:${k.color}"></span><b>${esc(s.name)}</b><span class="k">${esc(k.name)}</span>
        <span class="n">${s.out ? 'fallen' : ls.length + ' land' + (ls.length === 1 ? '' : 's') + ' · ' + armies}${(g.cards && g.cards[s.uid] || []).length ? ' · 🂠' + g.cards[s.uid].length : ''}</span></div>`;
    }).join('')}</div>`;
  }

  // What the TV shows about the turn: the question while he answers (so the
  // family reads along), then the right answer and why.
  function riskTurnHtml(g) {
    const t = g.turn, s = g.seats[t.i], k = kingdomOf(s.k);
    let html = `<div class="rk-turn" style="border-color:${k.color}"><div class="eyebrow">Round ${g.round} of ${g.rounds}</div>
      <div class="rk-who"><span class="rk-dot" style="background:${k.color}"></span>${esc(s.name)} <small>${esc(k.name)}</small></div><p class="rk-note">${esc(phaseText(t))}</p>`;
    if (t.q) {
      const Q = gameQuestion(t.q), answered = !!t.result, read = t.level === 'hard' && riskReading(Q);
      const from = Q.week && Q.week !== WEEK ? `A review from ${esc(Q.week.title)}` : read ? `Hunt: find it in ${esc(read.label)}` : 'Easy';
      html += `<div class="rk-qhead"><div class="eyebrow" style="color:var(--gold)">${from}</div>${!answered && t.limit ? `<div class="rk-clock" id="rkClock">${fmtClock(riskLeft(t))}</div>` : ''}</div>
        <p class="rk-q">${answered ? linkRefs(Q.text, Q.home) : esc(Q.text)}</p>
        <div class="rk-choices">${riskChoices(t.q).map((c, n) => `<div class="rk-choice${answered ? (c === Q.q.right ? ' right' : c === t.result.picked ? ' wrong' : ' dim') : ''}"><b>${'ABC'[n]}</b> ${esc(c)}</div>`).join('')}</div>`;
      if (answered) {
        const r = t.result;
        html += `<p class="rk-result ${r.right ? 'ok' : 'no'}">${r.right ? 'Right!' : r.timeout ? 'Time’s up.' : 'Not this time.'} +${r.got} ${r.got === 1 ? 'army' : 'armies'}${r.bonus ? ` · +${r.bonus} for ${landsOf(g, s.uid).length} lands` : ''}${r.card ? ' · a prophecy card' : ''}</p>
          <p class="quiz-why">${linkRefs(Q.q.why, Q.home)}</p>`;
      }
    }
    return html + '</div>';
  }

  function renderRiskHost() {
    if (!rk || rk.role !== 'host') return;
    const g = rk.g;
    if (!g) { riskBody('<div class="live-big">The game has ended.</div>'); return; }
    if (g.state === 'lobby') {
      const B = BOARD(), taken = {};
      g.seats.forEach(s => { taken[s.k] = s; });
      const waiting = rk.players.filter(p => !seatOf(g, p.uid));
      riskBody(`
        <div class="rk-host">
          <div class="rk-mapbox">${riskMap({ lands: null, seats: g.seats })}</div>
          <div class="rk-side">
            <div class="eyebrow">Join code</div>
            <div class="live-code" style="font-size:clamp(48px,7vw,96px)">${esc(rk.code)}</div>
            <p class="board-help">On each phone or tablet: open Treasure Up, tap 🎮, choose <b>Babylon Falls</b>, then <b>Join with a code</b>. Then pick a kingdom.</p>
            <div class="rk-kingdoms">${B.kingdoms.map(k => `<div class="rk-king${taken[k.id] ? ' chosen' : ' open'}"${taken[k.id] ? ` style="border-color:${k.color}"` : ''}><span class="rk-dot" style="background:${k.color}"></span>${esc(k.name)}<small>${taken[k.id] ? esc(taken[k.id].name) : 'open'}</small></div>`).join('')}</div>
            ${waiting.length ? `<p class="board-help">Joined, still choosing: ${waiting.map(p => esc(p.name)).join(', ')}</p>` : ''}
            <div class="eyebrow" style="margin-top:14px">How long</div>
            <div class="rk-len">${RISK.rounds.map((n, i) => `<button class="btn ${g.rounds === n ? '' : 'ghost'}" data-rkh="rounds" data-n="${n}">${['Short', 'Standard', 'Long'][i]} · ${n} rounds</button>`).join('')}</div>
            <div class="eyebrow" style="margin-top:14px">Timer</div>
            <div class="rk-len"><button class="btn ${g.timer !== false ? '' : 'ghost'}" data-rkh="timer" data-v="on">On: ${RISK.time.easy} s, hunts ${RISK.time.hard / 60} min</button><button class="btn ${g.timer === false ? '' : 'ghost'}" data-rkh="timer" data-v="off">Relaxed: no timer</button></div>
            <div class="board-actions"><button class="btn" data-rkh="start"${g.seats.length >= 2 ? '' : ' disabled style="opacity:.4"'}>Start · ${g.seats.length} ${g.seats.length === 1 ? 'kingdom' : 'kingdoms'}</button></div>
            <p class="board-help" style="font-size:13px">${linkRefs(B.intro)}</p>
            ${riskModeNote()}
          </div>
        </div>`);
      return;
    }
    const side = g.state === 'over' ? riskFinalHtml(g)
      : g.story ? riskStoryHtml('<div class="board-actions"><button class="btn" data-rkh="begin">Let’s begin</button></div>')
      : rk.rules ? riskStoryHtml('<div class="board-actions"><button class="btn" data-rkh="rules">Back to the game</button></div>')
      : riskTurnHtml(g) + diceHtml(g);
    riskBody(`
      <div class="rk-host">
        <div class="rk-mapbox">${riskMap(g, g.dice ? { from: g.dice.from, to: g.dice.to } : null)}</div>
        <div class="rk-side">
          ${g.story ? '' : riskSayHtml(g)}
          ${side}
          ${riskSeatsHtml(g)}
          <div class="rk-log">${(g.log || []).slice().reverse().map(x => `<div>${esc(x)}</div>`).join('')}</div>
          <div class="board-actions">${g.state === 'play'
            ? `<button class="btn ghost" data-rkh="skip">Skip this turn</button><button class="btn ghost" data-rkh="finish">End the game now</button>`
            : `<button class="btn" data-rkh="again">Play again</button>`}
            <button class="btn ghost" data-rkh="rules">How to play</button><button class="btn ghost" data-rkh="voice">${riskVoiceOn() ? '🔊 Voice on' : '🔈 Voice off'}</button></div>
        </div>
      </div>`);
    riskNarrate(g);
    riskMaybeRoll(g);
  }

  function riskFinalHtml(g) {
    const f = g.final || riskScores(g), w = f[0], k = kingdomOf(w.k);
    return `<div class="rk-turn" style="border-color:${k.color}"><div class="eyebrow">Game over</div>
      <div class="rk-who">🏆 ${esc(w.name)} <small>${esc(k.name)}</small></div>
      <p class="rk-note">${w.lands} lands${w.babylon ? ', Babylon among them' : ''}: ${w.pts} points. Babylonia counts 3.</p>
      <div class="grid gap-2" style="margin-top:10px">${f.map((x, i) => `<div class="score-row"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${esc(x.name)} · ${esc(kingdomOf(x.k).name)}</span><b>${x.pts}</b></div>`).join('')}</div></div>`;
  }

  // ----- player: a phone or tablet -----

  function riskJoinForm(code, err) {
    stopRisk();
    openRisk();
    let name = '';
    try { name = localStorage.getItem(NS + 'live.name') || ''; } catch (e) {}
    if (!name && F) name = F.name.slice(0, 16);
    riskBody(`
      <div class="clue" style="max-width:420px">
        <p class="clue-q">Join Babylon Falls</p>
        <label class="block text-[12px] text-white/60" for="riskCode">Code on the map screen</label>
        <input id="riskCode" class="field" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(code || '')}" style="font-size:28px;letter-spacing:.2em;text-align:center">
        <label class="block mt-3 text-[12px] text-white/60" for="riskName">Your name</label>
        <input id="riskName" class="field" maxlength="16" autocomplete="off" value="${esc(name)}">
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-rk="joinnow">Join</button></div>
        ${riskModeNote()}
      </div>`);
  }

  async function riskJoin() {
    const code = $('riskCode').value.trim(), name = $('riskName').value.trim();
    if (!/^\d{4}$/.test(code)) return riskJoinForm(code, 'The code is 4 numbers.');
    if (!name) return riskJoinForm(code, 'Type your name.');
    try { localStorage.setItem(NS + 'live.name', name); } catch (e) {}
    const C = riskConn();
    try { await C.init(); } catch (e) { return riskJoinForm(code, e.message); }
    let err = null;
    try { err = await C.join(code, name); } catch (e) { err = e.message; }
    if (err) return riskJoinForm(code, err);
    rk = { role: 'player', code, name, g: null, sel: {}, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    rk.unsub.push(C.watchGame(code, g => {
      if (!rk) return;
      const before = rk.g;
      rk.g = g;
      // A new turn or phase clears what was picked on the map.
      if (!before || !g || JSON.stringify(before.turn && [before.turn.i, before.turn.phase]) !== JSON.stringify(g.turn && [g.turn.i, g.turn.phase])) rk.sel = {};
      if (g && g.dice && before && before.dice && g.dice.n !== before.dice.n && g.dice.won) rk.sel = {};
      renderRiskPlayer();
    }));
  }

  const riskMe = () => rk && rk.role === 'solo' ? (rk.g.turn ? rk.g.seats[rk.g.turn.i].uid : null) : riskConn().uid();
  const riskRender = () => rk && (rk.role === 'solo' ? renderRiskSolo() : rk.role === 'player' ? renderRiskPlayer() : renderRiskHost());
  // A move: sent to the computer with the map, or on the one shared screen,
  // checked and applied right here by the same rules.
  function riskSend(m) {
    if (rk.role !== 'solo') return riskConn().move(rk.code, m).catch(() => toast("Couldn't reach the game", 'Check the internet'));
    const g = rk.g, was = g.turn ? g.turn.i : -1, phase = g.turn && g.turn.phase, rolls = g.dice && g.dice.n;
    riskApply(g, Object.assign({}, m, { uid: riskMe() }));
    if (!g.turn || g.turn.i !== was || g.turn.phase !== phase || (g.dice && g.dice.won && g.dice.n !== rolls)) rk.sel = {};
    if (g.turn && g.turn.i !== was) rk.pass = true;                    // hand the screen on
    riskSoloSave();
  }

  // What a phone can tap on the map right now.
  function riskCan(g, me) {
    const t = g.turn;
    if (!t || !g.seats[t.i] || g.seats[t.i].uid !== me) return [];
    const mine = landsOf(g, me), sel = rk.sel;
    if (t.phase === 'place') return mine;
    if (t.phase !== 'attack') return [];
    const from = sel.from && g.lands[sel.from] && g.lands[sel.from].o === me ? sel.from : null;
    const strong = mine.filter(id => g.lands[id].a >= 2);
    if (!from) return strong;
    const near = BOARD().links.filter(([x, y]) => x === from || y === from).map(([x, y]) => x === from ? y : x);
    return strong.concat(near.filter(id => sel.mode === 'move' ? g.lands[id].o === me : g.lands[id].o !== me));
  }

  function riskTap(id) {
    const g = rk && rk.g, me = riskMe();
    if (!g || rk.role === 'host' || !riskCan(g, me).includes(id)) return;
    const t = g.turn, sel = rk.sel, own = g.lands[id].o === me;
    if (t.phase === 'place') {                                          // one army a tap
      sel.place = id;
      riskSend({ kind: 'place', a: id, n: 1 });
    } else if (sel.mode === 'move') {                                   // from one of yours to a neighbour of yours
      if (own && sel.from && sel.from !== id && adjacent(sel.from, id)) { sel.to = id; sel.n = 1; }
      else { sel.from = id; sel.to = null; }
    } else if (own) { sel.from = id; sel.to = null; }                   // attack from here…
    else sel.to = id;                                                   // …to there
    riskRender();
  }

  function riskPlayerAction(act, el) {
    const g = rk && rk.g, sel = rk.sel;
    if (!g) return;
    if (act === 'land') return riskTap(el.dataset.v);
    if (act === 'coach') { try { localStorage.setItem(NS + 'risk.coach', riskCoachOn() ? '0' : '1'); } catch (e) {} return riskRender(); }
    if (act === 'pick') riskSend({ kind: 'pick', a: el.dataset.k });
    else if (act === 'level') riskSend({ kind: 'level', a: el.dataset.v });
    else if (act === 'ans') { sel.answered = true; riskSend({ kind: 'answer', a: el.dataset.v }); }
    else if (act === 'allhere' && sel.place) riskSend({ kind: 'place', a: sel.place, n: g.turn.armies });
    else if (act === 'attack' && sel.from && sel.to) riskSend({ kind: 'attack', a: sel.from, b: sel.to });
    else if (act === 'card') riskSend({ kind: 'card', a: el.dataset.v });
    else if (act === 'movemode') { rk.sel = { mode: 'move' }; }
    else if (act === 'cancel') { rk.sel = {}; }
    else if (act === 'less') sel.n = Math.max(1, (sel.n || 1) - 1);
    else if (act === 'more') sel.n = Math.min(g.lands[sel.from].a - 1, (sel.n || 1) + 1);
    else if (act === 'domove' && sel.from && sel.to) riskSend({ kind: 'move', a: sel.from, b: sel.to, n: sel.n || 1 });
    else if (act === 'end') riskSend({ kind: 'end' });
    riskRender();
  }

  function renderRiskPlayer() {
    if (!rk || rk.role !== 'player') return;
    const g = rk.g, me = riskConn().uid(), B = BOARD();
    if (!g) { riskBody('<div class="live-big">The game has ended.</div><p class="live-sub">Thanks for playing!</p>'); return; }
    const seat = seatOf(g, me), k = seat && kingdomOf(seat.k);
    const head = seat ? `<div class="rk-me"><span class="rk-dot" style="background:${k.color}"></span><b>${esc(seat.name)}</b> · ${esc(k.name)}
      <span class="n">${seat.out ? 'fallen' : landsOf(g, me).length + (landsOf(g, me).length === 1 ? ' land' : ' lands')}</span></div>` : '';
    if (g.state === 'lobby') {
      const taken = {};
      g.seats.forEach(s => { taken[s.k] = s; });
      riskBody(`${head}<div class="clue"><p class="clue-q">${seat ? "You're in! Watch the map." : 'Pick your kingdom'}</p>
        <div class="rk-kingdoms">${B.kingdoms.map(x => {
          const who = taken[x.id], mine = who && who.uid === me;
          return `<button class="rk-king${mine ? ' mine' : ''}${who && !mine ? ' taken' : ''}" data-rk="pick" data-k="${x.id}"${who && !mine ? ' disabled' : ''}>
            <span class="rk-dot" style="background:${x.color}"></span>${esc(x.name)}<small>${mine ? 'yours' : who ? esc(who.name) : 'home: ' + esc(landName(x.home))}</small></button>`;
        }).join('')}</div>
        <p class="board-help">${seat ? 'You can still switch until the game starts.' : ''}</p></div>`);
      return;
    }
    if (g.state === 'over') {
      const f = g.final || [], place = f.findIndex(x => x.uid === me) + 1;
      riskBody(`${head}<div class="live-big">${place === 1 ? '🏆 You won!' : place ? 'You finished ' + ['1st', '2nd', '3rd', '4th', '5th'][place - 1] : 'Game over'}</div>
        <p class="live-sub">${f[0] ? esc(f[0].name) + ' wins with ' + f[0].pts + ' points.' : ''}</p>`);
      return;
    }
    const c = riskControls(g, me, true);
    riskBody(`${head}${c.map}<div class="rk-panel">${c.panel}</div>`);
    riskMaybeRoll(g);
  }

  // ----- one screen: a phone, tablet or computer passed around -----

  // No TV and no join code: everyone's turn is played on this screen, by the
  // same rules. The game is kept on this device, so it can be continued later.
  const SOLO_KEY = NS + 'risk.solo';
  function riskSoloSave() {
    try { localStorage.setItem(SOLO_KEY, JSON.stringify(Object.assign({}, rk.g, { code: rk.code, pass: !!rk.pass }))); } catch (e) {}
  }
  function riskSoloSaved() {
    try { const g = JSON.parse(localStorage.getItem(SOLO_KEY)); return g && g.state === 'play' && g.board === BOARD().id ? g : null; } catch (e) { return null; }
  }

  function riskSoloSetup(err, names) {
    stopRisk();
    openRisk();
    const B = BOARD(), saved = riskSoloSaved(), n = names || {};
    riskBody(`
      <div class="clue" style="max-width:560px">
        <p class="clue-q">Play on this one screen</p>
        <p class="board-help">Type a name next to each kingdom that's playing (2 to 5), then pass this phone, tablet or computer around: each turn is played here.</p>
        ${saved ? `<div class="board-actions"><button class="btn" data-rk="solocontinue">Continue your game · round ${saved.round} of ${saved.rounds}</button></div>` : ''}
        <div class="rk-soloset">${B.kingdoms.map(k => `<label class="rk-soloking"><span class="rk-dot" style="background:${k.color}"></span><b>${esc(k.name)}</b>
          <input class="field" data-solo-k="${k.id}" maxlength="16" placeholder="Name" autocomplete="off" value="${esc(n[k.id] || '')}"></label>`).join('')}</div>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloRounds">How long</label>
        <select id="riskSoloRounds" class="field">${RISK.rounds.map((r, i) => `<option value="${r}"${i === 1 ? ' selected' : ''}>${['Short', 'Standard', 'Long'][i]} · ${r} rounds</option>`).join('')}</select>
        <label class="block mt-3 text-[12px] text-white/60" for="riskSoloTimer">Timer</label>
        <select id="riskSoloTimer" class="field"><option value="on">On: ${RISK.time.easy} seconds, hunts ${RISK.time.hard / 60} minutes</option><option value="off">Relaxed: no timer</option></select>
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-rk="solostart">${saved ? 'Start a new game' : 'Start'}</button></div>
      </div>`);
  }

  function riskSoloStart() {
    const names = {};
    const seats = [...document.querySelectorAll('[data-solo-k]')].map(i => ({ k: i.dataset.soloK, name: i.value.trim() }))
      .filter(x => { names[x.k] = x.name; return x.name; }).map((x, n) => ({ uid: 'p' + (n + 1), name: x.name, k: x.k }));
    if (seats.length < 2) return riskSoloSetup('Type at least 2 names.', names);
    rk = { role: 'solo', code: 'solo' + Date.now(), g: { board: BOARD().id, state: 'lobby', rounds: Number($('riskSoloRounds').value) || RISK.rounds[1], timer: $('riskSoloTimer').value !== 'off', seats }, sel: {}, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    riskBegin(rk.g);
    riskSoloSave();
    renderRiskSolo();
  }
  function riskSoloContinue() {
    const g = riskSoloSaved();
    if (!g) return riskSoloSetup();
    rk = { role: 'solo', code: g.code || 'solo', g, sel: {}, pass: !!g.pass, unsub: [] };
    rk.tick = setInterval(riskTick, 500);
    renderRiskSolo();
  }
  function riskSoloAction(act) {
    const g = rk.g;
    if (act === 'soloready') rk.pass = false;
    else if (act === 'solobegin' && g.story) riskStoryDone(g);
    else if (act === 'solorules') { rk.rules = !rk.rules; return renderRiskSolo(); }
    else if (act === 'solovoice') { try { localStorage.setItem(NS + 'risk.voice', riskVoiceOn() ? '0' : '1'); if (!riskVoiceOn()) speechSynthesis.cancel(); } catch (e) {} return renderRiskSolo(); }
    else if (act === 'soloskip' && g.state === 'play') { riskLog(g, g.seats[g.turn.i].name + "'s turn was skipped."); riskNextTurn(g); rk.sel = {}; rk.pass = g.state === 'play'; }
    else if (act === 'solofinish' && g.state === 'play') riskOver(g);
    else if (act === 'soloagain') {
      rk.g = { board: g.board, state: 'lobby', rounds: g.rounds, timer: g.timer, seats: g.seats.map(x => ({ uid: x.uid, name: x.name, k: x.k })) };
      rk.code = 'solo' + Date.now();
      riskBegin(rk.g);
      rk.sel = {};
      rk.pass = false;
    } else if (act === 'solodone') {
      try { localStorage.removeItem(SOLO_KEY); } catch (e) {}
      return closeRisk();
    }
    riskSoloSave();
    renderRiskSolo();
  }

  function renderRiskSolo() {
    if (!rk || rk.role !== 'solo') return;
    const g = rk.g, small = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
    const log = `<div class="rk-log">${(g.log || []).slice().reverse().map(x => `<div>${esc(x)}</div>`).join('')}</div>`;
    if (g.state === 'over') {
      riskNarrate(g);
      riskBody(`<div class="rk-host"><div class="rk-mapbox">${riskMap(g)}</div><div class="rk-side">${riskSayHtml(g)}${riskFinalHtml(g)}${riskSeatsHtml(g)}
        <div class="board-actions"><button class="btn" data-rk="soloagain">Play again</button><button class="btn ghost" data-rk="solodone">Done</button></div></div></div>`);
      return;
    }
    const s = g.seats[g.turn.i], k = kingdomOf(s.k);
    const foot = `<button class="btn ghost" data-rk="solorules">How to play</button><button class="btn ghost" data-rk="solovoice">${riskVoiceOn() ? '🔊 Voice on' : '🔈 Voice off'}</button>`;
    if (g.story || rk.rules) {
      riskBody(`<div class="rk-host"><div class="rk-mapbox">${riskMap(g)}</div><div class="rk-side">
        ${riskStoryHtml(`<div class="board-actions">${g.story ? '<button class="btn" data-rk="solobegin">Let’s begin</button>' : '<button class="btn" data-rk="solorules">Back to the game</button>'}${g.story ? foot : ''}</div>`)}
        ${riskSeatsHtml(g, s.uid)}</div></div>`);
      return riskNarrate(g);
    }
    const who = `${riskSayHtml(g)}<div class="rk-turn" style="border-color:${k.color}"><div class="eyebrow">Round ${g.round} of ${g.rounds}</div>
      <div class="rk-who"><span class="rk-dot" style="background:${k.color}"></span>${esc(s.name)} <small>${esc(k.name)}</small></div></div>`;
    if (rk.pass) {
      riskBody(`<div class="rk-host"><div class="rk-mapbox">${riskMap(g, g.dice ? { from: g.dice.from, to: g.dice.to } : null)}</div><div class="rk-side">
        <div class="rk-pass" style="border-color:${k.color}"><div class="eyebrow">Round ${g.round} of ${g.rounds}</div>
          <p class="rk-q">Pass to ${esc(s.name)}</p><p class="rk-note">${esc(k.name)}'s turn.</p>
          <div class="rk-btns"><button class="btn" data-rk="soloready">I'm ${esc(s.name)}: go</button></div></div>
        ${riskSayHtml(g)}${diceHtml(g)}${riskSeatsHtml(g, s.uid)}${log}</div></div>`);
      riskNarrate(g);
      return riskMaybeRoll(g);
    }
    const c = riskControls(g, s.uid, small);
    riskBody(`<div class="rk-host">${c.map}<div class="rk-side">${who}<div class="rk-panel" style="margin-top:0">${c.panel}</div>
      ${riskSeatsHtml(g, s.uid)}${log}
      <div class="board-actions"><button class="btn ghost" data-rk="soloskip">Skip this turn</button><button class="btn ghost" data-rk="solofinish">End the game now</button>${foot}</div></div></div>`);
    riskNarrate(g);
    riskMaybeRoll(g);
  }

  // A player's map and controls during the game: on their own phone, or on
  // the one screen everyone shares.
  function riskControls(g, me, small) {
    const B = BOARD(), seat = seatOf(g, me);
    const t = g.turn, mine = t && g.seats[t.i] && g.seats[t.i].uid === me, sel = rk.sel;
    const can = riskCan(g, me);
    const chip = id => `<button class="rk-chip${sel.from === id || sel.place === id ? ' on' : ''}${sel.to === id ? ' to' : ''}" data-rk="land" data-v="${id}">${esc(landName(id))} · ${g.lands[id].a}</button>`;
    const chips = (label, ids) => ids.length ? `<div class="rk-chips"><span class="lbl">${label}</span>${ids.map(chip).join('')}</div>` : '';
    const own = can.filter(id => g.lands[id].o === me), other = can.filter(id => g.lands[id].o !== me);
    const map = `<div class="rk-mapbox${small ? ' small' : ''}">${riskMap(g, { small, can, from: sel.from || sel.place, to: sel.to })}</div>`;
    let panel = '';
    if (g.story) panel = `<p class="rk-q">Listen to the story on the big screen.</p><p class="rk-note"><b>How to win:</b> ${esc(B.goal)}</p>`;
    else if (!seat) panel = '<p class="rk-note">You joined after the game started. Watch the map!</p>';
    else if (seat.out) panel = '<p class="rk-note">Your kingdom has fallen. Watch how it ends!</p>';
    else if (!mine) {
      const s = g.seats[t.i];
      panel = `<p class="rk-note"><span class="rk-dot" style="background:${kingdomOf(s.k).color}"></span> ${esc(s.name)} ${esc(phaseText(t))}.</p>${diceHtml(g)}`;
    } else if (t.phase === 'choose') {
      panel = `<p class="rk-q">Your turn! Pick a question for armies.</p>
        <div class="rk-btns"><button class="btn" data-rk="level" data-v="easy">Easy · +${RISK.easy} armies</button>
        <button class="btn" data-rk="level" data-v="hard">Hunt through a chapter · +${RISK.hard}</button></div>
        <p class="rk-note">A miss still gets ${RISK.miss}. You also get 1 for every ${RISK.perLands} lands you hold.${RISK.maxCards ? ' A right hunt can win a prophecy card.' : ''}</p>`;
    } else if (t.phase === 'answer') {
      const Q = gameQuestion(t.q), read = t.level === 'hard' && riskReading(Q);
      const from = Q.week && Q.week !== WEEK ? `A review from ${esc(Q.week.title)}` : read ? `Hunt: find it in ${esc(read.label)}` : 'Easy';
      panel = `<div class="rk-qhead"><div class="eyebrow" style="color:var(--gold)">${from}</div>${t.limit ? `<div class="rk-clock" id="rkClock">${fmtClock(riskLeft(t))}</div>` : ''}</div>
        <p class="rk-q">${esc(Q.text)}</p>
        ${read ? `<a class="deep-open" href="${esc(read.url)}" target="_blank" rel="noopener noreferrer">Open ${esc(read.label)} ↗</a>` : ''}
        <div class="rk-btns">${riskChoices(t.q).map(c => `<button class="ls-opt" data-rk="ans" data-v="${esc(c)}"${sel.answered ? ' disabled' : ''}>${esc(c)}</button>`).join('')}</div>
        <button class="today-alt" data-rk="ans" data-v="">I don't know</button>`;
    } else {
      const r = t.result, Q = gameQuestion(t.q);
      const res = r && t.phase === 'place' ? `<p class="rk-result ${r.right ? 'ok' : 'no'}">${r.right ? 'Right!' : (r.timeout ? 'Time’s up! The answer: ' : 'Not this time: ') + esc(Q.q.right) + '.'} ${linkRefs(Q.q.why, Q.home)}</p>` : '';
      const hand = (g.cards[me] || []).map(id => B.cards.find(c => c.id === id)).filter(Boolean);
      const cards = hand.length ? `<div class="rk-cards">${hand.map(c => `<div class="rk-card"><b>${esc(c.title)}</b><span>“${esc(c.quote)}” ${linkRefs(c.ref)}</span><small>${esc(c.does)}</small>
        <button class="btn" data-rk="card" data-v="${c.id}"${c.id === 'weighed' && g.lands[B.walls].o === me ? ' disabled style="opacity:.4"' : ''}>Play it</button></div>`).join('')}</div>` : '';
      if (t.phase === 'place') {
        panel = `${res}<p class="rk-q">Place ${t.armies} ${t.armies === 1 ? 'army' : 'armies'}</p>
          <p class="rk-note">Tap your lands, on the map or here: one army a tap.</p>
          ${chips('Your lands', own)}
          ${sel.place ? `<div class="rk-btns"><button class="btn" data-rk="allhere">All ${t.armies} on ${esc(landName(sel.place))}</button></div>` : ''}${cards}`;
      } else if (sel.mode === 'move') {
        const A = sel.from && g.lands[sel.from];
        panel = `<p class="rk-q">Move armies, then your turn ends</p>
          <p class="rk-note">${!sel.from ? 'Tap one of your lands to move from.' : !sel.to ? 'Now tap a land of yours next to ' + esc(landName(sel.from)) + '.' : 'From ' + esc(landName(sel.from)) + ' to ' + esc(landName(sel.to)) + ':'}</p>
          ${sel.to ? `<div class="rk-step"><button class="btn ghost" data-rk="less">−</button><b>${sel.n || 1}</b><button class="btn ghost" data-rk="more"${(sel.n || 1) >= A.a - 1 ? ' disabled' : ''}>+</button></div>
            <div class="rk-btns"><button class="btn" data-rk="domove">Move ${sel.n || 1} and end turn</button></div>` : ''}
          ${chips('From', own.filter(id => g.lands[id].a >= 2 && !(sel.from && adjacent(sel.from, id))))}${sel.from ? chips('To', own.filter(id => id !== sel.from && adjacent(sel.from, id))) : ''}
          <div class="rk-btns"><button class="btn ghost" data-rk="end">End turn without moving</button><button class="btn ghost" data-rk="cancel">Back to attacking</button></div>`;
      } else {
        const A = sel.from && g.lands[sel.from], D = sel.to && g.lands[sel.to];
        const walls = sel.to === B.walls && !t.gates;
        panel = `${diceHtml(g)}<p class="rk-q">Attack!</p>
          <p class="rk-note">${!sel.from ? 'Tap one of your lands with 2 or more armies.' : !sel.to ? 'Now tap a land next to ' + esc(landName(sel.from)) + ' to attack.'
            : esc(landName(sel.from)) + ' (' + A.a + ') attacks ' + esc(landName(sel.to)) + ' (' + D.a + ')' + (walls ? '. Babylon’s walls: its defender rolls 3 dice.' : '.')}</p>
          ${chips('Attack from', own)}${sel.from ? chips('Attack', other) : ''}
          ${sel.from && sel.to && A.a >= 2 ? `<div class="rk-btns"><button class="btn" data-rk="attack">Roll the dice</button></div>` : ''}
          ${t.gates ? '<p class="rk-note">The gates are open this turn: Babylon’s walls don’t count.</p>' : ''}
          ${cards}
          <div class="rk-btns"><button class="btn ghost" data-rk="movemode">Move armies, then end turn</button><button class="btn ghost" data-rk="end">End turn</button></div>`;
      }
    }
    // The narrator's line on top; the coach, when he wants it, on his turn.
    const coach = mine && !g.story && seat && !seat.out
      ? `<div class="rk-coach"><button class="rk-coach-btn" data-rk="coach" aria-expanded="${riskCoachOn()}">💡 Coach ${riskCoachOn() ? '▾' : '▸'}</button>${riskCoachOn() ? `<div class="rk-coach-body">${riskCoach(g, me)}</div>` : ''}</div>` : '';
    panel = (g.story || rk.role === 'solo' ? '' : riskSayHtml(g)) + coach + panel;
    return { map, panel };
  }


  /* ---------------- family: accounts, progress, chat ---------------- */

  // A family is optional. Without one, everything stays on this device
  // exactly as before. With one:
  //   - Parents and other grown-ups sign in with Google or an email link.
  //     Children don't sign in: a parent makes a one-time link, and opening
  //     it on the child's phone or tablet joins that device as the child.
  //   - Each person's progress is saved to the family, so a new device
  //     picks up where the old one left off, and everyone sees how the
  //     week is going.
  //   - One family chat. Everyone in it sees every message; there are no
  //     private messages, links or photos. A parent can hide a message:
  //     everyone sees that it was hidden, and parents can still read it.
  // firestore.rules is what actually enforces all of this.
  const FAM_KEY = NS + 'family';        // this device's place in a family
  const INVITE_DAYS = 7;
  const LINKS = /(https?:|www\.|[a-z0-9-]+\.(com|net|org|io|ly|gg|tv|me|co|app|us|xyz|link|site|info|biz)([^a-z]|$))/i;
  let F = null;       // { fid, uid, pid, name, role, family }: pid is whose progress this device saves
  let fam = null;     // the family screen while it's open
  let famQueue = Promise.resolve(), famUid, famAuthOff = null, famLatestOff = null;
  let famLatest = { at: 0, mine: true };
  const LOST_KEY = NS + 'lostFamily';  // why this device is no longer in its family, for the family screen
  let syncTimer = null, syncChain = Promise.resolve(), syncFails = 0, backupOff = null;
  let pendingAdopt = null, adoptTimer = null, claimAsked = false;

  function loadFam() {
    try { const raw = localStorage.getItem(FAM_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function saveFam() {
    try { F ? localStorage.setItem(FAM_KEY, JSON.stringify(F)) : localStorage.removeItem(FAM_KEY); } catch (e) {}
    famButtons();
  }
  // One family button on the main page: 👪 to sign in or join, then 💬.
  function famButtons() {
    $('famBtn').hidden = !!F;
    $('chatBtn').hidden = !F;
  }
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const stored = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  const fs = () => firebase.firestore();
  const TS = () => firebase.firestore.FieldValue.serverTimestamp();
  const famDoc = fid => fs().collection('families').doc(fid);
  const famCol = (fid, name) => famDoc(fid).collection(name);
  const authUser = () => (window.firebase && firebase.apps.length ? firebase.auth().currentUser : null);
  const realAccount = u => !!u && !u.isAnonymous;
  const appUrl = () => location.origin + location.pathname;
  const inviteUrl = token => appUrl() + '?invite=' + F.fid + '.' + token;
  function newId(n) {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => abc[b % abc.length]).join('');
  }

  // On boot: a device already in a family connects in the background to
  // save progress and watch for new messages. A join link or an email
  // sign-in link opens the family screen.
  function familyBoot() {
    famButtons();
    let note = null;
    try { note = sessionStorage.getItem(NS + 'adopted'); sessionStorage.removeItem(NS + 'adopted'); } catch (e) {}
    if (note) toast('👪 ' + note.split('|')[0], note.split('|')[1] || '');
    const q = new URLSearchParams(location.search);
    if (q.get('invite') || (q.get('mode') === 'signIn' && q.get('oobCode'))) openFam();
    else if (F && FIREBASE_CONFIG) setTimeout(() => famConnect(), 600);
    // Save before the app goes to the background. Coming back, or the
    // internet coming back, reconnects (the first try may have been offline).
    document.addEventListener('visibilitychange', () => {
      if (!F || !FIREBASE_CONFIG) return;
      if (document.visibilityState === 'hidden') syncNow();
      else if (!authUser()) famConnect();
      else queueSync(500);
    });
    window.addEventListener('online', () => { if (F && FIREBASE_CONFIG) famConnect(); });
  }

  // Everything that depends on who's signed in runs through here, one at
  // a time: on opening the screen, and again whenever the account changes.
  function famConnect() {
    famQueue = famQueue.then(famSync).catch(e => {
      if (fam) { fam.busy = null; fam.err = friendly(e); renderFam(); }
    });
    return famQueue;
  }
  // Run an action in turn with the syncs; its errors go back to the caller.
  function inQueue(fn) {
    const p = famQueue.then(fn);
    famQueue = p.catch(() => {});
    return p;
  }
  async function famSync() {
    if (!FIREBASE_CONFIG) return;
    await fbInit();
    if (!famAuthOff) famUid = authUser() ? authUser().uid : null;
    if (!famAuthOff) famAuthOff = firebase.auth().onAuthStateChanged(u => { if ((u && u.uid) !== famUid) famConnect(); });
    const q = new URLSearchParams(location.search);
    // Coming back from an email sign-in link.
    if (firebase.auth().isSignInWithEmailLink(location.href)) {
      const email = stored(NS + 'signinEmail');
      if (!email) { if (fam) { fam.busy = null; fam.needEmail = true; renderFam(); } return; }  // opened on another device: ask
      await signInWithLink(email);
    }
    const u = authUser();
    famUid = u && u.uid;
    // A device's place in the family belongs to the account that joined.
    // Someone else signing in on purpose is fine; otherwise the device lost
    // its sign-in (browser data cleared, or the account deleted), and the
    // family screen says so and how to get back in.
    if (F && (!u || u.uid !== F.uid)) {
      if (realAccount(u)) { leaveLocally(); }
      else lostFamily('signin');
    }
    if (!F && u) await findMyFamily(u);
    if (F) await checkMembership();
    if (F) { watchLatest(); if (claimProgress()) { watchBackup(); await syncNow(); } }
    const raw = q.get('invite') || stored(NS + 'pendingInvite');
    if (raw && fam) await loadInvite(raw);
    famUid = authUser() ? authUser().uid : null;
    if (fam) { fam.busy = null; fam.err = null; renderFam(); }
  }

  // A parent on a new phone: the account remembers which family it's in.
  async function findMyFamily(u) {
    const snap = await fs().collection('users').doc(u.uid).get();
    const fid = snap.exists && snap.data().fid;
    if (!fid) return;
    try {
      const [m, f] = await Promise.all([famCol(fid, 'members').doc(u.uid).get(), famDoc(fid).get()]);
      if (!m.exists) return;
      const d = m.data();
      F = { fid, uid: u.uid, pid: d.pid, name: d.name, role: d.role, family: f.data().name, project: FIREBASE_CONFIG.projectId };
      saveFam();
      store(LOST_KEY, null);
    } catch (e) { if (e.code !== 'permission-denied') throw e; }   // not in it any more
  }

  async function checkMembership() {
    try {
      const m = await famCol(F.fid, 'members').doc(F.uid).get();
      if (!m.exists) throw Object.assign(new Error('gone'), { code: 'permission-denied' });
      const d = m.data();
      Object.assign(F, { name: d.name, role: d.role, pid: d.pid });
      delete F.pending;
      saveFam();
    } catch (e) {
      if (e.code !== 'permission-denied') throw e;
      if (F.pending) { F = null; saveFam(); return; }   // a join that never went through
      // Refused because this device is no longer signed in as the member
      // (its sign-in was cleared), or because a parent removed it.
      const u = authUser();
      lostFamily(u && u.uid === F.uid ? 'removed' : 'signin');
    }
  }
  // A listener or a save was refused: find out whether this device is still in the family.
  function recheckMembership(e) {
    if (e && e.code && e.code !== 'permission-denied') return;
    famQueue = famQueue.then(() => F && checkMembership()).catch(() => {});
  }
  // This device is no longer in its family: say why, here and on the family screen.
  function lostFamily(reason) {
    store(LOST_KEY, JSON.stringify({ family: F.family, name: F.name, role: F.role, reason }));
    toast('👪 ' + F.family, reason === 'removed' ? 'A parent took this device out of the family' : 'This device lost its place in the family. Open 👪 to get back in');
    leaveLocally();
  }
  // Its progress stays on the device, still marked as that person's.
  function leaveLocally() {
    stopFamWatch();
    if (famLatestOff) { famLatestOff(); famLatestOff = null; }
    if (backupOff) { backupOff(); backupOff = null; }
    clearTimeout(syncTimer); syncTimer = null;
    pendingAdopt = null;
    F = null; saveFam();
    $('chatDot').hidden = true;
  }

  /* ----- progress: whose it is, saved to the family, merged across devices ----- */

  // Progress lives on the device (S). S.owner says whose it is: a family
  // member's pid, or null for progress not linked to anyone (a device used
  // before it joined a family). A device only ever saves or loads its
  // owner's family copy, so a different person signing in never mixes two
  // people's progress: the other person's is set aside on the device (its
  // own slot) and comes back when they do.
  const slotKey = owner => STORE_KEY + '@' + (owner || 'local');
  const syncKey = pid => NS + 'synced@' + pid;
  const hasProgress = s => s.xp > 0 || Object.keys(s.answers || {}).length > 0 ||
    Object.keys(s.notes || {}).length > 0 || (s.history || []).length > 0;
  // The same progress always gives the same text, so two copies compare.
  function canon(v) {
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    if (v && typeof v === 'object') {
      return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
    }
    return JSON.stringify(v === undefined ? null : v);
  }

  // Restart the app with another person's progress on this device, setting
  // the current progress aside in its own slot.
  function switchProgress(to, name, note) {
    try {
      localStorage.setItem(slotKey(S.owner), JSON.stringify(S));
      const raw = localStorage.getItem(slotKey(to));
      localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign(raw ? JSON.parse(raw) : {}, { owner: to, ownerName: name })));
      localStorage.removeItem(slotKey(to));
      if (note) sessionStorage.setItem(NS + 'adopted', note);
    } catch (e) { toast("👪 Couldn't switch", 'This device is out of storage space'); return; }
    location.reload();
  }

  // Before anything is saved to the family, the progress on this device
  // must be the signed-in person's. True when it is; otherwise it asks.
  function claimProgress() {
    if (S.owner === F.pid) return true;
    if (!hasProgress(S)) { S.owner = F.pid; S.ownerName = F.name; saveLocal(); return true; }
    if (stored(slotKey(F.pid))) { switchProgress(F.pid, F.name); return false; }   // they've used this device before
    if (fam) { fam.claim = true; renderFam(); }
    else if (!claimAsked) { claimAsked = true; toast('👪 One question first', 'Open 👪 to finish setting up this device'); }
    return false;
  }
  function claimAnswer(yes) {
    fam.claim = false;
    if (!yes) return switchProgress(F.pid, F.name);
    S.owner = F.pid; S.ownerName = F.name;
    save();
    watchBackup();
    renderFam();
  }

  // Saving to the family. The family keeps one copy per person. Each
  // device remembers the last progress of its own that the family's copy
  // is known to include. If only this device changed since, it saves; if
  // only the family's copy changed (another device), this device takes it;
  // if both changed, they're merged, so nothing done on either is lost.
  const synced = () => (F ? stored(syncKey(F.pid)) : null);
  function setSynced(json) { store(syncKey(F.pid), json); store(NS + 'savedAt', String(Date.now())); }

  function queueSync(ms) {
    if (!F || syncTimer) return;
    syncTimer = setTimeout(syncNow, ms == null ? 3000 : ms);
  }
  function syncNow() {
    clearTimeout(syncTimer); syncTimer = null;
    syncChain = syncChain.then(syncProgress).then(() => { syncFails = 0; }, syncFailed);
    return syncChain;
  }
  async function syncProgress() {
    const u = authUser();
    if (!F || F.pending || !u || u.uid !== F.uid || S.owner !== F.pid) return;
    const ref = famCol(F.fid, 'backup').doc(F.pid), sumRef = famCol(F.fid, 'progress').doc(F.pid);
    const mine = canon(S), base = synced();
    let wrote = null, take = null;
    await fs().runTransaction(async t => {
      wrote = take = null;
      const snap = await t.get(ref);
      const theirs = snap.exists ? snap.data().state : null;
      if (theirs === mine) return;
      let next;
      if (theirs == null || theirs === base) next = S;                                   // only this device changed
      else if (mine === base) { take = theirs; return; }                                  // only the family's copy changed
      else next = mergeProgress(JSON.parse(theirs), S, base ? JSON.parse(base) : null);    // both changed
      next = Object.assign({}, next, { owner: F.pid, ownerName: F.name });
      wrote = canon(next);
      t.set(ref, { xp: next.xp, state: wrote, by: F.uid, updated: TS() });
      t.set(sumRef, summaryOf(next));
    });
    if (take) { adopt(take, mine, 'Progress synced|From your other device'); return; }
    setSynced(mine);                   // the family's copy now includes everything here
    if (wrote && wrote !== mine) adopt(wrote, mine, 'Progress merged|With your other device');
    if ($('famPeople')) renderPeople();
  }
  function syncFailed(e) {
    if (e && e.code === 'permission-denied') return recheckMembership(e);   // most likely taken out of the family
    // No connection, or Firestore busy: try again, less often each time.
    syncFails++;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, Math.min(300000, 15000 * Math.pow(2, syncFails - 1)));
    if ($('famPeople')) renderPeople();
  }

  // Another device saved: catch up without waiting for a restart.
  function watchBackup() {
    if (backupOff) backupOff();
    if (!F || S.owner !== F.pid) return;
    backupOff = famCol(F.fid, 'backup').doc(F.pid).onSnapshot(snap => {
      if (!snap.metadata.hasPendingWrites && snap.exists && snap.data().state !== synced()) queueSync(300);
    }, recheckMembership);
  }

  // Put the family's copy on this device: restart the app with it once
  // nothing is being used (a game, the TV board, typed text). If this
  // device's progress changed in the meantime, sync again instead (merge).
  function adopt(json, from, note) {
    pendingAdopt = { json, from, note };
    tryAdopt();
  }
  function tryAdopt() {
    clearTimeout(adoptTimer);
    const a = pendingAdopt;
    if (!a || !F) return;
    if (canon(S) !== a.from) { pendingAdopt = null; queueSync(0); return; }
    const typing = [...document.querySelectorAll('textarea, input.field')].some(t => t.value.trim() && !t.readOnly);
    const busy = ['play', 'live', 'board', 'parent', 'lesson', 'view', 'risk'].some(id => !$(id).hidden) || typing;
    if (busy) { adoptTimer = setTimeout(tryAdopt, 10000); return; }
    try {
      localStorage.setItem(STORE_KEY, a.json);
      store(syncKey(F.pid), a.json);
      sessionStorage.setItem(NS + 'adopted', a.note);
    } catch (e) { return; }
    location.reload();
  }

  // Two copies of one person's progress that both changed since they last
  // agreed (base): keep everything from both. The family's copy (theirs)
  // wins where both did the same thing; XP is the family's plus what this
  // device earned since base, not counting anything the family's copy
  // already has.
  function mergeProgress(R, L, B) {
    B = B || {};
    const has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);
    const M = JSON.parse(JSON.stringify(R));
    let gained = Math.max(0, (L.xp || 0) - (B.xp || 0));
    for (const k in L.answers || {}) if (!has(B.answers, k) && has(R.answers, k) && L.answers[k].right) gained -= XP.firstTry;
    for (const k in L.bonus || {}) if (!has(B.bonus, k) && has(R.bonus, k) && L.bonus[k].right) gained -= XP.bonus;
    for (const k in L.deep || {}) if (!has(B.deep, k) && has(R.deep, k) && L.deep[k].right) gained -= XP.bonus;
    for (const k in L.notes || {}) {
      if (L.notes[k].rewarded && !(has(B.notes, k) && B.notes[k].rewarded) && has(R.notes, k) && R.notes[k].rewarded) gained -= NOTE_XP;
    }
    M.xp = (R.xp || 0) + Math.max(0, gained);
    for (const key of ['answers', 'bonus', 'deep', 'sayings', 'recall', 'sayRecall']) M[key] = Object.assign({}, L[key] || {}, R[key] || {});
    // Notes: the later edit wins.
    M.notes = Object.assign({}, L.notes || {}, R.notes || {});
    for (const k in L.notes || {}) if (!has(R.notes, k) || (L.notes[k].at || 0) > (R.notes[k].at || 0)) M.notes[k] = L.notes[k];
    // Verse Word: the day's game that got further.
    M.words = Object.assign({}, L.words || {}, R.words || {});
    for (const d in L.words || {}) {
      const a = L.words[d], b = (R.words || {})[d];
      if (b && (a.guesses || []).length > (b.guesses || []).length) M.words[d] = a;
    }
    // Streak: whichever studied more recently.
    if ((L.lastStudy || '') > (R.lastStudy || '')) Object.assign(M, { lastStudy: L.lastStudy, streak: L.streak, freezes: L.freezes });
    else if (L.lastStudy === R.lastStudy) M.streak = Math.max(L.streak || 0, R.streak || 0);
    // Today's warm-up: both sets of answers.
    if (L.daily && (!R.daily || L.daily.day > R.daily.day)) M.daily = L.daily;
    else if (L.daily && R.daily && L.daily.day === R.daily.day) {
      M.daily = Object.assign({}, R.daily, { done: Object.assign({}, L.daily.done, R.daily.done), sayDone: R.daily.sayDone != null ? R.daily.sayDone : L.daily.sayDone });
    }
    // The weekly puzzle: the one that got further this week.
    const pzAhead = (a, b) => {
      if (!a) return false;
      if (!b) return true;
      if (a.week !== b.week) return a.week === WEEK.title;
      if ((a.status === 'won') !== (b.status === 'won')) return a.status === 'won';
      return (a.solved || []).length > (b.solved || []).length;
    };
    if (pzAhead(L.puzzle, R.puzzle)) M.puzzle = L.puzzle;
    M.climbDay = [L.climbDay, R.climbDay].filter(Boolean).sort().pop() || null;
    if ((L.history || []).length > (R.history || []).length) M.history = L.history;
    return M;
  }

  // What the whole family sees about one person.
  function summaryOf(s) {
    const vals = Object.values(s.answers || {});
    return {
      name: F.name, role: F.role === 'kid' ? 'kid' : 'grownup', xp: s.xp || 0, streak: s.streak || 0,
      lastStudy: s.lastStudy || '', week: WEEK.title, right: vals.filter(a => a.right).length, answered: vals.length, updated: TS()
    };
  }

  /* ----- the new-message dot ----- */

  function watchLatest() {
    if (famLatestOff) famLatestOff();
    famLatestOff = famCol(F.fid, 'messages').orderBy('at', 'desc').limit(1).onSnapshot(q => {
      const d = q.docs[0];
      const m = d ? d.data({ serverTimestamps: 'estimate' }) : null;
      famLatest = { at: m ? tsMs(m.at) : 0, mine: !m || m.uid === F.uid };
      updateFamDot();
    }, recheckMembership);
  }
  function updateFamDot() {
    const reading = fam && fam.tab === 'chat' && F && !fam.invite;
    if (reading && famLatest.at) store(NS + 'chatSeen', String(famLatest.at));
    const unread = !!F && !famLatest.mine && famLatest.at > (Number(stored(NS + 'chatSeen')) || 0);
    $('chatDot').hidden = !unread;
    const tabDot = $('famChatDot');
    if (tabDot) tabDot.hidden = !unread;
  }

  /* ----- the family screen ----- */

  function openFam(tab) {
    if (!fam) fam = { tab: tab || 'people', busy: FIREBASE_CONFIG ? 'Connecting…' : null, err: null, members: [], progress: [],
                      messages: [], hidden: {}, invites: [], unsub: [], watching: null, link: null, confirm: null, sent: null };
    $('fam').hidden = false;
    renderFam();
    if (FIREBASE_CONFIG) famConnect();
  }
  function closeFam() {
    if (!fam) return;
    stopFamWatch();
    fam = null;
    $('fam').hidden = true;
    $('famBody').innerHTML = '';   // its lists refresh from background saves only while it's open
    store(NS + 'pendingInvite', null);
    if (new URLSearchParams(location.search).get('invite')) history.replaceState(null, '', location.pathname);
  }
  function stopFamWatch() {
    if (!fam) return;
    fam.unsub.forEach(f => { try { f(); } catch (e) {} });
    fam.unsub = []; fam.watching = null;
  }

  function friendly(e) {
    const c = (e && e.code) || '';
    if (c === 'unavailable' || /internet|network/i.test((e && e.message) || '')) return "Couldn't connect. Check the internet and try again.";
    if (c === 'permission-denied') return "That isn't allowed. A parent may need to send a new link.";
    if (c === 'auth/invalid-action-code' || c === 'auth/expired-action-code') return 'That sign-in link has expired or was already used. Ask for a new one.';
    if (c === 'auth/invalid-email') return "That email address doesn't look right.";
    if (c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes and try again.';
    return (e && e.message) || 'Something went wrong.';
  }
  // A short message under the current form, without redrawing it.
  function famSay(msg) { const el = $('famNote'); if (el) el.textContent = msg || ''; }

  function renderFam() {
    if (!fam) return;
    $('famTitle').textContent = F && !fam.invite ? F.family : '';
    const body = $('famBody');
    const put = html => { body.innerHTML = `<div class="fam-wrap">${html}</div>`; };
    if (!FIREBASE_CONFIG) return put(`
      <p class="board-help">Family needs the online app: open Treasure Up from its web address, not a saved file or preview.</p>`);
    if (fam.busy) return put(`<p class="live-sub">${esc(fam.busy)}</p>`);
    if (fam.err) return put(`<p class="parent-msg">${esc(fam.err)}</p>
      <div class="board-actions"><button class="btn" data-fam="retry">Try again</button></div>`);
    if (fam.needEmail) return put(`
      <p class="clue-q" style="font-size:22px">Finish signing in</p>
      <label for="famEmail">Type the email address the link was sent to</label>
      <input id="famEmail" class="field" type="email" autocomplete="email">
      <div class="board-actions"><button class="btn" data-fam="finish">Sign in</button></div>
      <p id="famNote" class="parent-msg"></p>`);
    if (fam.invite) return put(inviteHtml());
    if (F && fam.claim) return put(claimHtml());
    if (F) { put(memberHtml()); famWatch(); renderPeople(); renderLink(); renderPending(); renderChat(true); updateFamDot(); return; }
    const u = authUser();
    put(realAccount(u) ? startHtml(u) : signInHtml());
  }

  // Whose is the progress already on this device?
  function claimHtml() {
    const kid = F.role === 'kid', L = levelFor(S.xp), name = esc(F.name);
    const day = S.lastStudy ? new Date(S.lastStudy + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    const whose = S.owner && S.ownerName ? esc(S.ownerName) + "'s progress" : 'progress';
    const it = kid ? name + "'s" : 'yours';
    return `
      <p class="clue-q" style="font-size:22px">One question first</p>
      <p class="board-help">This device already has ${whose} on it: Level ${L}, ${S.xp} XP${day ? ', last studied ' + esc(day) : ''}. Is it ${it}?</p>
      <div class="board-actions" style="flex-direction:column;align-items:stretch">
        <button class="btn" data-fam="claim-yes">Yes, it's ${it}</button>
        <button class="btn ghost" data-fam="claim-no">${kid ? 'No, start ' + name + ' fresh' : 'No, keep it apart'}</button>
      </div>
      <p class="fam-note">${kid
        ? `If it isn't, it stays on this device, set apart, and ${name} starts fresh here (or picks up ${name}'s progress saved in the family).`
        : "If it isn't, it stays on this device, set apart from your account, and comes back when you sign out."}</p>`;
  }

  // Why this device is no longer in its family, and how to get back in.
  function lostHtml() {
    let l = null;
    try { l = JSON.parse(stored(LOST_KEY)); } catch (e) {}
    if (!l) return '';
    const name = esc(l.name), family = esc(l.family);
    const why = l.reason === 'removed' ? `A parent took this device out of ${family}.` : `This device lost its place in ${family}: its sign-in was cleared.`;
    const how = l.role !== 'kid' ? 'Sign in again below to get back in.'
      : l.reason === 'removed' ? `If that was a mistake, a parent can add ${name} back from the family screen, and ${name}'s saved progress comes too.`
      : `To get back in, ask a parent to tap "Link another device" under ${name} and open that link here. ${name}'s saved progress comes too.`;
    return `<div class="fam-box" style="margin:0 0 14px">${why} ${how}</div>`;
  }

  function signInOptions(email) {
    if (fam.sent) return `
      <div class="fam-box"><b>Check ${esc(fam.sent)}</b> for a sign-in link from Treasure Up, and open it on this device.
        It can take a minute; look in spam if it isn't there.</div>`;
    return `
      <div class="board-actions"><button class="btn" data-fam="google">Continue with Google</button></div>
      <label for="famEmail">Or get a sign-in link by email</label>
      <input id="famEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(email || '')}">
      <div class="board-actions"><button class="btn ghost" data-fam="email">Email me a link</button></div>`;
  }

  function signInHtml() {
    return `${lostHtml()}
      <p class="clue-q" style="font-size:22px">Study together as a family</p>
      <p class="board-help">See how everyone's week is going, and talk about it in a family chat that parents can see all of.</p>
      <p class="fam-note" style="margin-top:14px">Grown-ups sign in here.</p>
      ${signInOptions('')}
      <p id="famNote" class="parent-msg"></p>
      <p class="fam-note">Kids: ask a parent to add you. They'll send a link to open on this phone or tablet.</p>`;
  }

  function startHtml(u) {
    return `
      <p class="clue-q" style="font-size:22px">Start your family</p>
      <p class="board-help">You're signed in as ${esc(u.email || 'a Google account')}. You'll be the family's first parent: you add everyone else, and you can hide chat messages.</p>
      <label for="famNewFamily">Family name</label>
      <input id="famNewFamily" class="field" maxlength="40" placeholder="The Smith Family">
      <label for="famMyName">Your name, as the family will see it</label>
      <input id="famMyName" class="field" maxlength="24" placeholder="Dad">
      <div class="board-actions"><button class="btn" data-fam="start">Start the family</button></div>
      <p id="famNote" class="parent-msg"></p>
      <p class="fam-note">Joining someone else's family? Open the link they sent you.
        <button class="fam-link" data-fam="signout">Sign out</button></p>`;
  }

  /* ----- joining with a link ----- */

  async function loadInvite(raw) {
    const m = /^([A-Za-z0-9]{20})\.([A-Za-z0-9]{20,40})$/.exec(raw || '');
    if (!m) { fam.invite = { problem: 'gone' }; return; }
    const u = await fbUser();
    let d = null;
    try { const snap = await famCol(m[1], 'invites').doc(m[2]).get(); d = snap.exists ? snap.data() : null; }
    catch (e) { if (e.code !== 'permission-denied') throw e; }
    // Already joined with it (a used link is soon deleted, so a missing one
    // for this device's own family counts too).
    if ((d && d.usedBy === u.uid) || (!d && F && F.fid === m[1])) { fam.invite = null; clearInvite(); return; }
    const gone = !d || d.usedBy || tsMs(d.expires) < Date.now();
    fam.invite = { fid: m[1], token: m[2], data: d, problem: gone ? 'gone' : null };
  }
  function clearInvite() {
    store(NS + 'pendingInvite', null);
    if (fam) fam.invite = null;
    if (new URLSearchParams(location.search).get('invite')) history.replaceState(null, '', location.pathname);
  }

  function inviteHtml() {
    const inv = fam.invite, d = inv.data, u = authUser();
    const done = `<div class="board-actions"><button class="btn ghost" data-fam="dismiss">Close</button></div>`;
    if (inv.problem) return `
      <p class="clue-q" style="font-size:22px">This link doesn't work any more</p>
      <p class="board-help">It has been used already or has expired. Ask a parent for a new one.</p>${done}`;
    const head = `<p class="clue-q" style="font-size:22px">Join ${esc(d.family)}</p>`;
    if (d.role === 'kid') {
      if (F && F.fid === inv.fid && F.pid === d.kidId) return head + `<p class="board-help">This device is already joined as ${esc(d.name)}.</p>${done}`;
      if (F) return head + `<p class="board-help">This device is already in ${esc(F.family)} as ${esc(F.name)}. A parent can take it out of that family first.</p>${done}`;
      if (realAccount(u)) return head + `
        <p class="board-help">This link makes this device ${esc(d.name)}'s. It's signed in as ${esc(u.email || 'a grown-up')} right now.
          Open the link on ${esc(d.name)}'s own phone or tablet, or sign out here first and then join.</p>
        <div class="board-actions"><button class="btn" data-fam="signout">Sign out first</button></div>
        <p id="famNote" class="parent-msg"></p>`;
      return head + `
        <p class="board-help">This phone or tablet will save ${esc(d.name)}'s progress to the family, and ${esc(d.name)} can use the family chat. Parents can read every message.</p>
        <div class="board-actions"><button class="btn" data-fam="join">Join as ${esc(d.name)}</button></div>
        <p id="famNote" class="parent-msg"></p>`;
    }
    if (F && F.role === 'kid') return head + `<p class="board-help">This device is ${esc(F.name)}'s. Open the link on your own phone.</p>${done}`;
    if (F) return head + `<p class="board-help">This device is already in ${esc(F.family)}.</p>${done}`;
    const as = `as ${esc(d.name)}${d.role === 'parent' ? ', a parent' : ''}`;
    if (realAccount(u) && u.emailVerified && (u.email || '').toLowerCase() === d.email) return head + `
      <p class="board-help">You're signed in as ${esc(u.email)}. You'll join ${as}.</p>
      <div class="board-actions"><button class="btn" data-fam="join">Join ${esc(d.family)}</button></div>
      <p id="famNote" class="parent-msg"></p>`;
    if (realAccount(u)) return head + `
      <p class="board-help">This invite is for ${esc(d.email)}, but you're signed in as ${esc(u.email || 'another account')}.</p>
      <div class="board-actions"><button class="btn" data-fam="signout">Sign out</button></div>
      <p class="fam-note">If ${esc(d.email)} isn't the right address, ask for a new invite with the right one.</p>`;
    return head + `
      <p class="board-help">You'll join ${as}. Sign in with <b>${esc(d.email)}</b>:</p>
      ${signInOptions(d.email)}
      <p id="famNote" class="parent-msg"></p>`;
  }

  async function joinFamily() {
    const { fid, token, data: d } = fam.invite;
    const u = await fbUser();
    const pid = d.role === 'kid' ? d.kidId : u.uid;
    const b = fs().batch();
    b.set(famCol(fid, 'members').doc(u.uid), { name: d.name, role: d.role, pid, invite: token, joined: TS() });
    b.update(famCol(fid, 'invites').doc(token), { usedBy: u.uid });
    b.set(fs().collection('users').doc(u.uid), { fid });
    // Remembered before it's sent, so a phone closed mid-join finishes it
    // (or forgets it, if it never reached the family) next time.
    F = { fid, uid: u.uid, pid, name: d.name, role: d.role, family: d.family, project: FIREBASE_CONFIG.projectId, pending: true };
    saveFam();
    try { await b.commit(); } catch (e) { F = null; saveFam(); throw e; }
    delete F.pending;
    saveFam();
    store(LOST_KEY, null);
    clearInvite();
    toast('👪 Welcome to ' + d.family, 'Joined as ' + d.name);
    watchLatest();
    if (claimProgress()) { watchBackup(); await syncNow(); }
  }

  async function startFamily() {
    const family = $('famNewFamily').value.trim(), name = $('famMyName').value.trim();
    if (!family) return famSay('Give the family a name.'), false;
    if (!name) return famSay('Type your name, as the family will see it.'), false;
    const u = authUser();
    const ref = fs().collection('families').doc();
    const b = fs().batch();
    b.set(ref, { name: family, createdBy: u.uid, created: TS() });
    b.set(ref.collection('members').doc(u.uid), { name, role: 'parent', pid: u.uid, invite: '', joined: TS() });
    b.set(fs().collection('users').doc(u.uid), { fid: ref.id });
    await b.commit();
    F = { fid: ref.id, uid: u.uid, pid: u.uid, name, role: 'parent', family, project: FIREBASE_CONFIG.projectId };
    saveFam();
    store(LOST_KEY, null);
    watchLatest();
    if (claimProgress()) { watchBackup(); await syncNow(); }
    return true;
  }

  /* ----- signing in (grown-ups) ----- */

  async function googleSignIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await firebase.auth().signInWithPopup(provider); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(provider);
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      throw e;
    }
  }

  async function emailLink() {
    const email = ($('famEmail').value || '').trim().toLowerCase();
    if (!/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)) return famSay("That email address doesn't look right.");
    const inv = fam.invite && fam.invite.token ? fam.invite.fid + '.' + fam.invite.token : '';
    await firebase.auth().sendSignInLinkToEmail(email, { url: appUrl() + (inv ? '?invite=' + inv : ''), handleCodeInApp: true });
    store(NS + 'signinEmail', email);
    if (inv) store(NS + 'pendingInvite', inv);
    fam.sent = email;
    renderFam();
  }

  async function finishEmail() {
    const email = ($('famEmail').value || '').trim().toLowerCase();
    if (!email) return famSay('Type your email address.');
    await signInWithLink(email);
    fam.needEmail = false;
    fam.busy = 'Connecting…'; renderFam();
    famConnect();
  }

  // Finish an email sign-in link, then take its codes out of the address
  // (a used link can't be used twice), keeping any join link.
  async function signInWithLink(email) {
    const drop = () => {
      const q = new URLSearchParams(location.search);
      ['apiKey', 'oobCode', 'mode', 'lang', 'continueUrl', 'tenantId'].forEach(k => q.delete(k));
      const rest = q.toString();
      history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
    };
    try { await firebase.auth().signInWithEmailLink(email, location.href); }
    catch (e) { if (/action-code/.test(e.code || '')) drop(); throw e; }
    store(NS + 'signinEmail', null);
    drop();
  }

  // Their progress goes with their account: the device goes back to what
  // it had before they signed in (or starts fresh), and theirs is set
  // aside on the device for when they sign in again.
  async function famSignOut() {
    await syncNow();
    const owner = S.owner;
    leaveLocally();
    if (fam) fam.sent = null;
    await firebase.auth().signOut();   // the auth listener redraws
    if (owner) switchProgress(null, null);
  }

  /* ----- a member's view: People and Chat ----- */

  function memberHtml() {
    const tab = (id, label) => `<button class="fam-tab${fam.tab === id ? ' on' : ''}" data-fam="tab" data-tab="${id}">${label}</button>`;
    const u = authUser();
    return `
      <div class="fam-tabs">${tab('people', 'People')}${tab('chat', 'Chat<span id="famChatDot" class="hud-dot" hidden></span>')}</div>
      ${fam.tab === 'chat' ? `
        <div id="chatList" class="chat-list"></div>
        <div class="chat-form">
          <textarea id="chatText" class="field" maxlength="500" rows="2" placeholder="Message the family"></textarea>
          <button class="btn" data-fam="send">Send</button>
        </div>
        <p id="famNote" class="parent-msg"></p>
        <p class="fam-note">Everyone in the family sees every message, and parents can hide any message. Text and emoji only: no links or photos.</p>`
      : `
        <div id="famPeople"></div>
        ${F.role === 'parent' ? addHtml() : ''}
        <p class="fam-note" style="margin-top:22px">${realAccount(u)
          ? `Signed in as ${esc(u.email || 'Google')} · <button class="fam-link" data-fam="signout">Sign out</button>`
