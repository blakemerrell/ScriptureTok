          : `This device is ${esc(F.name)}'s.`}</p>`}`;
  }

  function famWatch() {
    if (!fam || fam.watching === F.fid) return;
    stopFamWatch();
    fam.watching = F.fid;
    const on = (ref, cb) => fam.unsub.push(ref.onSnapshot(cb, famLost));
    on(famDoc(F.fid), s => {
      if (!s.exists || !F) return;
      F.family = s.data().name; saveFam();
      fam.createdBy = s.data().createdBy;
      if (!fam.invite) $('famTitle').textContent = F.family;
      renderPeople();
    });
    on(famCol(F.fid, 'members'), q => {
      fam.members = q.docs.map(d => Object.assign({ uid: d.id }, d.data({ serverTimestamps: 'estimate' })));
      const mine = fam.members.find(m => m.uid === F.uid);
      if (mine && mine.role !== F.role) { F.role = mine.role; saveFam(); stopFamWatch(); renderFam(); return; }
      renderPeople();
    });
    on(famCol(F.fid, 'progress'), q => { fam.progress = q.docs.map(d => Object.assign({ pid: d.id }, d.data())); renderPeople(); });
    on(famCol(F.fid, 'messages').orderBy('at', 'desc').limit(100), q => {
      fam.messages = q.docs.map(d => { const m = d.data({ serverTimestamps: 'estimate' }); return Object.assign(m, { id: d.id, at: tsMs(m.at) }); }).reverse();
      renderChat(false);
    });
    if (F.role === 'parent') {
      // All of the family's links, not just unused ones: a listener on
      // "usedBy == null" sometimes missed a link being used (seen in tests).
      // Used and expired links are tidied away from here.
      on(famCol(F.fid, 'invites'), q => {
        const all = q.docs.map(d => { const i = d.data(); return Object.assign(i, { id: d.id, expires: tsMs(i.expires) }); });
        fam.invites = all.filter(i => !i.usedBy && i.expires > Date.now());
        if (fam.link && !fam.invites.some(i => i.id === fam.link.token)) { fam.link = null; renderLink(); }   // used or cancelled
        all.filter(i => i.usedBy || i.expires < Date.now() - 86400000).forEach(i => famCol(F.fid, 'invites').doc(i.id).delete().catch(() => {}));
        renderPending();
      });
      on(famCol(F.fid, 'hidden'), q => { fam.hidden = {}; q.docs.forEach(d => { fam.hidden[d.id] = d.data().text; }); renderChat(false); });
    }
  }
  // A listener was refused: either this device was taken out of the
  // family, or its role changed (a parent-only list). Find out which.
  function famLost() {
    if (!fam || !F) return;
    stopFamWatch();
    famQueue = famQueue.then(() => F && checkMembership()).catch(() => {}).then(() => renderFam());
  }

  // People, one row each; a child's devices are listed under them.
  function people() {
    const by = new Map();
    fam.members.forEach(m => {
      const p = by.get(m.pid) || { pid: m.pid, name: m.name, role: m.role, devices: [] };
      p.devices.push({ uid: m.uid, joined: tsMs(m.joined) || 0 });
      by.set(m.pid, p);
    });
    const prog = new Map(fam.progress.map(g => [g.pid, g]));
    const order = { kid: 0, parent: 1, adult: 2 };
    return [...by.values()].map(p => Object.assign(p, {
      prog: prog.get(p.pid) || null,
      founder: !!fam.createdBy && p.devices.some(d => d.uid === fam.createdBy),
      devices: p.devices.sort((a, b) => a.joined - b.joined)
    })).sort((a, b) => (order[a.role] - order[b.role]) || a.name.localeCompare(b.name));
  }

  function renderPeople() {
    const el = $('famPeople');
    if (!el || !F || !fam) return;
    const ps = people();
    const total = ps.reduce((n, p) => n + (p.prog && p.prog.week === WEEK.title ? p.prog.right || 0 : 0), 0);
    el.innerHTML = `
      <div class="fam-total">Together this week
        <b>${total} right answer${total === 1 ? '' : 's'}</b>
        <small>${esc(WEEK.title)}</small></div>
      ${ps.map(personHtml).join('')}
      ${takenOutHtml()}
      <p class="fam-note">${esc(savedLine())}</p>`;
  }

  // Whether this device's progress has reached the family.
  function savedLine() {
    if (S.owner !== F.pid) return 'This device saves to the family once the question about its progress is answered.';
    const at = Number(stored(NS + 'savedAt')) || 0;
    if (canon(S) === synced()) return "This device's progress is saved to the family" + (at ? ' (' + when(at) + ').' : '.');
    return "Some progress on this device isn't saved to the family yet" + (at ? ' (last saved ' + when(at) + ')' : '') +
      '. It saves by itself when there’s a connection.';
  }

  function personHtml(p) {
    const g = p.prog, parent = F.role === 'parent', me = p.pid === F.pid;
    const L = g ? levelFor(g.xp) : 0;
    const streak = g && g.lastStudy && dayDiff(g.lastStudy, dayKey()) <= 1 ? g.streak : 0;
    const week = !g ? "Hasn't played on a linked device yet"
      : g.week === WEEK.title ? `This week: ${g.right} of ${WEEK.reels.length} right` : 'This week: not started';
    const confirm = (key, label, ask) => `<button class="fam-link${fam.confirm === key ? ' warn' : ''}" data-fam="confirm" data-key="${esc(key)}">${fam.confirm === key ? ask : label}</button>`;
    const acts = [];
    let devices = '';
    // Parents see every device joined as a child, so one nobody recognizes stands out.
    if (parent && p.role === 'kid') {
      devices = `<div class="fam-devices">${p.devices.map(d => `
        <div class="fam-device"><span>📱 Device joined ${esc(d.joined ? when(d.joined) : 'just now')}</span>
          ${confirm('dev:' + d.uid, 'Remove', p.devices.length === 1 ? 'Tap again: ' + esc(p.name) + ' leaves the family' : 'Tap again to remove this device')}</div>`).join('')}</div>`;
      acts.push(`<button class="fam-link" data-fam="device" data-pid="${esc(p.pid)}">Link another device</button>`);
    }
    // Whoever started the family stays a parent.
    if (parent && !me && p.role !== 'kid' && !p.founder) {
      acts.push(p.role === 'adult'
        ? `<button class="fam-link" data-fam="role" data-pid="${esc(p.pid)}" data-role="parent">Make a parent</button>`
        : `<button class="fam-link" data-fam="role" data-pid="${esc(p.pid)}" data-role="adult">Not a parent</button>`);
      acts.push(confirm('person:' + p.pid, 'Remove', 'Tap again to take ' + esc(p.name) + ' out of the family'));
    }
    return `
      <div class="fam-person">
        <div class="fp-top">
          <span class="fp-name">${esc(p.name)}${p.role === 'parent' ? '<span class="fam-role">Parent</span>' : ''}${me ? ' <span class="fam-you">(you)</span>' : ''}</span>
          ${g ? `<span class="fp-lv">Level ${L} · ${esc(LEVEL_TITLES[L - 1])}</span>` : ''}
        </div>
        <div class="fp-sub">${g ? `${g.xp} XP · 🔥 ${streak} · ` : ''}${esc(week)}</div>
        ${devices}
        ${acts.length ? `<div class="fam-actions">${acts.join('')}</div>` : ''}
      </div>`;
  }

  // People whose saved progress is still in the family after they were
  // taken out: a parent can bring a child back with it, or delete it.
  function takenOutHtml() {
    if (F.role !== 'parent') return '';
    const inFamily = new Set(fam.members.map(m => m.pid));
    const gone = fam.progress.filter(g => !inFamily.has(g.pid));
    if (!gone.length) return '';
    return `<div class="eyebrow" style="margin-top:22px">Taken out of the family</div>` + gone.map(g => {
      const kid = g.role ? g.role === 'kid' : g.pid.length < 20;
      const key = 'saved:' + g.pid;
      return `
        <div class="fam-person">
          <div class="fp-top"><span class="fp-name">${esc(g.name)}</span><span class="fp-lv">${g.xp} XP saved</span></div>
          <div class="fp-sub">${kid ? `Adding ${esc(g.name)} back brings this progress with them.` : 'Inviting them again by email brings this progress back.'}</div>
          <div class="fam-actions">
            ${kid ? `<button class="fam-link" data-fam="device" data-pid="${esc(g.pid)}">Add ${esc(g.name)} back</button>` : ''}
            <button class="fam-link${fam.confirm === key ? ' warn' : ''}" data-fam="confirm" data-key="${esc(key)}">${fam.confirm === key ? 'Tap again to delete it for good' : 'Delete saved progress'}</button>
          </div>
        </div>`;
    }).join('');
  }

  function addHtml() {
    const kind = (v, label, sub, on) => `
      <label><input type="radio" name="famKind" value="${v}"${on ? ' checked' : ''}><span>${label}<small>${sub}</small></span></label>`;
    return `
      <div class="eyebrow" style="margin-top:24px">Add someone</div>
      <div class="fam-kinds">
        ${kind('kid', 'A child', 'Joins with a link opened on their own phone or tablet. No email needed.', true)}
        ${kind('adult', 'A grown-up', 'A grandparent, friend or roommate. Signs in with their email.', false)}
        ${kind('parent', 'Another parent', 'Signs in with their email. Can add people and hide messages.', false)}
      </div>
      <label for="famNewName">First name</label>
      <input id="famNewName" class="field" maxlength="24" autocomplete="off">
      <div id="famEmailRow" hidden>
        <label for="famNewEmail">Their email address</label>
        <input id="famNewEmail" class="field" type="email" autocomplete="off">
      </div>
      <div class="board-actions"><button class="btn" data-fam="invite">Make a join link</button></div>
      <p id="famNote" class="parent-msg"></p>
      <div id="famLink"></div>
      <div id="famPending"></div>`;
  }

  async function makeInvite(role, name, email, kidId) {
    const token = newId(24);
    await famCol(F.fid, 'invites').doc(token).set({
      role, name, email: role === 'kid' ? '' : email, kidId: role === 'kid' ? kidId || newId(16) : '',
      family: F.family, createdBy: F.uid, usedBy: null,
      expires: firebase.firestore.Timestamp.fromMillis(Date.now() + INVITE_DAYS * 86400000)
    });
    fam.link = { token, name, role, email };
    renderLink();
  }

  async function inviteFromForm() {
    const role = (document.querySelector('input[name="famKind"]:checked') || {}).value || 'kid';
    const name = $('famNewName').value.trim();
    const email = role === 'kid' ? '' : $('famNewEmail').value.trim().toLowerCase();
    if (!name) return famSay('Type their first name.');
    if (role !== 'kid' && !/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)) return famSay('Type their email address: they sign in with it.');
    famSay('');
    await makeInvite(role, name, email);
    $('famNewName').value = ''; $('famNewEmail').value = '';
  }

  function renderLink() {
    const el = $('famLink');
    if (!el || !fam) return;
    const l = fam.link;
    if (!l) { el.innerHTML = ''; return; }
    const url = inviteUrl(l.token), who = esc(l.name);
    const mail = 'mailto:' + encodeURIComponent(l.email) +
      '?subject=' + encodeURIComponent('Join ' + F.family + ' on Treasure Up') +
      '&body=' + encodeURIComponent(F.name + ' added you to ' + F.family + ' on Treasure Up.\n\nOpen this link and sign in with ' + l.email + ':\n' + url +
                                    '\n\nThe link works once, for ' + INVITE_DAYS + ' days.');
    el.innerHTML = `
      <div class="fam-box">
        <b>${l.role === 'kid' ? `Open this link on ${who}'s phone or tablet.` : `Send this to ${who}. They'll sign in with ${esc(l.email)}.`}</b>
        <div class="fam-note" style="margin-top:2px">It works once, for ${INVITE_DAYS} days.</div>
        <input id="famLinkText" class="field" readonly value="${esc(url)}">
        <div class="board-actions">
          ${navigator.share ? '<button class="btn" data-fam="share">Share</button>' : ''}
          <button class="btn ghost" data-fam="copy">Copy link</button>
          ${l.role !== 'kid' ? `<a class="btn ghost" href="${esc(mail)}" style="text-decoration:none">Email it</a>` : ''}
        </div>
      </div>`;
  }

  function renderPending() {
    const el = $('famPending');
    if (!el || !fam) return;
    const list = fam.invites.filter(i => i.expires > Date.now()).sort((a, b) => a.expires - b.expires);
    const until = ms => new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
    el.innerHTML = !list.length ? '' : `
      <div class="eyebrow" style="margin-top:22px">Waiting to join</div>
      ${list.map(i => `
        <div class="fam-person">
          <div class="fp-top"><span class="fp-name">${esc(i.name)}${i.role === 'parent' ? '<span class="fam-role">Parent</span>' : ''}</span>
            <span class="fp-lv">Link works until ${until(i.expires)}</span></div>
          <div class="fp-sub">${i.role === 'kid' ? 'A link for their phone or tablet' : 'Signs in with ' + esc(i.email)}</div>
          <div class="fam-actions">
            <button class="fam-link" data-fam="showlink" data-token="${esc(i.id)}">Show the link</button>
            <button class="fam-link" data-fam="cancel" data-token="${esc(i.id)}">Cancel it</button>
          </div>
        </div>`).join('')}`;
  }

  // Remove a device or a person, or delete saved progress: the first tap
  // asks, the second does it.
  async function confirmAction(key) {
    if (fam.confirm !== key) { fam.confirm = key; renderPeople(); return; }
    fam.confirm = null;
    const [what, id] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    const b = fs().batch();
    if (what === 'dev') b.delete(famCol(F.fid, 'members').doc(id));
    if (what === 'person') { const p = people().find(x => x.pid === id); if (p) p.devices.forEach(d => b.delete(famCol(F.fid, 'members').doc(d.uid))); }
    if (what === 'saved') { b.delete(famCol(F.fid, 'progress').doc(id)); b.delete(famCol(F.fid, 'backup').doc(id)); }
    await b.commit();
  }

  async function setRole(pid, role) {
    const p = people().find(x => x.pid === pid);
    if (!p) return;
    const b = fs().batch();
    p.uids.forEach(uid => b.update(famCol(F.fid, 'members').doc(uid), { role }));
    await b.commit();
  }

  /* ----- chat ----- */

  function when(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return dayKey(d) === dayKey() ? t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
  }

  function msgHtml(m) {
    const parent = F.role === 'parent', orig = m.hidden && parent ? fam.hidden[m.id] : null;
    return `
      <div class="msg${m.uid === F.uid ? ' mine' : ''}${m.hidden ? ' gone' : ''}">
        <div class="mh"><b>${esc(m.name)}</b><span>${esc(when(m.at))}</span>
          ${parent ? `<button class="fam-link" data-fam="${m.hidden ? 'unhide' : 'hide'}" data-mid="${esc(m.id)}">${m.hidden ? 'Unhide' : 'Hide'}</button>` : ''}</div>
        <div class="mt">${m.hidden ? 'Hidden by a parent' : esc(m.text)}</div>
        ${orig != null ? `<div class="orig">${esc(orig)}</div>` : ''}
      </div>`;
  }

  function renderChat(first) {
    const el = $('chatList');
    if (!el || !fam) return;
    const sc = $('fam');
    const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    el.innerHTML = fam.messages.length ? fam.messages.map(msgHtml).join('')
      : '<p class="fam-note">No messages yet. Say hello, or share something you learned this week.</p>';
    if (first || nearBottom) sc.scrollTop = sc.scrollHeight;
    updateFamDot();
  }

  async function sendMsg() {
    const box = $('chatText'), text = box.value.trim();
    if (!text) return;
    if (LINKS.test(text)) return famSay("Links can't be sent in the family chat.");
    famSay('');
    box.value = '';
    try { await famCol(F.fid, 'messages').add({ uid: F.uid, name: F.name, text, at: TS(), hidden: false }); }
    catch (e) { box.value = text; famSay("Couldn't send. Check the internet and try again."); }
  }

  // Hiding blanks the message for everyone and keeps its text where only
  // parents can read it; unhiding puts it back.
  async function hideMsg(mid, hide) {
    const m = fam.messages.find(x => x.id === mid);
    if (!m || m.hidden === hide) return;
    const b = fs().batch();
    if (hide) {
      b.set(famCol(F.fid, 'hidden').doc(mid), { text: m.text, by: F.uid, at: TS() });
      b.update(famCol(F.fid, 'messages').doc(mid), { hidden: true, text: '' });
    } else {
      if (fam.hidden[mid] == null) return;
      b.update(famCol(F.fid, 'messages').doc(mid), { hidden: false, text: fam.hidden[mid] });
      b.delete(famCol(F.fid, 'hidden').doc(mid));
    }
    await b.commit();
  }

  async function famAction(el) {
    const act = el.dataset.fam;
    try {
      if (act === 'retry') { fam.err = null; fam.busy = 'Connecting…'; renderFam(); return famConnect(); }
      if (act === 'dismiss') { clearInvite(); return renderFam(); }
      if (act === 'google') return await googleSignIn();
      if (act === 'email') return await emailLink();
      if (act === 'finish') return await finishEmail();
      if (act === 'signout') return await inQueue(famSignOut);
      if (act === 'start') {
        el.disabled = true;
        if (await inQueue(startFamily)) renderFam(); else el.disabled = false;
        return;
      }
      if (act === 'join') { el.disabled = true; await inQueue(joinFamily); return renderFam(); }
      if (act === 'claim-yes' || act === 'claim-no') return claimAnswer(act === 'claim-yes');
      if (act === 'tab') { fam.tab = el.dataset.tab; return renderFam(); }
      if (act === 'invite') return await inviteFromForm();
      if (act === 'device') {        // another device for a child, or a child taken out coming back
        const p = people().find(x => x.pid === el.dataset.pid) || fam.progress.find(g => g.pid === el.dataset.pid);
        if (!p) return;
        await makeInvite('kid', p.name, '', el.dataset.pid);
        $('famLink').scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
        return;
      }
      if (act === 'showlink') {
        const i = fam.invites.find(x => x.id === el.dataset.token);
        if (i) { fam.link = { token: i.id, name: i.name, role: i.role, email: i.email }; renderLink(); }
        return;
      }
      if (act === 'cancel') {
        if (fam.link && fam.link.token === el.dataset.token) { fam.link = null; renderLink(); }
        return await famCol(F.fid, 'invites').doc(el.dataset.token).delete();
      }
      if (act === 'copy') {
        const url = $('famLinkText').value;
        try { await navigator.clipboard.writeText(url); famSay('Link copied.'); }
        catch (e) { $('famLinkText').select(); famSay('Select the link and copy it.'); }
        return;
      }
      if (act === 'share') {
        const l = fam.link;
        try { await navigator.share({ title: 'Join ' + F.family + ' on Treasure Up', text: l.role === 'kid' ? 'Open this on ' + l.name + "'s phone or tablet:" : 'Open this and sign in with ' + l.email + ':', url: inviteUrl(l.token) }); }
        catch (e) {}
        return;
      }
      if (act === 'role') return await setRole(el.dataset.pid, el.dataset.role);
      if (act === 'confirm') return await confirmAction(el.dataset.key);
      if (act === 'send') return await sendMsg();
      if (act === 'hide' || act === 'unhide') return await hideMsg(el.dataset.mid, act === 'hide');
    } catch (e) {
      el.disabled = false;
      if ($('famNote')) famSay(friendly(e));
      else toast('👪 Family', friendly(e));
    }
  }

  /* ---------------- a day's lesson ---------------- */

  // The main way through a day, Duolingo-style: one step at a time, with a
  // progress bar, Check, and right or wrong with the why. A lesson is one
  // part of the week's plan (a section, Friday's deep dive, Saturday's
  // puzzle), after whatever is left of today's warm-up. It records each
  // answer the first time only, and the plan, the streak, XP and the
  // family's copy all see it. The practice steps (fill
  // in the word, put the words in order, match, who said it) are built from
  // the week's checked text and pay nothing. A missed step comes back at
  // the end until he gets it right; only the first try counts.
  const LESSON_SKIP = new Set(('shall their which there these those thee thine unto them with from have that this will when what ' +
    'they were into upon your also hath doth said saith every because before after again being where whose shalt').split(' '));
  const wordsOf = t => t.match(/[A-Za-z’']+/g) || [];
  const keyWord = w => w.length >= 5 && !LESSON_SKIP.has(w.toLowerCase());
  let lesson = null;

  // The part of the plan the Today card starts: the first one, from today
  // or an earlier day, that isn't finished.
  const lessonNow = () => todayEntries().find(e => entryItems(e).some(x => !x.done)) || null;
  // What a lesson holds, for the button that starts it.
  function lessonParts(e) {
    const parts = warmupsLeft().length ? ['Warm-up'] : [];
    if (e && e.kind === 'section') {
      const n = WEEK.reels.filter(r => r.section === e.i && !S.answers[r.id]).length;
      if (n) parts.push(n === 1 ? '1 reel' : n + ' reels');
      if (deepItems().some(d => d.section === e.i && !S.deep[d.id])) parts.push('Go deeper');
    } else if (e && e.kind === 'friday') {
      const n = fridayItems().filter(d => !S.deep[d.id]).length;
      parts.push(n === 1 ? '1 reading' : n + ' readings');
    } else if (e && e.kind === 'puzzle') parts.push('The weekly puzzle');
    return parts.join(' · ');
  }

  // Fill in the missing word: one word of the verse, and two from the week's other verses.
  function blankStep(r) {
    const words = wordsOf(r.verse.text).filter(keyWord);
    if (!words.length) return null;
    const right = words[hash(r.id + '|blank') % words.length];
    const pool = [...new Map(WEEK.reels.filter(x => x.id !== r.id).flatMap(x => wordsOf(x.verse.text)).filter(keyWord)
      .filter(w => w.toLowerCase() !== right.toLowerCase()).map(w => [w.toLowerCase(), w])).values()];
    const near = pool.sort((a, b) => Math.abs(a.length - right.length) - Math.abs(b.length - right.length) || hash(a) - hash(b)).slice(0, 6);
    const wrong = shuffled(near, r.id + '|near').slice(0, 2);
    if (wrong.length < 2) return null;
    // The word itself, not the same letters inside a longer word.
    const m = new RegExp('(^|[^A-Za-z’\'])' + right + '(?![A-Za-z’\'])').exec(r.verse.text);
    const at = m.index + m[1].length;
    return { kind: 'blank', ref: r.verse.ref, home: r.verse.ref, before: r.verse.text.slice(0, at), after: r.verse.text.slice(at + right.length),
             right, choices: shuffled([right].concat(wrong), r.id + '|blankc') };
  }
  // Put a phrase of the verse back in order.
  function orderStep(r) {
    const phrase = r.verse.text.split(/[,:;.…]/).map(x => x.trim()).find(c => { const n = wordsOf(c).length; return n >= 4 && n <= 8; })
      || wordsOf(r.verse.text).slice(0, 7).join(' ');
    const words = wordsOf(phrase);
    let tiles = shuffled(words.map((w, i) => ({ w, i })), r.id + '|order');
    if (tiles.every((t, i) => t.i === i)) tiles = tiles.reverse();
    return { kind: 'order', ref: r.verse.ref, home: r.verse.ref, words, tiles };
  }
  // Match each idea to its verse: the puzzle's tiles for this section.
  function matchStep(section) {
    const g = WEEK.puzzle && WEEK.puzzle.groups.find(x => x.section === section);
    const seen = new Set();
    const pairs = (g ? g.tiles : []).filter(t => !seen.has(t.ref) && seen.add(t.ref)).map(t => ({ a: t.text, b: t.ref }));
    return pairs.length < 3 ? null : { kind: 'match', pairs, left: shuffled(pairs.map(p => p.a), 'L' + section), right: shuffled(pairs.map(p => p.b), 'R' + section) };
  }
  function sayStep(section) {
    const list = WEEK.sayings || [];
    if (!list.length) return null;
    const chapters = new Set(WEEK.reels.filter(r => r.section === section).map(r => r.verse.ref.replace(/:.*/, '')));
    const x = list.find(y => chapters.has(y.ref.replace(/:.*/, ''))) || list[hash(WEEK.title + section) % list.length];
    return { kind: 'say', text: x.text, ref: x.ref, home: x.ref, right: x.speaker, choices: shuffled([x.speaker].concat(x.wrong), x.id + '|say'), why: x.why };
  }
  const deepStep = d => ({ kind: 'deep', id: d.id, d, home: deepHome(d), q: d.q, right: d.right, why: d.why, choices: choicesFor(d, 'deep|' + d.id) });

  // A finished part plays again as practice: everything in it, nothing to earn.
  function buildLesson(entry) {
    const steps = [];
    S.daily.ids.filter(id => !S.daily.done[id]).map(reelById).filter(Boolean).forEach(r => steps.push({
      kind: 'recall', id: r.id, r, home: r.verse.ref, q: r.question.q, right: r.question.right, why: r.question.why, choices: choicesFor(r.question, r.id + '|' + S.daily.day) }));
    const x = S.daily.say && !S.daily.sayDone && (WEEK.sayings || []).find(y => y.id === S.daily.say);
    if (x) steps.push({ kind: 'saywarm', text: x.text, ref: x.ref, home: x.ref, right: x.speaker, why: x.why, choices: shuffled([x.speaker].concat(x.wrong), x.id + '|' + S.daily.day) });
    const practice = !!entry && entryItems(entry).every(i => i.done);
    if (entry && entry.kind === 'section') {
      const reels = WEEK.reels.filter(r => r.section === entry.i);
      reels.filter(r => practice || !S.answers[r.id]).forEach(r => {
        steps.push({ kind: 'read', r });
        steps.push({ kind: 'reel', id: r.id, home: r.verse.ref, q: r.question.q, right: r.question.right, why: r.question.why, choices: choicesFor(r.question, r.id) });
        const b = blankStep(r);
        if (b) steps.push(b);
      });
      if (reels.length) steps.push(orderStep(reels[hash(WEEK.title + entry.i) % reels.length]));
      [matchStep(entry.i), x ? null : sayStep(entry.i)].forEach(y => { if (y) steps.push(y); });
      deepItems().filter(d => d.section === entry.i && (practice || !S.deep[d.id])).forEach(d => steps.push(deepStep(d)));
    } else if (entry && entry.kind === 'friday') {
      fridayItems().filter(d => practice || !S.deep[d.id]).forEach(d => steps.push(deepStep(d)));
    } else if (entry && entry.kind === 'puzzle') steps.push({ kind: 'puzzle' });
    return { entry, practice, steps, at: 0, right: 0, scored: 0, start: Date.now(), xp0: S.xp, rewards: [], level: 0 };
  }

  // `key` is a part of the week map ("day.part"), or '' for today's.
  function openLesson(key) {
    const m = /^(\d)\.(\d+)$/.exec(key || '');
    const plan = weekPlan();
    // Today's: the next unfinished part; the warm-up alone if that's all
    // that's left; with nothing left, today's part again as practice.
    const entry = m ? (plan[m[1]] || [])[m[2]]
      : lessonNow() || (warmupsLeft().length ? null : plan[todayIndex()].find(e => e.kind !== 'family')) || null;
    const L = buildLesson(entry || null);
    if (!L.steps.length) { toast('Nothing planned today', 'Catch up, or read ahead on the week map'); return; }
    lesson = L;
    lessonReset();
    $('lesson').hidden = false;
    renderLesson();
  }
  // Back to the page, where the Today card and the map show what's done.
  function closeLesson() {
    const L = lesson;
    lesson = null;
    $('lesson').hidden = true;
    if (location.hash === '#lesson') history.replaceState(null, '', location.pathname + location.search);
    stopClips();
    if (!L) return;
    renderHome();
    $('home').scrollTop = 0;
    renderHud();
    if (L.level) levelUp(L.level);
  }
  function lessonReset() { Object.assign(lesson, { picked: null, built: [], matched: {}, sel: null, missR: null, misses: 0, checked: false, ok: null, earned: 0 }); }

  // Checking a step records it, the first time only.
  function recordStep(step, picked, ok) {
    if (step.retry) return 0;
    const before = S.xp;
    if (step.kind === 'reel') recordReel(step.id, picked);
    else if (step.kind === 'recall') recordRecall(step.id, picked);
    else if (step.kind === 'saywarm') recordSayWarm(picked);
    else if (step.kind === 'deep') recordDeep(step.id, picked);
    return S.xp - before;
  }

  const LESSON_KIND = { recall: 'Warm-up · remember this?', saywarm: 'Warm-up · who said it?', reel: 'Choose the right answer',
    blank: 'Fill in the missing word', order: 'Put the words in order', match: 'Match each idea to its verse', say: 'Who said it?', deep: 'Go deeper' };

  function renderLesson() {
    if (!lesson) return;
    const L = lesson, step = L.steps[L.at], xp = S.xp - L.xp0;
    $('lessonBar').style.width = Math.round(L.at / L.steps.length * 100) + '%';
    $('lessonXp').textContent = xp ? '+' + xp + ' XP' : '';
    const body = $('lessonBody'), foot = $('lessonFoot');
    foot.className = 'ls-foot' + (L.checked ? (L.ok ? ' good' : ' bad') : '');
    body.dataset.step = step ? step.kind : 'end';
    if (!step) return renderLessonEnd(body, foot);
    const opt = (v, cls) => `<button class="ls-opt${cls}" data-ls="pick" data-v="${esc(v)}"${L.checked ? ' disabled' : ''}>${esc(v)}</button>`;
    const optCls = v => !L.checked ? (L.picked === v ? ' on' : '') : v === step.right ? ' good' : v === L.picked ? ' bad' : '';
    const opts = () => `<div class="ls-opts">${step.choices.map(c => opt(c, optCls(c))).join('')}</div>`;
    let html = `<div class="ls-kind">${step.retry ? '↻ Try it again' : step.kind === 'read' ? 'Read' : step.kind === 'puzzle' ? 'Saturday' : LESSON_KIND[step.kind]}</div>`;
    if (step.kind === 'read') {
      const r = step.r, img = r.media && r.media.image;
      html += `<div class="ls-read">
        ${img ? `<img src="${esc(img.src)}" alt="${esc(img.alt)}"><div class="credit" style="margin:-6px 0 10px">Picture: <a href="${esc(img.link)}" target="_blank" rel="noopener noreferrer">${esc(img.credit)}</a></div>` : ''}
        <div class="ls-prompt">${linkRefs(r.hook, r.verse.ref)}</div><p class="reel-body">${linkRefs(r.body, r.verse.ref)}</p>
        ${r.media && r.media.video && (r.media.video.previewed === true || window.TU_NO_EMBED) ? clipHtml(r.media.video) : ''}
        <div class="ls-verse">“${esc(r.verse.text)}”<span class="ls-ref-row"><span class="ref">${linkRefs(r.verse.ref)}</span>${readLink(r.verse.ref) ? `<a href="${esc(readLink(r.verse.ref))}" target="_blank" rel="noopener noreferrer">read the chapter ↗</a>` : ''}</span></div></div>`;
    } else if (step.kind === 'reel' || step.kind === 'recall') {
      html += `<div class="ls-prompt">${step.kind === 'recall' && !L.checked ? esc(step.q) : linkRefs(step.q, step.home)}</div>${step.kind === 'recall' && !step.retry ? '<p class="ls-hint">From earlier this week. No peeking.</p>' : ''}${opts()}`;
    } else if (step.kind === 'blank') {
      const fill = L.checked ? step.right : L.picked || '';
      html += `<div class="ls-verse" style="margin:6px 0 18px">“${esc(step.before)}<span class="ls-blank">${esc(fill) || '&nbsp;'}</span>${esc(step.after)}”<span class="ref">${L.checked ? linkRefs(step.ref) : esc(step.ref)}</span></div>${opts()}`;
    } else if (step.kind === 'order') {
      html += `<div class="ls-prompt" style="font-size:18px">From ${L.checked ? linkRefs(step.ref) : esc(step.ref)}</div>
        <div class="ls-line">${L.built.map((ti, n) => `<button class="ls-word" data-ls="unt" data-n="${n}"${L.checked ? ' disabled' : ''}>${esc(step.tiles[ti].w)}</button>`).join('')}</div>
        <div class="ls-words">${step.tiles.map((t, ti) => `<button class="ls-word${L.built.includes(ti) ? ' used' : ''}" data-ls="tile" data-i="${ti}"${L.checked ? ' disabled' : ''}>${esc(t.w)}</button>`).join('')}</div>`;
    } else if (step.kind === 'match') {
      const doneL = new Set(Object.keys(L.matched)), doneR = new Set(Object.values(L.matched));
      // Each verse opens in Gospel Library, to read before matching.
      const reads = step.right.filter(b => readLink(b))
        .map(b => `<a href="${esc(readLink(b))}" target="_blank" rel="noopener noreferrer">${esc(b)} ↗</a>`).join('');
      html += `<div class="ls-prompt" style="font-size:18px">Tap an idea, then its verse.</div>
        ${reads ? `<div class="ls-reads"><span>Read them first:</span>${reads}</div>` : ''}
        <div class="ls-match"><div class="ls-opts">${step.left.map(a => `<button class="ls-opt${doneL.has(a) ? ' done' : L.sel === a ? ' on' : ''}" data-ls="L" data-v="${esc(a)}"${doneL.has(a) ? ' disabled' : ''}>${esc(a)}</button>`).join('')}</div>
          <div class="ls-opts">${step.right.map(b => `<button class="ls-opt${doneR.has(b) ? ' done' : L.missR === b ? ' miss' : ''}" data-ls="R" data-v="${esc(b)}"${doneR.has(b) ? ' disabled' : ''}>${esc(b)}</button>`).join('')}</div></div>`;
    } else if (step.kind === 'say' || step.kind === 'saywarm') {
      html += `<div class="ls-prompt">“${esc(step.text)}”</div>${opts()}`;
    } else if (step.kind === 'deep') {
      const d = step.d, web = /^https:|^lesson$/.test(d.read);
      const url = d.read === 'lesson' ? WEEK.lesson : web ? d.read : readLink(d.read);
      html += step.retry ? '' : `<div class="ls-prompt">${d.day === 'friday' ? esc(d.title) : 'Read ' + linkRefs(d.read)}</div>
        <p class="reel-body">${linkRefs(d.intro, deepPassage(d))}</p>
        ${url ? `<a class="deep-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open ${esc(web ? sourceLabel(d.read) : d.read)} ↗</a>` : ''}`;
      html += `<div class="ls-q">${linkRefs(step.q, step.home)}</div>${opts()}`;
    } else if (step.kind === 'puzzle') {
      const left = reelsLeft();
      html += `<div class="ls-prompt">The weekly puzzle</div>
        <p class="reel-body">${left ? `It opens once the week's reels are answered: ${left === 1 ? '1 is' : left + ' are'} left.`
          : `Sixteen ideas from this week. Put each one in its lesson section, for ${PUZZLE_XP} XP and a streak freeze.`}</p>`;
    }
    body.innerHTML = html;
    body.scrollTop = 0;
    // The bottom: Continue, Check, or how it went.
    let footHtml;
    if (step.kind === 'read') footHtml = `<button class="ls-go" data-ls="next">Continue</button>`;
    else if (step.kind === 'puzzle') {
      footHtml = reelsLeft() ? `<button class="ls-go" data-ls="next">Continue</button>` : `<button class="ls-go" data-ls="puzzle">Start the puzzle</button>`;
    } else if (step.kind === 'match') {
      const all = Object.keys(L.matched).length === step.pairs.length;
      footHtml = all ? `<div class="ls-say">${L.misses ? 'All matched' : 'Perfect!'}</div><button class="ls-go" data-ls="next">Continue</button>`
                     : `<button class="ls-go" disabled>Match them all</button>`;
      if (all) foot.className = 'ls-foot good';
    } else if (L.checked) {
      const answer = step.kind === 'order' ? step.words.join(' ') : step.right;
      footHtml = `<div class="ls-say">${L.ok ? ['Nice!', 'Great job!', 'You got it!'][L.at % 3] : 'Correct answer:'}${L.earned ? ` <span class="ls-earn">+${L.earned} XP</span>` : ''}</div>
        ${!L.ok ? `<div class="ls-why" style="font-weight:800;color:#fff">${esc(answer)}</div>` : ''}
        ${step.why ? `<div class="ls-why">${linkRefs(step.why, step.home)}</div>` : ''}
        ${/^say/.test(step.kind) ? `<div class="ls-why">${linkRefs(step.ref)}</div>` : ''}
        ${!L.ok ? `<div class="ls-why">It comes back at the end.</div>` : ''}
        <button class="ls-go" data-ls="next">Continue</button>`;
    } else {
      const ready = step.kind === 'order' ? L.built.length === step.tiles.length : L.picked != null;
      footHtml = `<button class="ls-go" data-ls="check"${ready ? '' : ' disabled'}>Check</button>`;
    }
    foot.innerHTML = `<div class="ls-foot-in">${footHtml}</div>`;
  }

  function renderLessonEnd(body, foot) {
    const L = lesson, e = L.entry, secs = Math.round((Date.now() - L.start) / 1000), xp = S.xp - L.xp0, streak = liveStreak();
    const next = L.practice ? null : lessonNow();
    const name = e ? entryName(e) : "Today's warm-up";
    body.innerHTML = `<div class="ls-done"><div class="big">🎉</div>
      <div class="ls-prompt">${L.practice ? 'Practice done!' : 'Lesson complete!'}</div>
      <p class="reel-body">${esc(name)}</p>
      <div class="ls-stats">
        <div class="ls-stat"><b>+${xp}</b><span>XP</span></div>
        <div class="ls-stat"><b>${L.scored ? Math.round(L.right / L.scored * 100) : 100}%</b><span>Right first time</span></div>
        <div class="ls-stat"><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>Time</span></div></div>
      ${streak ? `<p class="ls-streak">🔥 ${streak}-day streak</p>` : ''}
      ${L.level ? `<p class="ls-news">⭐ Level ${L.level}: ${esc(LEVEL_TITLES[L.level - 1])}</p>` : ''}
      ${L.rewards.map(t => `<p class="ls-news">🎁 Reward unlocked: ${esc(t)} · show a parent</p>`).join('')}
      ${L.practice ? `<p class="fam-note">Practice: this part was already answered, so nothing new was earned.</p>` : ''}
      ${!next && !L.practice ? `<p class="fam-note">That's today's reading done. Come back tomorrow for the next part.</p>` : ''}</div>`;
    foot.className = 'ls-foot';
    foot.innerHTML = `<div class="ls-foot-in">${next ? `<button class="ls-go" data-ls="nextlesson">Next: ${esc(entryName(next))}</button>
      <button class="ls-alt" data-ls="close">Done for now</button>` : `<button class="ls-go" data-ls="close">Done</button>`}</div>`;
  }

  function lessonAction(el) {
    const L = lesson, step = L && L.steps[L.at], act = el.dataset.ls;
    if (!L) return;
    if (act === 'close') return closeLesson();
    if (act === 'nextlesson') { closeLesson(); return openLesson(''); }
    if (act === 'puzzle') { closeLesson(); return startGame('puzzle'); }
    if (act === 'next') { stopClips(); L.at++; lessonReset(); return renderLesson(); }
    if (act === 'pick' && !L.checked) L.picked = el.dataset.v;
    else if (act === 'tile' && !L.checked) L.built.push(Number(el.dataset.i));
    else if (act === 'unt' && !L.checked) L.built.splice(Number(el.dataset.n), 1);
    else if (act === 'check' && !L.checked) {
      L.ok = step.kind === 'order' ? L.built.map(i => step.tiles[i].w).join(' ') === step.words.join(' ') : L.picked === step.right;
      L.checked = true;
      if (!step.retry) { L.scored++; if (L.ok) L.right++; }
      L.earned = recordStep(step, L.picked, L.ok);
      // A miss comes back at the end, with its choices in a new order.
      if (!L.ok) L.steps.push(Object.assign({}, step, { retry: true, choices: step.choices && shuffled(step.choices, 'again' + L.steps.length) }));
    } else if (act === 'L') { L.sel = el.dataset.v; L.missR = null; }
    else if (act === 'R' && L.sel) {
      const pair = step.pairs.find(p => p.a === L.sel);
      if (pair && pair.b === el.dataset.v) { L.matched[L.sel] = el.dataset.v; L.sel = null; L.missR = null; }
      else { L.misses++; L.missR = el.dataset.v; }
      if (Object.keys(L.matched).length === step.pairs.length) { L.scored++; if (!L.misses) L.right++; }
    }
    renderLesson();
  }

  /* ---------------- developer mode ---------------- */

  // …/TreasureUp-test/#dev, for Blake and the people he adds by name and
  // email, each signed in with Google. It shows each week's content as his
  // son will see it; each piece can be approved or changed, and a finished
  // week published to the live app. Changes are commits to content/weeks.js
  // through the GitHub API, using a token Blake connects once (kept in the
  // test Firebase project, readable only by the people on the list). Every
  // commit runs the content check before it deploys, and the live app
  // refuses anything not approved; what the checker finds comes back here.
  const DEV = { test: 'blakemerrell/TreasureUp-test', live: 'blakemerrell/TreasureUp', file: 'content/weeks.js', owner: 'blakemerrell@gmail.com' };
  const WEEKS_MARK = 'window.TU_WEEKS = ';
  const DEV_LABELS = {
    hook: 'Headline', body: 'Text', text: 'Text', ref: 'Reference', q: 'Question', right: 'Right answer',
    wrong: 'Wrong answers (one per line)', why: 'Why (shown after answering)', source: 'Where the answer is',
    hunt: 'Map game wording (names only the chapter)',
    find: 'Exact words that settle it', intro: 'Intro', read: 'What he reads', title: 'Title', alt: 'Picture description',
    credit: 'Credit', link: 'Picture page', src: 'Picture file', youtube: 'YouTube id', start: 'Start (seconds)',
    end: 'End (seconds)', channel: 'Channel', previewed: 'Clip watched', speaker: 'Who said it', clue: 'Clue',
    word: 'Word', section: 'Section number', dates: 'Dates', reference: 'Reading', lesson: 'Lesson link',
    sections: 'Sections (one per line)', tiles: 'Tiles', groups: 'Groups', bonus: 'Bonus', question: 'Question',
    verse: 'Verse', media: 'Picture and clip', image: 'Picture', video: 'Clip', deep: 'Go deeper', day: 'Day',
    gradient: 'Background', blobA: 'Glow 1', blobB: 'Glow 2'
  };
  let dev = null;
  const devTest = () => !FIREBASE_CONFIG && window.TU_DEV_TEST;   // the tests' stand-in for GitHub and sign-in
  const devSleep = ms => new Promise(ok => setTimeout(ok, ms));

  // The fingerprint tools/verify.mjs checks: changing a piece after it was
  // approved makes it stop matching.
  function approvalHash(v) {
    const c = canon(v);
    let h = 0x811c9dc5;
    for (let i = 0; i < c.length; i++) { h ^= c.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16).padStart(8, '0');
  }
  const noApproval = o => { const c = Object.assign({}, o); delete c.approved; return c; };
  const weekMeta = w => ({ dates: w.dates, title: w.title, reference: w.reference, lesson: w.lesson, sections: w.sections });
  const clone = v => JSON.parse(JSON.stringify(v));
  // The pieces a week is reviewed in, as tools/verify.mjs counts them.
  function devItems(w) {
    const out = [], add = (key, label, obj, approved, of) => out.push({ key, label, obj, approved, hash: approvalHash(of) });
    add('week', 'The week', weekMeta(w), w.approved, weekMeta(w));
    w.reels.forEach((r, n) => add('reel:' + r.id, 'Reel ' + (n + 1) + ' · ' + (w.sections[r.section] || ''), r, r.approved, noApproval(r)));
    (w.deep || []).forEach(d => add('deep:' + d.id, d.day === 'friday' ? 'Friday deep dive' : 'Go deeper · ' + (w.sections[d.section] || ''), d, d.approved, noApproval(d)));
    if (w.puzzle) add('puzzle', 'Weekly puzzle', w.puzzle, w.puzzle.approved, noApproval(w.puzzle));
    (w.sayings || []).forEach(x => add('say:' + x.id, 'Who said it?', x, x.approved, noApproval(x)));
    if (w.words) add('words', 'Verse Words', w.words, w.wordsApproved, w.words);
    return out.map(i => Object.assign(i, { state: !i.approved ? 'draft' : i.approved === i.hash ? 'ok' : 'changed' }));
  }
  function devGet(w, key) {
    if (key === 'week') return weekMeta(w);
    if (key === 'words') return w.words;
    if (key === 'puzzle') return w.puzzle;
    const kind = key.slice(0, key.indexOf(':')), id = key.slice(key.indexOf(':') + 1);
    return (kind === 'reel' ? w.reels : kind === 'deep' ? w.deep : w.sayings).find(x => x.id === id);
  }
  // Put one piece (edited or not) into a week, with its approval mark.
  function devSet(w, key, obj, approved) {
    obj = clone(obj);
    if (key === 'week') Object.assign(w, weekMeta(obj));
    else if (key === 'words') w.words = obj;
    else if (key === 'puzzle') w.puzzle = obj;
    else {
      const kind = key.slice(0, key.indexOf(':')), id = key.slice(key.indexOf(':') + 1);
      const list = kind === 'reel' ? w.reels : kind === 'deep' ? w.deep : w.sayings;
      const i = list.findIndex(x => x.id === id);
      if (i >= 0) list[i] = obj;
    }
    const target = key === 'week' ? w : key === 'words' ? null : devGet(w, key);
    if (key === 'words') { if (approved) w.wordsApproved = approved; else delete w.wordsApproved; }
    else if (approved) target.approved = approved;
    else delete target.approved;
  }
  const approvedOf = (w, key) => key === 'words' ? w.wordsApproved : key === 'week' ? w.approved : (devGet(w, key) || {}).approved;

  /* ----- GitHub ----- */

  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));

  async function gh(path, opts) {
    const res = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opts || {}, {
      headers: Object.assign({ Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: 'Bearer ' + dev.token },
        opts && opts.body ? { 'Content-Type': 'application/json' } : {})
    }));
    if (res.status === 404) return null;
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) {
      const why = res.status === 401 ? "GitHub didn't accept the token (it may have expired). Blake can connect a new one."
        : res.status === 403 ? "The GitHub token isn't allowed to change this. It needs Contents: Read and write on TreasureUp and TreasureUp-test."
        : (data && data.message) || 'GitHub said ' + res.status;
      throw Object.assign(new Error(why), { status: res.status });
    }
    return data;
  }
  async function readWeeksFile(repo) {
    const f = await gh(`/repos/${repo}/contents/${DEV.file}`);
    if (!f) return null;
    const text = b64decode(f.content);
    const at = text.indexOf(WEEKS_MARK);
    return { sha: f.sha, head: text.slice(0, at), text, weeks: JSON.parse(text.slice(at + WEEKS_MARK.length, text.lastIndexOf(';'))) };
  }
  async function writeWeeksFile(repo, file, weeks, message) {
    const text = file.head + WEEKS_MARK + JSON.stringify(weeks, null, 2) + ';\n';
    const r = await gh(`/repos/${repo}/contents/${DEV.file}`, { method: 'PUT', body: JSON.stringify({ message, content: b64encode(text), sha: file.sha }) });
    return r.commit.sha;
  }
  // Wait for the commit's check and deploy. True when it went through; false
  // (with what the checker found) when it didn't.
  async function devWatch(repo, sha, where) {
    const every = (window.TU_DEV_TEST && window.TU_DEV_TEST.poll) || 6000;
    dev.status = { kind: 'wait', text: `Checking it, then putting it on ${where}. This takes about a minute.` };
    renderDevBar();
    const t0 = Date.now();
    while (Date.now() - t0 < 10 * 60000) {
      await devSleep(every);
      if (!dev) return null;
      const r = await gh(`/repos/${repo}/commits/${sha}/check-runs`).catch(() => null);
      const runs = (r && r.check_runs) || [];
      if (!runs.length || runs.some(x => x.status !== 'completed')) continue;
      const bad = runs.filter(x => !['success', 'skipped', 'neutral'].includes(x.conclusion));
      if (!bad.length) {
        dev.status = { kind: 'ok', text: `✓ Checked, and on ${where} now (refresh it in a minute to see).` };
        renderDevBar();
        return true;
      }
      const found = [];
      for (const b of bad) {
        const notes = await gh(`/repos/${repo}/check-runs/${b.id}/annotations`).catch(() => null);
        (notes || []).forEach(n => { if (/Content check/.test(n.title || '')) found.push(n.message); });
      }
      dev.status = found.length
        ? { kind: 'bad', text: `The checker found a problem, so ${where} didn't change. Fix it and save again:`, items: found }
        : { kind: 'bad', text: `The deploy didn't finish, so ${where} didn't change. Try again in a few minutes.` };
      renderDevBar();
      return false;
    }
    dev.status = { kind: 'bad', text: 'Still not done after 10 minutes. Look again later.' };
    renderDevBar();
    return null;
  }

  /* ----- who can use it ----- */

  async function devAccess() {
    if (devTest()) return { ok: true, owner: true, email: 'tester@example.com', token: window.TU_DEV_TEST.token };
    if (!FIREBASE_CONFIG || !/\/TreasureUp-test\//.test(location.pathname)) return { ok: false, why: 'site' };
    await fbInit();
    const u = authUser();
    if (!u || u.isAnonymous || !u.providerData.some(x => x.providerId === 'google.com')) return { ok: false, why: 'signin' };
    const email = (u.email || '').toLowerCase(), owner = email === DEV.owner;
    if (!owner) {
      const on = await fs().collection('devs').doc(email).get().then(d => d.exists, () => false);
      if (!on) return { ok: false, why: 'list', email };
    }
    const secret = await fs().collection('devSecrets').doc('github').get().then(d => d.exists ? d.data().token : null, () => null);
    return { ok: true, owner, email, token: secret };
  }

  function openDev() {
    if (!dev) dev = { view: 'loading', weeks: null, live: null, week: null, changes: new Map(), editing: null, raw: false, status: null, busy: false, people: [] };
    $('dev').hidden = false;
    renderDev();
    devStart();
  }
  function closeDev() {
    dev = null;
    $('dev').hidden = true;
    $('devBody').innerHTML = '';
    if (location.hash === '#dev') history.replaceState(null, '', location.pathname + location.search);
  }
  async function devStart() {
    try {
      const a = await devAccess();
      if (!dev) return;
      Object.assign(dev, { access: a });
      if (!a.ok) { dev.view = a.why; return renderDev(); }
      dev.token = a.token;
      if (!a.token) { dev.view = 'token'; return renderDev(); }
      await devLoad();
    } catch (e) { if (dev) { dev.view = 'error'; dev.error = e.message; renderDev(); } }
  }
  async function devLoad() {
    dev.view = 'loading'; renderDev();
    const [t, l] = await Promise.all([readWeeksFile(DEV.test), readWeeksFile(DEV.live)]);
    if (!t) throw new Error("Couldn't find content/weeks.js on the test site.");
    Object.assign(dev, { file: t, weeks: t.weeks, draft: clone(t.weeks), live: l, view: dev.week ? 'week' : 'weeks' });
    renderDev();
  }

  /* ----- screens ----- */

  const devWeek = () => dev.draft.find(w => w.dates === dev.week);
  const savedWeek = () => dev.weeks.find(w => w.dates === dev.week);

  function renderDev() {
    if (!dev) return;
    const body = $('devBody'), put = h => { body.innerHTML = `<div class="dv-wrap">${h}</div>`; renderDevBar(); };
    $('devTitle').textContent = dev.view === 'week' && devWeek() ? devWeek().title : '';
    const a = dev.access || {};
    if (dev.view === 'loading') return put('<p class="live-sub">Loading…</p>');
    if (dev.view === 'error') return put(`<p class="parent-msg">${esc(dev.error)}</p><div class="board-actions"><button class="btn" data-dev="retry">Try again</button></div>`);
    if (dev.view === 'site') return put(`<p class="board-help">Developer mode is on the test site: <a href="https://blakemerrell.github.io/TreasureUp-test/#dev" style="color:var(--gold)">blakemerrell.github.io/TreasureUp-test/#dev</a></p>`);
    if (dev.view === 'signin') return put(`
      <p class="clue-q" style="font-size:22px">Sign in to review content</p>
      <p class="board-help">Developer mode is for Blake and the people he adds. Sign in with your Google account.</p>
      <div class="board-actions"><button class="btn" data-dev="google">Continue with Google</button></div>`);
    if (dev.view === 'list') return put(`
      <p class="clue-q" style="font-size:22px">Not on the list yet</p>
      <p class="board-help">${esc(a.email || 'This account')} isn't on the developer list. Ask Blake to add you by name and email.</p>
      <div class="board-actions"><button class="btn ghost" data-dev="signout">Use a different account</button></div>`);
    if (dev.view === 'token') return put(a.owner ? `
      <p class="clue-q" style="font-size:22px">Connect GitHub (once)</p>
      <p class="board-help">Developer mode saves changes to the app's content on GitHub. Make a token for it:</p>
      <ol class="board-help" style="padding-left:20px;margin-top:8px">
        <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">github.com/settings/personal-access-tokens/new</a></li>
        <li>Name it Treasure Up dev mode; expiration 1 year.</li>
        <li>Repository access: Only select repositories, then TreasureUp and TreasureUp-test.</li>
        <li>Permissions, Repository permissions: Contents, Read and write.</li>
        <li>Generate the token, copy it, and paste it here.</li>
      </ol>
      <label class="dv-f"><span>GitHub token</span><input id="devToken" class="field" type="password" autocomplete="off"></label>
      <div class="board-actions"><button class="btn" data-dev="savetoken">Connect</button></div>
      <p id="devNote" class="parent-msg"></p>
      <p class="fam-note">It's kept in the test site's database, where only you and the people you add can read it.</p>`
      : `<p class="board-help">Blake hasn't connected GitHub yet, so there's nothing to review here.</p>`);
    if (dev.view === 'people') return put(peopleHtml());
    if (dev.view === 'weeks') return put(weeksHtml());
    if (dev.view === 'week') return put(weekHtml());
  }

  function devTopHtml(back) {
    const a = dev.access || {};
    return `<div class="dv-top">
      ${back ? '<button class="fam-link" data-dev="weeks">‹ All weeks</button>' : ''}
      <span>${esc(a.email || '')}</span>
      ${a.owner && dev.view !== 'people' ? '<button class="fam-link" data-dev="people">People</button>' : ''}
      ${!devTest() ? '<button class="fam-link" data-dev="signout">Sign out</button>' : ''}
    </div>`;
  }

  function weeksHtml() {
    return devTopHtml(false) + `<p class="board-help" style="margin-top:12px">Every week the test site has. Open one to review it.</p>` +
      dev.draft.map(w => {
        const items = devItems(w), ok = items.filter(i => i.state === 'ok').length;
        const lw = dev.live && dev.live.weeks.find(x => x.dates === w.dates);
        const live = !lw ? 'Not on the live app yet' : canon(lw) === canon(dev.weeks.find(x => x.dates === w.dates)) ? 'On the live app' : 'On the live app (an older version)';
        return `<button class="dv-week" data-dev="open" data-week="${esc(w.dates)}">
          <b>${esc(w.title)}</b><small>${esc(w.dates)} · ${ok} of ${items.length} approved · ${live}</small></button>`;
      }).join('');
  }

  function peopleHtml() {
    return devTopHtml(true) + `
      <p class="clue-q" style="font-size:22px;margin-top:14px">People who can use developer mode</p>
      <p class="board-help">Each signs in with the Google account for this email. They can approve, change and publish content.</p>
      <div id="devPeople">${dev.people.length ? dev.people.map(p => `
        <div class="dv-item"><b>${esc(p.name)}</b> <span class="dv-small">${esc(p.id)}</span>
          <div class="dv-acts"><button class="fam-link" data-dev="rmperson" data-email="${esc(p.id)}">Remove</button></div></div>`).join('')
        : '<p class="dv-small">Just you so far.</p>'}</div>
      <label class="dv-f"><span>Name</span><input id="devPName" class="field" maxlength="40"></label>
      <label class="dv-f"><span>Email (their Google account)</span><input id="devPEmail" class="field" type="email" autocomplete="off"></label>
      <div class="board-actions"><button class="btn" data-dev="addperson">Add</button></div>
      <p id="devNote" class="parent-msg"></p>
      <div class="dv-group"><div class="eyebrow">GitHub</div>
        <p class="dv-small">Connected. <button class="fam-link" data-dev="newtoken">Connect a new token</button></p></div>`;
  }

  function weekHtml() {
    const w = devWeek();
    if (!w) { dev.view = 'weeks'; return weeksHtml(); }
    const items = devItems(w), ok = items.filter(i => i.state === 'ok').length;
    const groups = [['The week', i => i.key === 'week'], ['Reels', i => i.key.startsWith('reel:')], ['Go deeper', i => i.key.startsWith('deep:')],
                    ['Games', i => i.key === 'puzzle' || i.key === 'words' || i.key.startsWith('say:')]];
    return devTopHtml(true) + `
      <p class="board-help" style="margin-top:12px">${esc(w.dates)} · ${ok} of ${items.length} approved.
        <a href="./" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">Open the test site ↗</a></p>` +
      groups.map(([name, f]) => `<div class="dv-group"><div class="eyebrow">${name}</div>${items.filter(f).map(i => devItemHtml(w, i)).join('')}</div>`).join('');
  }

  function devItemHtml(w, it) {
    const editing = dev.editing === it.key;
    const chip = it.state === 'ok' ? '<span class="dv-chip ok">✓ Approved</span>'
      : it.state === 'changed' ? '<span class="dv-chip warn">Changed since approved</span>' : '<span class="dv-chip">Draft</span>';
    const unsaved = dev.changes.has(w.dates + '|' + it.key) ? '<span class="dv-chip pend">Not saved yet</span>' : '';
    const acts = editing ? '' : `<div class="dv-acts">
      ${it.state === 'ok' ? `<button class="fam-link" data-dev="unapprove" data-key="${esc(it.key)}">Undo approval</button>`
                          : `<button class="btn" data-dev="approve" data-key="${esc(it.key)}">Approve</button>`}
      <button class="btn ghost" data-dev="edit" data-key="${esc(it.key)}">Edit</button></div>`;
    return `<div class="dv-item" data-item="${esc(it.key)}">
      <div class="dv-head"><b>${esc(it.label)}</b>${chip}${unsaved}</div>
      ${editing ? devEditorHtml(it) : devPreviewHtml(w, it)}${acts}</div>`;
  }

  // A piece as he'll see it, compactly, with the right answer marked.
  function devQHtml(q, sourced) {
    return `<p class="dv-q">${esc(q.q)}</p>
      <ul class="dv-choices"><li class="right">✓ ${esc(q.right)}</li>${(q.wrong || []).map(x => `<li>✕ ${esc(x)}</li>`).join('')}</ul>
      <p class="dv-small">Why: ${esc(q.why)}</p>
      ${sourced ? `<p class="dv-small">Answer in ${esc(q.source)}: ${esc(q.find)}</p>` : ''}`;
  }
  function devPreviewHtml(w, it) {
    const o = it.obj;
    if (it.key === 'week') return `<div class="dv-hook">${esc(o.title)}</div><p class="dv-small">${esc(o.dates)} · ${esc(o.reference)} · <a href="${esc(o.lesson)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">lesson ↗</a></p>
      <ol class="dv-small" style="padding-left:18px">${o.sections.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
    if (it.key.startsWith('reel:')) {
      const m = o.media || {}, img = m.image, v = m.video;
      return `${img ? `<img src="${esc(img.src)}" alt="${esc(img.alt)}"><p class="dv-small">Picture: ${esc(img.credit)} · ${esc(img.alt)}</p>` : ''}
        <div class="dv-hook">${esc(o.hook)}</div><p>${esc(o.body)}</p>
        ${v ? `<p class="dv-small">Clip: <a href="https://www.youtube.com/watch?v=${esc(v.youtube)}&t=${Number(v.start) || 0}s" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">${esc(v.title)} ↗</a> · ${esc(v.channel)} · ${fmtTime(v.start)}–${fmtTime(v.end)}${v.previewed ? ' · watched' : ' · not watched yet (approving this reel marks it watched)'}</p>` : ''}
        <div class="dv-verse">“${esc(o.verse.text)}”<span>${esc(o.verse.ref)}</span></div>
        ${devQHtml(o.question)}
        ${bonusesOf(o).map((b, n) => `<div class="dv-small" style="margin-top:8px;font-weight:800">Bonus${bonusesOf(o).length > 1 ? ' ' + (n + 1) : ''}</div>${devQHtml(b, true)}`).join('')}`;
    }
    if (it.key.startsWith('deep:')) return `<div class="dv-hook">${esc(o.title || 'Read ' + o.read)}</div><p>${esc(o.intro)}</p><p class="dv-small">Reads: ${esc(o.read)}</p>${devQHtml(o, true)}`;
    if (it.key === 'puzzle') return o.groups.map(g => `<p class="dv-small" style="margin-top:6px"><b>${esc(w.sections[g.section] || '')}</b>: ${g.tiles.map(t => esc(t.text) + ' (' + esc(t.ref) + ')').join(' · ')}</p>`).join('');
    if (it.key.startsWith('say:')) return `<div class="dv-hook">“${esc(o.text)}”</div><p class="dv-small">${esc(o.ref)}</p>
      <ul class="dv-choices"><li class="right">✓ ${esc(o.speaker)}</li>${(o.wrong || []).map(x => `<li>✕ ${esc(x)}</li>`).join('')}</ul><p class="dv-small">Why: ${esc(o.why)}</p>`;
    if (it.key === 'words') return o.map(x => `<p class="dv-small"><b>${esc(x.word)}</b> · ${esc(x.clue)} (${esc(x.ref)})</p>`).join('');
    return '';
  }

  // A form built from the piece itself: every field it has, labeled.
  function devField(path, kind, val) {
    const key = path.split('.').filter(x => !/^\d+$/.test(x)).pop() || '';
    const lab = esc(DEV_LABELS[key] || key);
    if (kind === 'bool') return `<label class="dv-f dv-check"><input type="checkbox" data-path="${esc(path)}" data-kind="bool"${val ? ' checked' : ''}> ${lab}</label>`;
    const text = String(val == null ? '' : val), long = kind === 'lines' || text.length > 48;
    return `<label class="dv-f"><span>${lab}</span>${long
      ? `<textarea class="field" rows="${Math.min(9, Math.ceil(text.length / 38) + 1)}" data-path="${esc(path)}" data-kind="${kind}">${esc(text)}</textarea>`
      : `<input class="field" data-path="${esc(path)}" data-kind="${kind}" value="${esc(text)}"${kind === 'num' ? ' inputmode="numeric"' : ''}>`}</label>`;
  }
  function devFields(v, path) {
    const label = p => DEV_LABELS[p] || p;
    if (Array.isArray(v) && v.every(x => typeof x === 'string')) return devField(path, 'lines', v.join('\n'));
    if (Array.isArray(v)) return v.map((x, i) => `<fieldset class="dv-set"><legend>${esc(label(path.split('.').pop() || 'Item'))} ${i + 1}</legend>${devFields(x, (path ? path + '.' : '') + i)}</fieldset>`).join('');
    if (v && typeof v === 'object') return Object.keys(v).filter(k => k !== 'approved' && k !== 'id' && v[k] !== undefined).map(k => {
      const p = path ? path + '.' + k : k, x = v[k];
      return x && typeof x === 'object' && !(Array.isArray(x) && x.every(y => typeof y === 'string'))
        ? `<fieldset class="dv-set"><legend>${esc(label(k))}</legend>${devFields(x, p)}</fieldset>` : devFields(x, p);
    }).join('');
    return devField(path, typeof v === 'boolean' ? 'bool' : typeof v === 'number' ? 'num' : 'text', v);
  }
  function devEditorHtml(it) {
    const obj = it.key === 'words' ? it.obj : noApproval(it.obj);
    const form = it.key === 'week' ? Object.assign({}, obj, { dates: undefined }) : obj;   // dates stay as they are
    return `<div class="dv-editor">
      ${dev.raw ? `<textarea class="field dv-json" id="devJson">${esc(JSON.stringify(obj, null, 2))}</textarea>` : devFields(form, '')}
      <div class="dv-acts"><button class="btn" data-dev="done" data-key="${esc(it.key)}">Done</button>
        <button class="btn ghost" data-dev="cancel">Cancel</button>
        <button class="fam-link" data-dev="raw">${dev.raw ? 'Edit as a form' : 'Edit as JSON'}</button></div>
      <p id="devNote" class="parent-msg"></p></div>`;
  }
  function devReadForm(box, original) {
    const out = clone(original);
    box.querySelectorAll('[data-path]').forEach(el => {
      const parts = el.dataset.path.split('.').filter(Boolean);
      const kind = el.dataset.kind;
      const val = kind === 'bool' ? el.checked : kind === 'num' ? Number(el.value)
        : kind === 'lines' ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : el.value;
      let at = out;
      parts.slice(0, -1).forEach(k => { at = at[k]; });
      if (parts.length) at[parts[parts.length - 1]] = val;
    });
    return out;
  }

  function renderDevBar() {
    let bar = $('devBar');
    if (!bar) { bar = document.createElement('div'); bar.id = 'devBar'; bar.className = 'dv-bar'; $('dev').appendChild(bar); }
    if (!dev || !['week', 'weeks'].includes(dev.view)) { bar.innerHTML = ''; return; }
    const n = dev.changes.size, s = dev.status;
    let publish = '';
    if (dev.view === 'week' && !n && savedWeek()) {
      const w = savedWeek(), items = devItems(w), ok = items.filter(i => i.state === 'ok').length;
      const lw = dev.live && dev.live.weeks.find(x => x.dates === w.dates);
      publish = ok < items.length ? `<p class="dv-small">Approve every piece to publish this week (${ok} of ${items.length} approved).</p>`
        : lw && canon(lw) === canon(w) ? '<p class="dv-small">✓ This week is on the live app, exactly as it is here.</p>'
        : `<button class="btn" data-dev="publish"${dev.busy ? ' disabled' : ''}>Publish this week to the live app</button>`;
    }
    const status = s ? `<div class="dv-status ${s.kind}">${esc(s.text)}${(s.items || []).length ? '<ul>' + s.items.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}</div>` : '';
    const save = n ? `<button class="btn" data-dev="save"${dev.busy ? ' disabled' : ''}>Save ${n} change${n === 1 ? '' : 's'} and check</button>` : '';
    bar.innerHTML = status || save || publish ? `<div class="dv-bar-in">${status}${save}${publish}</div>` : '';
  }

  /* ----- actions ----- */

  function devChange(key, obj, approved, what) {
    const w = devWeek();
    devSet(w, key, obj, approved);
    dev.changes.set(w.dates + '|' + key, { dates: savedWeek() ? savedWeek().dates : w.dates, key, obj: clone(devGet(w, key)), approved: approvedOf(w, key), what });
    dev.status = null;
  }
  function devApprove(key) {
    const w = devWeek();
    const obj = clone(devGet(w, key));
    // Approving a reel with a clip means the clip was watched.
    if (key.startsWith('reel:') && obj.media && obj.media.video) obj.media.video.previewed = true;
    devSet(w, key, obj, null);
    const it = devItems(w).find(i => i.key === key);
    devChange(key, obj, it.hash, 'approve');
  }

  async function devSave() {
    dev.busy = true; dev.status = { kind: 'wait', text: 'Saving…' }; renderDevBar();
    const changes = [...dev.changes.values()];
    const approvals = changes.filter(c => c.what === 'approve').length, edits = changes.length - approvals;
    const week = devWeek();
    const message = `Developer mode: ${[edits && edits + ' change' + (edits > 1 ? 's' : ''), approvals && approvals + ' approval' + (approvals > 1 ? 's' : '')].filter(Boolean).join(', ')} in ${week ? week.title : 'content'} (${(dev.access || {}).email})`;
    let sha = null;
    for (let attempt = 0; attempt < 3 && !sha; attempt++) {
      // Always onto the latest file, so nobody's changes are lost.
      const fresh = await readWeeksFile(DEV.test);
      changes.forEach(c => { const w = fresh.weeks.find(x => x.dates === c.dates); if (w) devSet(w, c.key, c.obj, c.approved); });
      try {
        sha = await writeWeeksFile(DEV.test, fresh, fresh.weeks, message);
        Object.assign(dev, { file: Object.assign(fresh, { sha: null }), weeks: fresh.weeks, draft: clone(fresh.weeks) });
      } catch (e) { if (!(e.status === 409 || e.status === 422) || attempt === 2) throw e; }
    }
    const moved = changes.find(c => c.key === 'week');
    if (moved) dev.week = moved.obj.dates;
    dev.changes.clear();
    renderDev();
    await devWatch(DEV.test, sha, 'the test site');
    dev.busy = false;
    if (dev) { const t = await readWeeksFile(DEV.test).catch(() => null); if (t) Object.assign(dev, { file: t }); renderDevBar(); }
  }

  async function devPublish() {
    const w = clone(savedWeek());
    dev.busy = true; dev.status = { kind: 'wait', text: 'Publishing…' }; renderDevBar();
    // Pictures the live app doesn't have yet go first.
    for (const src of w.reels.map(r => r.media && r.media.image && r.media.image.src).filter(Boolean)) {
      if (await gh(`/repos/${DEV.live}/contents/${src}`)) continue;
      const f = await gh(`/repos/${DEV.test}/contents/${src}`);
      if (!f) throw new Error(src + " isn't on the test site either.");
      await gh(`/repos/${DEV.live}/contents/${src}`, { method: 'PUT', body: JSON.stringify({ message: `Add ${src} for ${w.title} (developer mode)`, content: f.content.replace(/\s/g, '') }) });
    }
    const live = await readWeeksFile(DEV.live);
    if (!live) throw new Error("The live app doesn't have content/weeks.js yet.");
    const i = live.weeks.findIndex(x => x.dates === w.dates);
    if (i >= 0) live.weeks[i] = w; else live.weeks.push(w);
    live.weeks.sort((a, b) => (weekStart(a.dates) || '').localeCompare(weekStart(b.dates) || ''));
    const sha = await writeWeeksFile(DEV.live, live, live.weeks, `Publish ${w.title} (${w.dates}) from developer mode (${(dev.access || {}).email})`);
    const ok = await devWatch(DEV.live, sha, 'the live app');
    if (ok === false && dev) {
      // Put the live file back, so the live code and the live app agree.
      const now = await gh(`/repos/${DEV.live}/contents/${DEV.file}`);
      await gh(`/repos/${DEV.live}/contents/${DEV.file}`, { method: 'PUT', body: JSON.stringify({ message: `Undo publishing ${w.title}: the content check refused it`, content: b64encode(live.text), sha: now.sha }) });
    }
    dev.busy = false;
    if (dev) { dev.live = await readWeeksFile(DEV.live).catch(() => dev.live); renderDevBar(); renderDev(); }
  }

  async function devPeople() {
    dev.people = devTest() ? (window.TU_DEV_TEST.people || []) : (await fs().collection('devs').get()).docs.map(d => Object.assign({ id: d.id }, d.data()));
  }

  async function devAction(el) {
    const act = el.dataset.dev, say = m => { const n = $('devNote'); if (n) n.textContent = m; };
    try {
      if (act === 'retry') { dev.view = 'loading'; renderDev(); return devStart(); }
      if (act === 'google') { await googleSignIn(); return devStart(); }
      if (act === 'signout') { await firebase.auth().signOut(); dev.view = 'signin'; return renderDev(); }
      if (act === 'savetoken' || act === 'newtoken') {
        if (act === 'newtoken') { dev.view = 'token'; return renderDev(); }
        const token = $('devToken').value.trim();
        if (token.length < 20) return say("That doesn't look like a GitHub token.");
        dev.token = token;
        if (!(await gh(`/repos/${DEV.test}`)) || !(await gh(`/repos/${DEV.live}`))) return say("The token can't see both repositories. Pick TreasureUp and TreasureUp-test when you make it.");
        if (!devTest()) await fs().collection('devSecrets').doc('github').set({ token, updated: TS() });
        return devLoad();
      }
      if (act === 'people') { await devPeople(); dev.view = 'people'; return renderDev(); }
      if (act === 'addperson') {
        const name = $('devPName').value.trim(), email = $('devPEmail').value.trim().toLowerCase();
        if (!name) return say('Type their name.');
        if (!/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(email)) return say('Type the email of their Google account.');
        if (!devTest()) await fs().collection('devs').doc(email).set({ name, added: TS() });
        else window.TU_DEV_TEST.people = (window.TU_DEV_TEST.people || []).concat({ id: email, name });
        await devPeople(); return renderDev();
      }
      if (act === 'rmperson') {
        if (!devTest()) await fs().collection('devs').doc(el.dataset.email).delete();
        else window.TU_DEV_TEST.people = window.TU_DEV_TEST.people.filter(p => p.id !== el.dataset.email);
        await devPeople(); return renderDev();
      }
      if (act === 'weeks') { dev.view = 'weeks'; dev.editing = null; return renderDev(); }
      if (act === 'open') { dev.week = el.dataset.week; dev.view = 'week'; dev.status = null; return renderDev(); }
      if (act === 'approve') { devApprove(el.dataset.key); return renderDev(); }
      if (act === 'unapprove') { const w = devWeek(); devChange(el.dataset.key, devGet(w, el.dataset.key), null, 'unapprove'); return renderDev(); }
      if (act === 'edit') { dev.editing = el.dataset.key; dev.raw = false; return renderDev(); }
      if (act === 'cancel') { dev.editing = null; return renderDev(); }
      if (act === 'raw') { dev.raw = !dev.raw; return renderDev(); }
      if (act === 'done') {
        const key = el.dataset.key, w = devWeek(), before = devGet(w, key);
        let obj;
        if (dev.raw) { try { obj = JSON.parse($('devJson').value); } catch (e) { return say("That isn't valid JSON: " + e.message); } }
        else obj = devReadForm(el.closest('.dv-editor'), key === 'words' ? before : noApproval(before));
        if (key.startsWith('reel:') || key.startsWith('deep:') || key.startsWith('say:')) obj.id = before.id;   // ids stay put: answers are saved by id
        if (key === 'week') obj.dates = before.dates;                                                        // and the dates are the week itself
        dev.editing = null;
        if (canon(obj) !== canon(key === 'words' ? before : noApproval(before))) devChange(key, obj, approvedOf(w, key), 'edit');
        return renderDev();
      }
      if (act === 'save') return await devSave();
      if (act === 'publish') return await devPublish();
    } catch (e) {
      if (!dev) return;
      dev.busy = false;
      dev.status = { kind: 'bad', text: e.message };
      if ($('devNote')) say(e.message);
      renderDevBar();
    }
  }

  /* ---------------- wiring ---------------- */

  function wire() {
    // The page: today's lesson, a day on the map, a reel to look back at.
    $('home').addEventListener('click', e => {
      const ls = e.target.closest('[data-lesson]');
      if (ls) { openLesson(ls.dataset.lesson); return; }
      const v = e.target.closest('[data-view]');
      if (v) { openView(v.dataset.view); return; }
      if (e.target.closest('[data-games]')) { openGames(); return; }
      if (e.target.closest('[data-parent]')) { openParent(); return; }
    });

    // One reel, looked back at: its bonus questions, a note, its clip.
    $('viewBack').addEventListener('click', closeView);
    $('view').addEventListener('click', e => {
      const ns = e.target.closest('[data-note-save]');
      if (ns) { saveNote(ns.dataset.noteSave); return; }
      const ne = e.target.closest('[data-note-edit]');
      if (ne) { editNote(ne.dataset.noteEdit); return; }
      const nc = e.target.closest('[data-note-copy]');
      if (nc) { copyNote(nc.dataset.noteCopy); return; }     // the link still opens
      const clip = e.target.closest('button.clip');
      if (clip) { playClip(clip); return; }
      const btn = e.target.closest('.choice');
      if (!btn || btn.disabled) return;
      const quiz = btn.closest('.quiz');
      if (!quiz || quiz.classList.contains('done')) return;
      answer(quiz, btn.dataset.choice);
    });

    $('levelup').addEventListener('click', closeLevelUp);

    // Games menu and the solo game screen.
    $('gamesBtn').addEventListener('click', openGames);
    $('gamesClose').addEventListener('click', closeGames);
    $('games').addEventListener('click', e => {
      if (e.target === $('games')) { closeGames(); return; }      // tap outside the card
      const g = e.target.closest('[data-game]');
      if (g) startGame(g.dataset.game);
    });
    $('playExit').addEventListener('click', closePlay);
    $('play').addEventListener('click', e => {
      const el = e.target.closest('[data-pt],[data-pz],[data-say],[data-say-pick],[data-vk],[data-climb],[data-climb-pick],[data-life]');
      if (!el || el.disabled) return;
      if (playing === 'puzzle') puzzleAction(el);
      else if (playing === 'sayings') sayingsAction(el);
      else if (playing === 'word') wordKey(el.dataset.vk);
      else if (playing === 'climb') climbAction(el);
    });

    // Live game.
    $('liveExit').addEventListener('click', closeLive);
    $('live').addEventListener('click', e => {
      const el = e.target.closest('[data-live],[data-host],[data-lpick]');
      if (!el || el.disabled) return;
      if (el.dataset.lpick != null) playerAnswer(el.dataset.lpick);
      else if (el.dataset.host) hostAction(el.dataset.host);
      else if (el.dataset.live === 'host') hostLive();
      else if (el.dataset.live === 'join') joinForm('');
      else if (el.dataset.live === 'joinnow') joinLive();
    });
    $('live').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.closest('#liveCode, #liveName')) joinLive();
    });

    // A day's lesson.
    $('lessonExit').addEventListener('click', closeLesson);
    $('lesson').addEventListener('click', e => {
      const clip = e.target.closest('button.clip');
      if (clip) { playClip(clip); return; }
      const el = e.target.closest('[data-ls]');
      if (el && !el.disabled) lessonAction(el);
    });

    // Babylon Falls: the map screen's buttons, a phone's buttons, and its map.
    $('riskExit').addEventListener('click', riskExit);
    $('risk').addEventListener('click', e => {
      const land = e.target.closest('[data-land]');
      if (land && rk && rk.role !== 'host') { riskTap(land.dataset.land); return; }
      const h = e.target.closest('[data-rkh]');
      if (h && !h.disabled) { riskHostAction(h.dataset.rkh, h); return; }
      const el = e.target.closest('[data-rk]');
      if (!el || el.disabled) return;
      const act = el.dataset.rk;
      if (act === 'host') riskHost();
      else if (act === 'join') riskJoinForm('');
      else if (act === 'joinnow') riskJoin();
      else if (act === 'solo') riskSoloSetup();
      else if (act === 'solostart') riskSoloStart();
      else if (act === 'solocontinue') riskSoloContinue();
      else if (/^solo/.test(act) && rk && rk.role === 'solo') riskSoloAction(act);
      else if (rk && (rk.role === 'player' || rk.role === 'solo')) riskPlayerAction(act, el);
    });
    $('risk').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('#riskCode, #riskName')) riskJoin(); });

    // Developer mode.
    $('devExit').addEventListener('click', closeDev);
    $('dev').addEventListener('click', e => {
      const el = e.target.closest('[data-dev]');
      if (el && !el.disabled && dev) devAction(el);
    });

    // Family: people, join links and the chat.
    $('famBtn').addEventListener('click', () => openFam('people'));
    $('chatBtn').addEventListener('click', () => openFam('chat'));
    $('famExit').addEventListener('click', closeFam);
    $('fam').addEventListener('click', e => {
      const el = e.target.closest('[data-fam]');
      if (el && !el.disabled) famAction(el);
    });
    $('fam').addEventListener('change', e => {
      if (e.target.name === 'famKind') $('famEmailRow').hidden = e.target.value === 'kid';
    });
    $('fam').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatText') { e.preventDefault(); sendMsg(); }
    });

    // Family board and parent screen.
    $('board').addEventListener('click', boardClick);
    $('boardExit').addEventListener('click', closeBoard);
    $('parentClose').addEventListener('click', closeParent);
    $('parent').addEventListener('click', e => {
      if (e.target === $('parent')) { closeParent(); return; }   // tap outside the card
      const b = e.target.closest('[data-act]');
      if (b) parentAction(b.dataset.act);
    });

    // Escape closes whatever is open over the page.
    document.addEventListener('keydown', e => {
      if (playing === 'word' && !$('play').hidden && !e.metaKey && !e.ctrlKey) {
        if (e.key === 'Enter') { e.preventDefault(); wordKey('enter'); return; }
        if (e.key === 'Backspace') { e.preventDefault(); wordKey('back'); return; }
        if (/^[a-z]$/i.test(e.key)) { wordKey(e.key.toUpperCase()); return; }
      }
      if (e.key === 'Escape') { closeParent(); closeBoard(); closeGames(); closeFam(); closeView(); if (!$('lesson').hidden) closeLesson(); if (!$('play').hidden) closePlay(); if (!$('live').hidden) closeLive(); }
    });

    // Coming back after midnight brings the new day's warm-up without a reload.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (S.daily && S.daily.day !== dayKey()) {
        rollDay(); save(); refreshHome(); renderHud();
      }
    });
  }

  /* ---------------- boot ---------------- */

  function boot(week) {
    if (booted) return;
    booted = true;
    WEEK = week;
    S = load();
    P = loadParent();
    F = loadFam();
    // A family saved by the other site (live vs test) belongs to its Firebase project.
    if (F && FIREBASE_CONFIG && F.project && F.project !== FIREBASE_CONFIG.projectId) F = null;
    // Progress saved before it had an owner: a device already in a family
    // was saving it as that person's, and the family's copy matched it.
    if (S.owner === undefined) {
      S.owner = F ? F.pid : null;
      S.ownerName = F ? F.name : null;
      if (F && !stored(syncKey(F.pid))) store(syncKey(F.pid), canon(S));
    }

    // A new week: keep a one-line summary of the last one for the year trail.
    const weekNum = Number((/\/(\d+)\?/.exec(WEEK.lesson) || [])[1]) || null;
    if (S.weekTitle && S.weekTitle !== WEEK.title) {
      const vals = Object.values(S.answers);
      if (vals.length) S.history.push({ title: S.weekTitle, num: S.weekNum, right: vals.filter(a => a.right).length, answered: vals.length });
    }
    S.weekTitle = WEEK.title;
    S.weekNum = weekNum;

    // Drop saved answers for reels that aren't in this week, so an old
    // week never counts toward this one.
    const live = new Set(WEEK.reels.map(r => r.id));
    Object.keys(S.answers).forEach(id => { if (!live.has(id)) delete S.answers[id]; });
    Object.keys(S.bonus).forEach(k => { if (!live.has(k.split('#')[0])) delete S.bonus[k]; });
    Object.keys(S.recall).forEach(id => { if (!live.has(id)) delete S.recall[id]; });
    const sayIds = new Set((WEEK.sayings || []).map(x => x.id));
    Object.keys(S.sayings || {}).forEach(id => { if (!sayIds.has(id)) delete S.sayings[id]; });
    const deepIds = new Set((WEEK.deep || []).map(d => d.id));
    Object.keys(S.deep || {}).forEach(id => { if (!deepIds.has(id)) delete S.deep[id]; });

    rollDay();
    renderHome();
    renderHud();
    wire();
    save();

    // …/TreasureUp/#family opens straight to Scripture Showdown: bookmark it on the TV laptop.
    if (location.hash === '#family') openBoard();
    // …/#host on the TV, …/#join (or #join-1234 with the code) on a phone.
    else if (location.hash === '#host') hostLive();
    else if (/^#join(-\d{4})?$/.test(location.hash)) joinForm(location.hash.slice(6));
    // …/TreasureUp-test/#dev: developer mode.
    else if (location.hash === '#dev') openDev();
    // …/#lesson opens today's lesson.
    else if (location.hash === '#lesson') openLesson('');
    // …/#babylon puts up the map game's map; …/#babylon-join-1234 joins it.
    else if (location.hash === '#babylon' && BOARD()) riskHost();
    else if (/^#babylon-join(-\d{4})?$/.test(location.hash) && BOARD()) riskJoinForm(location.hash.slice(14));
    else if (location.hash === '#babylon-here' && BOARD()) riskSoloSetup();

    familyBoot();
  }

  // The app holds several weeks and opens on the one whose dates include
  // today, so next week can be added ahead of time and turns on by itself.
  // "September 21–27, 2026" or "September 28–October 4, 2026" -> "2026-09-21".
  // (A week that crosses into a new year will need its own format here.)
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                  'August', 'September', 'October', 'November', 'December'];
  function weekStart(dates) {
    const m = /^([A-Z][a-z]+) (\d{1,2})–(?:[A-Z][a-z]+ )?\d{1,2}, (\d{4})$/.exec(dates || '');
    if (!m || MONTHS.indexOf(m[1]) < 0) return null;
    return m[3] + '-' + String(MONTHS.indexOf(m[1]) + 1).padStart(2, '0') + '-' + m[2].padStart(2, '0');
  }
  function pickWeek(weeks) {
    const today = dayKey();
    const sorted = weeks.slice().sort((a, b) => (weekStart(a.dates) < weekStart(b.dates) ? -1 : 1));
    const started = sorted.filter(w => weekStart(w.dates) <= today);
    return started.length ? started[started.length - 1] : sorted[0];
  }

  return { boot: boot, pickWeek: pickWeek, weekStart: weekStart, approvalHash: approvalHash };
})();
</script>

     CONTENT lives in content/weeks.js, one entry per week, in date order
     (content/README.md says what each field means). Edit it by hand or
     from developer mode on the test site (…/TreasureUp-test/#dev). The
     app opens on the week whose dates include today.
     ================================================================== -->
<script src="content/weeks.js"></script>
<script src="content/boards.js"></script>
<script>
const WEEKS = window.TU_WEEKS || [];
const WEEK_CONTENT = TreasureUp.pickWeek(WEEKS);
TreasureUp.boot(WEEK_CONTENT);
</script>
