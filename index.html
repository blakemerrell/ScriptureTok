            : `<div class="board-actions"><button class="btn" data-act="reveal">Show answer</button>
                 <button class="btn ghost" data-act="back">Back to the board</button></div>`}
        </div>`;
      return;
    }

    if (Object.keys(g.done).length >= all.length) {
      const total = g.players.reduce((n, p) => n + p.score, 0);
      const ranked = g.players.slice().sort((a, b) => b.score - a.score);
      body.innerHTML = `
        <div class="clue">
          <div class="eyebrow">Game over</div>
          <p class="clue-q">Family total: ${total}</p>
          <p class="board-help">${g.newBest ? 'New family best!' : 'Family best: ' + G.best}</p>
          <div class="grid gap-2" style="margin-top:16px">${ranked.map(p => `<div class="score-row"><span>${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>
          <div class="board-actions">
            <button class="btn" data-act="again">Play again</button>
            <button class="btn ghost" data-act="players">Change players</button>
            <button class="btn ghost" data-act="exit">Done</button>
          </div>
        </div>`;
      return;
    }

    const rows = Math.max(...cols.map(c => c.clues.length));
    let grid = cols.map(c => `<div class="board-cat">${esc(c.name)}</div>`).join('');
    for (let k = 0; k < rows; k++) {
      grid += cols.map(c => {
        const t = c.clues[k];
        if (!t) return '<div class="tile empty"></div>';
        const d = g.done[t.id];
        return d
          ? `<button class="tile" disabled>${d.by == null ? '—' : esc(g.players[d.by].name)}</button>`
          : `<button class="tile" data-tile="${esc(t.id)}" aria-label="${esc(c.name)} for ${t.value}">${t.value}</button>`;
      }).join('');
    }
    body.innerHTML = `
      <div class="board-grid" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${grid}</div>
      <div class="board-actions"><button class="btn ghost" data-act="players">Change players</button></div>`;
  }

  function boardClick(e) {
    const el = e.target.closest('[data-tile],[data-act],[data-award]');
    if (!el) return;
    const g = game();

    if (el.dataset.tile) {
      boardView = { tile: el.dataset.tile, revealed: false };
    } else if (el.dataset.award != null) {
      const { all, dd } = boardTiles();
      const t = all.find(c => c.id === boardView.tile);
      const by = Number(el.dataset.award);
      if (by >= 0) g.players[by].score += worthOf(t, dd);
      g.done[t.id] = { by: by >= 0 ? by : null };
      boardView = null;
      if (Object.keys(g.done).length >= all.length) {
        const total = g.players.reduce((n, p) => n + p.score, 0);
        g.newBest = total > (G.best || 0);
        if (g.newBest) G.best = total;
      }
      saveBoard();
    } else {
      const act = el.dataset.act;
      if (act === 'start') {
        const names = [0, 1, 2, 3, 4, 5].map(n => $('pl' + n).value.trim()).filter(Boolean);
        if (!names.length) {
          const m = $('boardMsg'); m.textContent = 'Type at least one name.'; m.hidden = false;
          return;
        }
        G.names = names;
        G.games[WEEK.title] = { players: names.map(name => ({ name, score: 0 })), done: {} };
        saveBoard();
      } else if (act === 'reveal') {
        boardView.revealed = true;
      } else if (act === 'back') {
        boardView = null;
      } else if (act === 'again') {
        g.players.forEach(p => { p.score = 0; });
        g.done = {}; delete g.newBest;
        saveBoard();
      } else if (act === 'players') {
        delete G.games[WEEK.title];
        saveBoard();
      } else if (act === 'exit') {
        closeBoard();
        return;
      }
    }
    renderBoard();
    $('board').scrollTop = 0;
  }

  /* ---------------- notes ---------------- */

  // After a reel's question he can write a note in his own words. Saving
  // one pays XP once per reel. "Put it in my scriptures" copies it and
  // opens the verse in Gospel Library to paste as a note there: no outside
  // app can read Gospel Library notes, so the XP has to come from here.
  // Notes are kept across weeks, so they add up to a journal on his phone;
  // a parent can read them in the parent screen.
  const NOTE_XP = 10, NOTE_MIN_WORDS = 12;
  const noteEditing = new Set();
  const wordsIn = t => t.trim().match(/\S+/g) || [];

  function noteHtml(r) {
    const n = S.notes[r.id];
    const link = readLink(r.verse.ref);
    if (n && !noteEditing.has(r.id)) {
      return `
        <div class="note-box">
          <div class="eyebrow">Your note · ${linkRefs(r.verse.ref)}</div>
          <p class="note-text">${esc(n.text)}</p>
          <div class="note-actions">
            ${link ? `<a class="note-btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer" data-note-copy="${esc(r.id)}">Put it in my scriptures ↗</a>` : ''}
            <button class="note-btn ghost" data-note-edit="${esc(r.id)}">Edit</button>
          </div>
          <p class="note-help">Copies your note and opens ${linkRefs(r.verse.ref)} in Gospel Library. Select the verse, add a note, and paste.</p>
        </div>`;
    }
    return `
      <div class="note-box">
        <div class="eyebrow" style="color:var(--gold)">Write a note · +${NOTE_XP} XP</div>
        <label class="note-q" for="note-${esc(r.id)}">${linkRefs(r.note || 'What does this mean for you? Write it in your own words.', r.verse.ref)}</label>
        <textarea id="note-${esc(r.id)}" class="field note-input" rows="3" maxlength="600" placeholder="At least ${NOTE_MIN_WORDS} words">${esc(n ? n.text : '')}</textarea>
        <p class="note-msg" data-note-msg="${esc(r.id)}"></p>
        <div class="note-actions"><button class="note-btn" data-note-save="${esc(r.id)}">Save note</button></div>
        <p class="note-help">Your parents can read your notes.</p>
      </div>`;
  }

  function saveNote(id) {
    const r = reelById(id);
    const text = $('note-' + id).value.trim();
    const words = wordsIn(text);
    const msg = document.querySelector('[data-note-msg="' + id + '"]');
    if (words.length < NOTE_MIN_WORDS) { msg.textContent = 'Write at least ' + NOTE_MIN_WORDS + ' words (' + words.length + ' so far).'; return; }
    if (new Set(words.map(w => w.toLowerCase())).size < 6) { msg.textContent = 'Use your own words: say what it means to you.'; return; }
    const old = S.notes[id] || {};
    S.notes[id] = { text, day: old.day || dayKey(), at: Date.now(), hook: r.hook, ref: r.verse.ref, rewarded: !!old.rewarded };
    noteEditing.delete(id);
    markStudied();
    if (!S.notes[id].rewarded) { S.notes[id].rewarded = true; grantXp(NOTE_XP, 'Wrote a note'); }
    save();
    redrawCard(id, reelHtml(r, 0));
  }

  function editNote(id) {
    noteEditing.add(id);
    redrawCard(id, reelHtml(reelById(id), 0));
    const box = $('note-' + id);
    if (box) box.focus();
  }

  // Copy inside the tap itself (browsers only allow it there); the link
  // then opens Gospel Library as normal.
  function copyNote(id) {
    const n = S.notes[id];
    try {
      navigator.clipboard.writeText(n.text).then(
        () => toast('Note copied', 'Paste it into your note in Gospel Library'),
        () => toast("Couldn't copy", 'Hold on your note to copy it'));
    } catch (e) { toast("Couldn't copy", 'Hold on your note to copy it'); }
  }

  /* ---------------- games ---------------- */

  // The 🎮 button opens the games menu: the weekly puzzle and Who said it?
  // (solo) and the family board (together, on the TV).
  const PUZZLE_XP = 40, SAY_XP = 5, PUZZLE_MISTAKES = 4;

  const reelsLeft = () => WEEK.reels.filter(r => !S.answers[r.id]).length;

  function shuffled(list, seed) {
    const out = list.slice();
    let h = hash(seed);
    for (let i = out.length - 1; i > 0; i--) {
      h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
      const j = h % (i + 1);
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // This week's puzzle progress. A lost try resets the next day.
  function puzzleState() {
    const today = dayKey();
    let pz = S.puzzle;
    if (!pz || pz.week !== WEEK.title) {
      pz = S.puzzle = { week: WEEK.title, day: today, solved: [], mistakes: 0, status: 'playing', rewarded: false };
    }
    if (pz.status === 'lost' && pz.day !== today) {
      Object.assign(pz, { day: today, solved: [], mistakes: 0, guesses: [], status: 'playing' });
    }
    return pz;
  }

  function puzzleStatus() {
    if (reelsLeft()) return 'Answer all ' + WEEK.reels.length + ' reels to unlock · ' + reelsLeft() + ' left';
    const pz = puzzleState();
    if (pz.status === 'won') return 'Solved ✓';
    if (pz.status === 'lost') return 'Out of tries today · new try tomorrow';
    return pz.rewarded ? 'Ready' : 'Ready · ' + PUZZLE_XP + ' XP and a streak freeze';
  }

  const gameRow = (id, icon, title, desc, status, locked) => `
    <button class="game-row${locked ? ' locked' : ''}" data-game="${id}">
      <span class="gi">${icon}</span>
      <span><span class="gt block">${esc(title)}</span><span class="gd block">${esc(desc)}</span><span class="gs block">${esc(status)}</span></span>
    </button>`;

  function renderGames() {
    const rows = [];
    if (WEEK.puzzle) {
      rows.push(gameRow('puzzle', '🧩', 'Weekly puzzle', "Sort 16 ideas into this week's 4 lesson sections.", puzzleStatus(), reelsLeft() > 0));
    }
    if (WEEK.sayings && WEEK.sayings.length) {
      const got = WEEK.sayings.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
      rows.push(gameRow('sayings', '🗣️', 'Who said it?', 'Match ' + WEEK.sayings.length + ' lines from this week to who said them.', got + ' of ' + WEEK.sayings.length + ' right · ' + SAY_XP + ' XP each', false));
    }
    if (WEEK.words && WEEK.words.length) {
      rows.push(gameRow('word', '🔤', 'Verse Word', "Today's word is hiding in a verse. Six tries.", wordStatus(), false));
    }
    rows.push(gameRow('climb', '🪜', 'Scripture Climb', 'Ten questions, each worth more. Three lifelines.', climbStatus(), false));
    rows.push(gameRow('live', '📡', 'Live game', 'The TV shows the questions; everyone answers on their own phone or tablet.', 'Host or join with a code', false));
    rows.push(gameRow('board', '📺', 'Scripture Showdown', 'A quiz-show game for the whole family, best on the TV.', 'Play together', false));
    if (BOARD()) rows.push(gameRow('babylon', '🏰', BOARD().title, 'A Risk-style map game for 2 to 5: the map on a computer or TV and everyone on their own phone, or one screen passed around.', 'Put up the map, join with a code, or play on one screen', false));
    $('gamesBody').innerHTML = rows.join('');
  }

  function openGames() { renderGames(); $('games').hidden = false; }
  function closeGames() { $('games').hidden = true; }

  function startGame(id) {
    closeGames();
    if (id === 'board') openBoard();
    else if (id === 'puzzle') openPuzzle();
    else if (id === 'sayings') openSayings();
    else if (id === 'word') openWord();
    else if (id === 'climb') openClimb();
    else if (id === 'live') liveStart();
    else if (id === 'babylon') riskChooser();
  }

  let playing = null;   // 'puzzle' | 'sayings'
  function openPlay(kind, eyebrow) {
    playing = kind;
    $('playEyebrow').textContent = eyebrow;
    $('playTitle').textContent = WEEK.title;
    $('play').hidden = false;
  }
  function closePlay() {
    $('play').hidden = true;
    playing = null;
    refreshHome();
    renderHud();
  }

  /* ----- weekly puzzle: four groups of four, one per lesson section ----- */

  let pzSel = [], pzOrder = null, pzMsg = '';

  function openPuzzle() {
    pzSel = []; pzOrder = null; pzMsg = '';
    openPlay('puzzle', 'Weekly puzzle');
    renderPuzzle();
  }

  function renderPuzzle() {
    const body = $('playBody');
    if (reelsLeft()) {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">Locked for now</p>
          <p class="board-help">Answer all ${WEEK.reels.length} reels this week to unlock the puzzle. ${reelsLeft()} left.</p>
          <div class="board-actions"><button class="btn" data-pz="exit">Back</button></div>
        </div>`;
      return;
    }
    const pz = puzzleState();
    const groups = WEEK.puzzle.groups;
    const done = pz.status !== 'playing';
    const shownGroups = done ? groups.map((_, gi) => gi) : pz.solved;
    const solvedHtml = shownGroups.map(gi => {
      const g = groups[gi];
      return `<div class="pz-solved pz-c${gi}"><b>${esc(WEEK.sections[g.section])}</b>
        <span>${g.tiles.map(t => esc(t.text)).join(' · ')}</span>
        ${done ? `<small>${g.tiles.map(t => linkRefs(t.ref)).join(' · ')}</small>` : ''}</div>`;
    }).join('');

    if (done) {
      body.innerHTML = `
        <div class="pz-wrap">
          <p class="clue-q">${pz.status === 'won' ? 'Solved!' : 'Out of tries for today'}</p>
          <p class="board-help">${pz.status === 'won'
            ? 'Every idea is in its section. You earned ' + PUZZLE_XP + ' XP and a streak freeze ❄️.'
            : "Here's where everything goes. Tomorrow you get a new try."}</p>
          <div style="margin-top:14px">${solvedHtml}</div>
          <div class="board-actions"><button class="btn" data-pz="exit">Back</button></div>
        </div>`;
      return;
    }

    const left = groups.flatMap((g, gi) => pz.solved.includes(gi) ? [] : g.tiles.map(t => t.text));
    if (!pzOrder || pzOrder.length !== left.length || !left.every(t => pzOrder.includes(t))) {
      pzOrder = shuffled(left, WEEK.title + '|' + pz.day + '|' + pz.solved.length);
    }
    body.innerHTML = `
      <div class="pz-wrap">
        <p class="board-help">Find four groups of four. Each group is one of this week's lesson sections.</p>
        <div style="margin-top:12px">${solvedHtml}</div>
        <div class="pz-grid">${pzOrder.map(t =>
          `<button class="ptile${pzSel.includes(t) ? ' sel' : ''}" data-pt="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <p class="pz-msg">${esc(pzMsg)}</p>
        <div class="pz-lives">Mistakes left: ${[0, 1, 2, 3].map(i => `<i class="${i < PUZZLE_MISTAKES - pz.mistakes ? '' : 'gone'}"></i>`).join('')}</div>
        <div class="board-actions" style="justify-content:center">
          <button class="btn ghost" data-pz="shuffle">Shuffle</button>
          <button class="btn ghost" data-pz="clear">Deselect</button>
          <button class="btn" data-pz="submit"${pzSel.length === 4 ? '' : ' disabled style="opacity:.4"'}>Submit</button>
        </div>
      </div>`;
  }

  function puzzleAction(el) {
    const pz = puzzleState();
    const act = el.dataset.pz;
    if (el.dataset.pt != null) {
      const t = el.dataset.pt;
      if (pzSel.includes(t)) pzSel = pzSel.filter(x => x !== t);
      else if (pzSel.length < 4) pzSel.push(t);
      pzMsg = '';
    } else if (act === 'shuffle') {
      pzOrder = shuffled(pzOrder, String(Date.now()));
    } else if (act === 'clear') {
      pzSel = []; pzMsg = '';
    } else if (act === 'exit') {
      closePlay();
      return;
    } else if (act === 'submit' && pzSel.length === 4) {
      const groups = WEEK.puzzle.groups;
      const inGroup = (g, t) => g.tiles.some(x => x.text === t);
      const gi = groups.findIndex(g => pzSel.every(t => inGroup(g, t)));
      if (gi >= 0) {
        pz.solved.push(gi);
        pzSel = []; pzMsg = '';
        if (pz.solved.length === groups.length) {
          pz.status = 'won';
          markStudied();
          if (!pz.rewarded) {
            pz.rewarded = true;
            S.freezes = (S.freezes || 0) + 1;
            grantXp(PUZZLE_XP, 'Solved the weekly puzzle');
            toast('❄️ Streak freeze earned', 'Saves your streak if you miss a day');
          }
        }
      } else if ((pz.guesses || []).includes(pzSel.slice().sort().join('|'))) {
        pzMsg = 'You already tried that one.';     // a repeat guess costs nothing
      } else {
        pz.guesses = (pz.guesses || []).concat(pzSel.slice().sort().join('|'));
        pz.mistakes += 1;
        const best = Math.max(...groups.map(g => pzSel.filter(t => inGroup(g, t)).length));
        pzMsg = best === 3 ? 'One away…' : 'Not a group.';
        if (pz.mistakes >= PUZZLE_MISTAKES) { pz.status = 'lost'; pzSel = []; }
      }
      save();
    }
    renderPuzzle();
    renderHud();
  }

  /* ----- Who said it? ----- */

  let sayIdx = 0, sayPicked = null;

  function openSayings() {
    sayIdx = 0; sayPicked = null;
    openPlay('sayings', 'Who said it?');
    renderSayings();
  }

  function renderSayings() {
    const list = WEEK.sayings;
    const body = $('playBody');
    if (sayIdx >= list.length) {
      const got = list.filter(x => S.sayings[x.id] && S.sayings[x.id].right).length;
      body.innerHTML = `
        <div class="clue">
          <p class="clue-q">${got} of ${list.length} right</p>
          <p class="board-help">XP counts your first try at each line. Play again any time to practice.</p>
          <div class="board-actions">
            <button class="btn" data-say="again">Play again</button>
            <button class="btn ghost" data-say="exit">Done</button>
          </div>
        </div>`;
      return;
    }
    const x = list[sayIdx];
    const shown = sayPicked != null;
    const buttons = shuffled([x.speaker].concat(x.wrong), x.id + '|say').map(c => {
      const cls = shown ? (c === x.speaker ? ' is-right' : c === sayPicked ? ' is-wrong' : '') : '';
      const mark = shown ? (c === x.speaker ? '✓' : c === sayPicked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-say-pick="${esc(c)}"${shown ? ' disabled' : ''}><span class="mark">${mark}</span><span>${esc(c)}</span></button>`;
    }).join('');
    const why = shown
      ? `<p class="quiz-why">${sayPicked === x.speaker ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${linkRefs(x.why, x.ref)}</p>
         <div class="board-actions"><button class="btn" data-say="next">${sayIdx + 1 < list.length ? 'Next line' : 'See how you did'}</button></div>`
      : '';
    body.innerHTML = `
      <div class="clue">
        <div class="eyebrow">Line ${sayIdx + 1} of ${list.length}${shown ? ' · ' + linkRefs(x.ref) : ''}</div>
        <p class="say-quote">${esc(x.text)}</p>
        <div class="quiz${shown ? ' done' : ''}"><div class="quiz-choices">${buttons}</div></div>
        ${why}
      </div>`;
  }

  function sayingsAction(el) {
    const x = WEEK.sayings[sayIdx];
    if (el.dataset.sayPick != null && sayPicked == null) {
      sayPicked = el.dataset.sayPick;
      if (!S.sayings[x.id]) {                    // XP on the first try only
        const right = sayPicked === x.speaker;
        S.sayings[x.id] = { right };
        markStudied();
        if (right) grantXp(SAY_XP, 'Who said it?');
        save();
      }
    } else if (el.dataset.say === 'next') {
      sayIdx += 1; sayPicked = null;
    } else if (el.dataset.say === 'again') {
      sayIdx = 0; sayPicked = null;
    } else if (el.dataset.say === 'exit') {
      closePlay();
      return;
    }
    renderSayings();
    renderHud();
  }

  /* ----- Verse Word: a Wordle-style daily word from the week's reading ----- */

  // Real Wordle rules to start: six tries, colors only. Hints unlock as you
  // go: after 2 guesses the chapter, after 4 the verse with a blank. Solving
  // sooner pays more (15 / 10 / 5 XP). A guess must be a word from the
  // Bible or the Book of Mormon (scripture-words.js); if that list didn't
  // load, any letters count rather than blocking the game.
  const WORD_TRIES = 6;
  const wordXp = guesses => guesses <= 2 ? 15 : guesses <= 4 ? 10 : 5;
  let vwTyped = '', vwMsg = '', wordSet = null;
  const isScriptureWord = w => {
    if (!wordSet && window.SCRIPTURE_WORDS) wordSet = new Set(window.SCRIPTURE_WORDS.split(' '));
    return !wordSet || wordSet.has(w);
  };

  const todaysWord = () => {
    const list = WEEK.words || [];
    return list.length ? list[new Date().getDay() % list.length] : null;
  };

  function wordState() {
    const today = dayKey(), w = todaysWord();
    S.words = S.words || {};
    Object.keys(S.words).forEach(d => { if (dayDiff(d, today) > 14) delete S.words[d]; });
    if (!S.words[today] || S.words[today].word !== w.word) S.words[today] = { word: w.word, guesses: [], status: 'playing' };
    return S.words[today];
  }

  // Wordle's rule: greens first, then yellows only for letters still unused.
  function scoreGuess(guess, word) {
    const res = Array(word.length).fill('x'), left = {};
    for (let i = 0; i < word.length; i++) {
      if (guess[i] === word[i]) res[i] = 'g';
      else left[word[i]] = (left[word[i]] || 0) + 1;
    }
    for (let i = 0; i < word.length; i++) {
      if (res[i] !== 'g' && left[guess[i]]) { res[i] = 'y'; left[guess[i]] -= 1; }
    }
    return res;
  }

  function wordStatus() {
    if (!todaysWord()) return '';
    const st = wordState();
    return st.status === 'won' ? 'Solved today ✓' : st.status === 'lost' ? 'New word tomorrow' : 'Up to 15 XP · a new word every day';
  }

  function openWord() { vwTyped = ''; vwMsg = ''; openPlay('word', 'Verse Word'); renderWord(); }

  function renderWord() {
    const w = todaysWord(), st = wordState(), L = w.word.length;
    const rows = [];
    for (let r = 0; r < WORD_TRIES; r++) {
      const g = st.guesses[r];
      const letters = g || (r === st.guesses.length && st.status === 'playing' ? vwTyped : '');
      const marks = g ? scoreGuess(g, w.word) : [];
      rows.push(`<div class="vw-row" style="grid-template-columns:repeat(${L},auto)">${Array.from({ length: L }, (_, i) =>
        `<div class="vw-cell${marks[i] ? ' ' + marks[i] : letters[i] ? ' filled' : ''}">${esc(letters[i] || '')}</div>`).join('')}</div>`);
    }
    const best = {}, rank = { g: 3, y: 2, x: 1 };
    st.guesses.forEach(g => scoreGuess(g, w.word).forEach((m, i) => {
      if (!best[g[i]] || rank[m] > rank[best[g[i]]]) best[g[i]] = m;
    }));
    const kb = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map((row, n) => `<div class="vw-kr">
      ${n === 2 ? '<button class="vw-key wide" data-vk="enter">Enter</button>' : ''}
      ${[...row].map(c => `<button class="vw-key ${best[c] || ''}" data-vk="${c}">${c}</button>`).join('')}
      ${n === 2 ? '<button class="vw-key wide" data-vk="back" aria-label="Delete">⌫</button>' : ''}</div>`).join('');
    const n = st.guesses.length, done = st.status !== 'playing';
    const blank = done ? esc(w.word) : Array(L).fill('_').join(' ');
    const verse = `<p class="vw-clue">“${esc(w.clue).replace('____', '<b>' + blank + '</b>')}” <span class="text-white/55 text-[13px]">${done ? linkRefs(w.ref) : esc(w.ref)}</span></p>`;
    const hints = done ? verse
      : (n >= 2 ? `<p class="vw-clue">Hint: it's in <b>${esc(w.ref.replace(/:.*/, ''))}</b></p>` : '')
        + (n >= 4 ? verse : `<p class="board-help" style="text-align:center;margin:0 auto 12px">${n < 2 ? 'A hint after 2 guesses' : 'Another hint after 4 guesses'}</p>`);
    const paid = typeof st.paid === 'number' ? st.paid : st.paid ? 10 : 0;   // days solved before the XP tiers paid 10
    const msg = st.status === 'won' ? 'Solved in ' + n + '!' + (paid ? ' +' + paid + ' XP' : '')
      : st.status === 'lost' ? 'The word was ' + w.word + '. A new word tomorrow.' : vwMsg;
    $('playBody').innerHTML = `
      <div class="pz-wrap">
        <p class="board-help" style="text-align:center;margin:0 auto">Today's word is from this week's reading. Six tries.</p>
        ${hints}
        <div class="vw-grid">${rows.join('')}</div>
        <p class="pz-msg">${esc(msg)}</p>
        ${st.status === 'playing'
          ? `<div class="vw-kb">${kb}</div>`
          : '<div class="board-actions" style="justify-content:center"><button class="btn" data-vk="exit">Back</button></div>'}
      </div>`;
  }

  function wordKey(k) {
    if (k === 'exit') { closePlay(); return; }
    const w = todaysWord(), st = wordState(), L = w.word.length;
    if (st.status !== 'playing') return;
    vwMsg = '';
    if (k === 'back') vwTyped = vwTyped.slice(0, -1);
    else if (k === 'enter') {
      if (vwTyped.length < L) vwMsg = 'The word has ' + L + ' letters.';
      else if (vwTyped !== w.word && !isScriptureWord(vwTyped)) vwMsg = 'Not a word in the scriptures. Try another.';
      else {
        st.guesses.push(vwTyped);
        const won = vwTyped === w.word;
        vwTyped = '';
        if (won || st.guesses.length >= WORD_TRIES) {
          st.status = won ? 'won' : 'lost';
          markStudied();
          if (won && !st.paid) { st.paid = wordXp(st.guesses.length); grantXp(st.paid, 'Verse Word'); }
        }
        save();
      }
    } else if (/^[A-Z]$/.test(k) && vwTyped.length < L) vwTyped += k;
    renderWord();
    renderHud();
  }

  /* ----- Scripture Climb: ten questions, each worth more, three lifelines ----- */

  // Easy reel questions first, then the reading-only bonuses. A miss ends
  // the climb and you keep the highest rung you reached (no Millionaire-style
  // drop to a safe level: the ladder and the score should say the same
  // thing). The first climb each day pays 2 XP per right answer; more
  // climbs are practice.
  const CLIMB_VALUES = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000];
  let climb = null;

  function climbQuestions() {
    const seed = WEEK.title + '|' + dayKey();
    const easy = shuffled(WEEK.reels.map(r => ({ q: r.question, src: r.verse.ref, home: r.verse.ref })), seed + '|easy');
    const hard = shuffled(WEEK.reels.flatMap(r => bonusesOf(r).map(b => ({ q: b, src: b.source, home: homeOf(r, b) }))), seed + '|hard');
    const qs = easy.slice(0, 5).concat(hard.slice(0, 5));
    for (const x of easy.slice(5)) if (qs.length < CLIMB_VALUES.length) qs.push(x);
    return qs.slice(0, CLIMB_VALUES.length);
  }

  const climbStatus = () => S.climbDay === dayKey() ? 'Climbed today · more climbs are practice' : 'Up to 20 XP today';

  function openClimb() {
    climb = { qs: climbQuestions(), at: 0, picked: null, hidden: null, used: {}, over: false };
    openPlay('climb', 'Scripture Climb');
    renderClimb();
  }

  function renderClimb() {
    const c = climb, body = $('playBody');
    const ladder = c.qs.map((_, i) => {
      const cls = i < c.at || (c.over && i < c.rungs) ? 'done'
        : (c.over && i === c.rungs && c.rungs < c.qs.length) ? 'missed'
        : (!c.over && i === c.at) ? 'now' : '';
      return `<span class="${cls}">${CLIMB_VALUES[i].toLocaleString('en-US')}</span>`;
    }).join('');
    if (c.over) {
      body.innerHTML = `
        <div class="clue">
          <div class="climb-ladder">${ladder}</div>
          <p class="clue-q">${c.rungs === c.qs.length ? 'To the top! ' : ''}You climbed to ${c.final.toLocaleString('en-US')}</p>
          <p class="board-help">${c.rungs} of ${c.qs.length} right.${c.xp ? ' +' + c.xp + ' XP.' : ' This climb was practice (the first climb each day earns XP).'}</p>
          <div class="board-actions">
            <button class="btn" data-climb="again">Climb again</button>
            <button class="btn ghost" data-climb="exit">Done</button>
          </div>
        </div>`;
      return;
    }
    const cur = c.qs[c.at], shown = c.picked != null;
    const choices = shuffled([cur.q.right].concat(cur.q.wrong), cur.q.q + '|climb').filter(x => x !== c.hidden).map(ch => {
      const cls = shown ? (ch === cur.q.right ? ' is-right' : ch === c.picked ? ' is-wrong' : '') : '';
      const mark = shown ? (ch === cur.q.right ? '✓' : ch === c.picked ? '✕' : '') : '';
      return `<button class="choice${cls}" data-climb-pick="${esc(ch)}"${shown ? ' disabled' : ''}><span class="mark">${mark}</span><span>${esc(ch)}</span></button>`;
    }).join('');
    const right = shown && c.picked === cur.q.right;
    body.innerHTML = `
      <div class="clue">
        <div class="climb-ladder">${ladder}</div>
        <div class="eyebrow">Question ${c.at + 1} of ${c.qs.length} · for ${CLIMB_VALUES[c.at].toLocaleString('en-US')}</div>
        <p class="clue-q">${shown ? linkRefs(cur.q.q, cur.home) : esc(cur.q.q)}</p>
        ${shown ? '' : `<div class="lifelines">
          <button class="lifeline${c.used.half ? ' used' : ''}" data-life="half">50:50</button>
          <a class="lifeline${c.used.read ? ' used' : ''}" data-life="read" href="${esc(sourceLink(cur.src))}" target="_blank" rel="noopener noreferrer">Read it ↗</a>
          <button class="lifeline${c.used.parent ? ' used' : ''}" data-life="parent">Ask a parent</button>
        </div>`}
        ${c.askParent === c.at ? '<p class="parent-msg" style="margin-bottom:12px">Ask a parent! Talk it through together, then choose.</p>' : ''}
        <div class="quiz${shown ? ' done' : ''}"><div class="quiz-choices">${choices}</div></div>
        ${shown ? `<p class="quiz-why">${right ? '<b class="ok">Right.</b> ' : '<b class="no">Not quite.</b> '}${linkRefs(cur.q.why, cur.home)}</p>
          <div class="board-actions"><button class="btn" data-climb="next">${right && c.at + 1 < c.qs.length ? 'Next question' : 'See how you did'}</button></div>` : ''}
      </div>`;
  }

  function finishClimb(allRight) {
    const c = climb;
    c.rungs = allRight ? c.qs.length : c.at;
    c.final = c.rungs ? CLIMB_VALUES[c.rungs - 1] : 0;   // the highest rung reached
    c.over = true;
    markStudied();
    if (S.climbDay !== dayKey()) {
      S.climbDay = dayKey();
      c.xp = c.rungs * 2;
      if (c.xp) grantXp(c.xp, 'Scripture Climb');
    }
    save();
  }

  function climbAction(el) {
    const c = climb;
    if (el.dataset.climb === 'exit') { closePlay(); return; }
    if (el.dataset.climb === 'again') { openClimb(); return; }
    if (c.over) return;
    const cur = c.qs[c.at];
    if (el.dataset.climbPick != null && c.picked == null) {
      c.picked = el.dataset.climbPick;
    } else if (el.dataset.climb === 'next') {
      const right = c.picked === cur.q.right;
      if (right && c.at + 1 < c.qs.length) { c.at += 1; c.picked = null; c.hidden = null; }
      else finishClimb(right);
    } else if (el.dataset.life === 'half' && !c.used.half) {
      c.used.half = true;
      c.hidden = shuffled(cur.q.wrong, cur.q.q + '|half')[0];   // hide one wrong answer
    } else if (el.dataset.life === 'parent' && !c.used.parent) {
      c.used.parent = true;
      c.askParent = c.at;
    } else if (el.dataset.life === 'read' && !c.used.read) {
      c.used.read = true;
      setTimeout(renderClimb, 0);                  // let the link open first
      return;
    }
    renderClimb();
    renderHud();
  }

  /* ----- Who said it? in the daily warm-up ----- */

  // On warm-up days one line comes back too (see rollDay), in the lesson.
  function recordSayWarm(picked) {
    const x = S.daily.say && (WEEK.sayings || []).find(s => s.id === S.daily.say);
    if (!x || S.daily.sayDone) return false;
    const right = picked === x.speaker;
    S.daily.sayDone = { picked, right };
    S.sayRecall = S.sayRecall || {};
    S.sayRecall[x.id] = dayKey();
    if (!S.sayings[x.id] || !S.sayings[x.id].right) S.sayings[x.id] = { right };
    markStudied();
    if (right) grantXp(SAY_XP, 'Who said it?');
    save();
    return true;
  }
  /* ----- the year trail on the home page ----- */

  // Come, Follow Me 2026 (Old Testament) runs 52 weeks. Each finished week
  // becomes a green dot; the lesson link's number says which week this is.
  const YEAR_WEEKS = 52;
  function trailHtml() {
    const now = S.weekNum;
    if (!now) return '';
    const did = new Set((S.history || []).map(h => h.num));
    const dots = Array.from({ length: YEAR_WEEKS }, (_, k) => {
      const n = k + 1;
      return `<i class="${n === now ? 'now' : did.has(n) ? 'did' : n < now ? 'past' : ''}" title="Week ${n}"></i>`;
    }).join('');
    return `<div class="mt-5"><div class="eyebrow">Your year · week ${now} of ${YEAR_WEEKS}</div><div class="trail">${dots}</div></div>`;
  }

  /* ---------------- live game (Kahoot-style) ---------------- */

  // The TV (or a laptop) hosts: it shows a join code, then each question,
  // and keeps score. Phones and tablets join with the code and answer on
  // their own screens in real time. Players don't need accounts.
  //
  // Everything goes through a small `Live` connection with two versions:
  //   Firebase: across real devices. Needs FIREBASE_CONFIG (below).
  //   Local:    between tabs of one browser. Used until Firebase is set up,
  //             and by the tests.
  // Scores: 500 for a right answer plus up to 500 more for speed. Nothing
  // here changes anyone's XP.
  // Which Firebase project a copy of the app talks to, by where it's
  // served: the real app and the test site each have their own. The tests
  // serve the test site's path from localhost to reach the test project.
  // Anywhere else (a file on disk, the private preview) uses the Local
  // version.
  const FIREBASE_PROJECTS = {
    '/TreasureUp/': {
      apiKey: 'AIzaSyCFVw2nEIUteNZhYmBB1Xl0bzsHdtLoJW8',   // public by design; the rules protect the data
      authDomain: 'treasure-up-54eeb.firebaseapp.com',
      projectId: 'treasure-up-54eeb',
      appId: '1:493129438219:web:1b9cc9a131bcc558e6a30e'
    },
    '/TreasureUp-test/': {
      apiKey: 'AIzaSyB9X27jbNg4DOGcrZ8k1BGzR1veJXos3Tc',   // public by design; the rules protect the data
      authDomain: 'scripturetok-test.firebaseapp.com',
      projectId: 'scripturetok-test',
      appId: '1:865412939485:web:f1652b7b6cfa874559e534'
    }
  };
  const FIREBASE_CONFIG = Object.keys(FIREBASE_PROJECTS)
    .filter(path => (location.hostname.endsWith('github.io') || (location.hostname === 'localhost' && path === '/TreasureUp-test/')) &&
                    location.pathname.startsWith(path))
    .map(path => FIREBASE_PROJECTS[path])[0] || null;

  // Firebase loads on first use (the live game, or the family screen) and
  // is shared by both. It waits until it knows who is signed in, so a
  // signed-in parent is never swapped for a new anonymous account.
  const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  let fbReady = null;
  function loadScript(src) {
    return new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = () => no(new Error("Couldn't connect (no internet?)"));
      document.head.appendChild(s);
    });
  }
  function fbInit() {
    if (!FIREBASE_CONFIG) return Promise.reject(new Error('This needs the online app.'));
    if (!fbReady) {
      fbReady = (async () => {
        if (!window.firebase || !window.firebase.firestore) {
          await loadScript(FB_SDK + 'firebase-app-compat.js');
          await loadScript(FB_SDK + 'firebase-auth-compat.js');
          await loadScript(FB_SDK + 'firebase-firestore-compat.js');
        }
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        await new Promise(ok => { const off = firebase.auth().onAuthStateChanged(() => { off(); ok(); }); });
      })();
      fbReady.catch(() => { fbReady = null; });   // let the next try load again
    }
    return fbReady;
  }
  // The signed-in user, or a new anonymous one (live-game players and
  // children don't have accounts).
  async function fbUser() {
    await fbInit();
    const auth = firebase.auth();
    return auth.currentUser || (await auth.signInAnonymously()).user;
  }
  const tsMs = v => v && typeof v.toMillis === 'function' ? v.toMillis() : v;
  const LIVE_SECONDS = 20, LIVE_QUESTIONS = 10;
  const LIVE_COLORS = ['#e11d48', '#2563eb', '#ca8a04'];

  function LocalLive() {
    // Each record is its own localStorage key, so two tabs never overwrite
    // each other's writes: live.<code>.game, .p.<uid>, .a.<qi>_<uid>.
    const PRE = NS + 'live.';
    const subs = new Set();
    const bc = 'BroadcastChannel' in window ? new BroadcastChannel('treasureup-live') : null;
    let uid = null;
    try { uid = sessionStorage.getItem(PRE + 'uid'); } catch (e) {}
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem(PRE + 'uid', uid); } catch (e) {} }
    const get = k => { try { return JSON.parse(localStorage.getItem(PRE + k)); } catch (e) { return null; } };
    const keys = pre => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PRE + pre)) out.push(k.slice(PRE.length)); } } catch (e) {} return out; };
    const notify = c => { subs.forEach(f => f(c)); if (bc) bc.postMessage(c); };
    const put = (c, k, v) => { try { v == null ? localStorage.removeItem(PRE + k) : localStorage.setItem(PRE + k, JSON.stringify(v)); } catch (e) {} notify(c); };
    if (bc) bc.onmessage = e => subs.forEach(f => f(e.data));
    // The message can arrive before another tab's write has reached this
    // one; the storage event comes once it has, so read again then.
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith(PRE)) { const c = e.key.slice(PRE.length).split('.')[0]; subs.forEach(f => f(c)); } });
    const watch = (c, read, cb) => { const f = x => { if (x === c) cb(read()); }; subs.add(f); cb(read()); return () => subs.delete(f); };
    return {
      kind: 'local',
      uid: () => uid,
      init: async () => uid,
      async createGame(c, game) {
        if (get(c + '.game')) return false;
        put(c, c + '.game', Object.assign({}, game, { host: uid, qStart: null }));
        return true;
      },
      watchGame: (c, cb) => watch(c, () => get(c + '.game'), cb),
      watchPlayers: (c, cb) => watch(c, () => keys(c + '.p.').map(k => Object.assign({ uid: k.split('.p.')[1] }, get(k))), cb),
      watchAnswers: (c, qi, cb) => watch(c, () => keys(c + '.a.' + qi + '_').map(get), cb),
      async updateGame(c, patch) {
        const g = get(c + '.game'); if (!g) return;
        if (patch.qStart === 'now') patch.qStart = Date.now();
        put(c, c + '.game', Object.assign(g, patch));
      },
      async join(c, name) {
        if (!get(c + '.game')) return 'No game with that code.';
        const me = get(c + '.p.' + uid);
        put(c, c + '.p.' + uid, me ? Object.assign(me, { name }) : { name, score: 0, last: 0 });
        return null;
      },
      async answer(c, qi, choice) {
        const g = get(c + '.game');
        if (!g || g.state !== 'question' || g.qi !== qi || get(c + '.a.' + qi + '_' + uid)) return;
        put(c, c + '.a.' + qi + '_' + uid, { uid, qi, choice, at: Date.now() });
      },
      async setScores(c, scores) {
        Object.entries(scores).forEach(([u, v]) => { const p = get(c + '.p.' + u); if (p) put(c, c + '.p.' + u, Object.assign(p, v)); });
      },
      async endGame(c) { keys(c + '.').forEach(k => { try { localStorage.removeItem(PRE + k); } catch (e) {} }); notify(c); }
    };
  }

  function FirebaseLive() {
    // Anonymous sign-in is enough to play (a signed-in family member plays
    // as themselves). Firestore stamps the question start and every answer
    // with the server's clock, so speed points are fair whatever each
    // phone's clock says. The uid is read fresh each time, since signing
    // in or out on the family screen changes it.
    let db, FV;
    const ms = tsMs;
    const me = () => firebase.auth().currentUser;
    const gameRef = c => db.collection('live').doc(c);
    return {
      kind: 'firebase',
      uid: () => (window.firebase && firebase.apps.length && me() ? me().uid : null),
      async init() {
        const u = await fbUser();
        db = firebase.firestore();
        FV = firebase.firestore.FieldValue;
        return u.uid;
      },
      async createGame(c, game) {
        try {
          await db.runTransaction(async t => {
            if ((await t.get(gameRef(c))).exists) throw new Error('taken');
            t.set(gameRef(c), Object.assign({}, game, { host: me().uid, qStart: null, created: FV.serverTimestamp() }));
          });
          return true;
        } catch (e) { if (e.message === 'taken') return false; throw e; }
      },
      watchGame: (c, cb) => gameRef(c).onSnapshot(s => {
        if (!s.exists) return cb(null);
        const g = s.data({ serverTimestamps: 'estimate' });
        cb(Object.assign(g, { qStart: ms(g.qStart) }));
      }, () => cb(null)),
      watchPlayers: (c, cb) => gameRef(c).collection('players').onSnapshot(q => cb(q.docs.map(d => Object.assign({ uid: d.id }, d.data()))), () => cb([])),
      watchAnswers: (c, qi, cb) => gameRef(c).collection('answers').where('qi', '==', qi).onSnapshot(q =>
        cb(q.docs.map(d => { const a = d.data({ serverTimestamps: 'estimate' }); return Object.assign(a, { at: ms(a.at) }); })), () => cb([])),
      async updateGame(c, patch) {
        if (patch.qStart === 'now') patch.qStart = FV.serverTimestamp();
        await gameRef(c).update(patch);
      },
      async join(c, name) {
        if (!(await gameRef(c).get()).exists) return 'No game with that code.';
        const mine = gameRef(c).collection('players').doc(me().uid);
        if ((await mine.get()).exists) await mine.update({ name });
        else await mine.set({ name, score: 0, last: 0 });
        return null;
      },
      async answer(c, qi, choice) {
        const uid = me().uid;
        await gameRef(c).collection('answers').doc(qi + '_' + uid).set({ uid, qi, choice, at: FV.serverTimestamp() });
      },
      async setScores(c, scores) {
        const b = db.batch();
        Object.entries(scores).forEach(([u, v]) => b.update(gameRef(c).collection('players').doc(u), v));
        await b.commit();
      },
      async endGame(c) {
        const b = db.batch();
        for (const sub of ['answers', 'players']) (await gameRef(c).collection(sub).get()).docs.forEach(d => b.delete(d.ref));
        b.delete(gameRef(c));
        await b.commit();
      }
    };
  }

  let LIVE = null;
  const liveConn = () => LIVE || (LIVE = FIREBASE_CONFIG ? FirebaseLive() : LocalLive());

  // Questions are named by id ("isa13-babylon:q", "isa25-refuge:b1") so
  // every device looks up the same checked question from its own copy.
  function liveQuestion(id) {
    const [rid, part] = String(id).split(':');
    const r = reelById(rid);
    if (!r) return null;
    return part === 'q' ? r.question : bonusesOf(r)[Number((part || '').slice(1))] || null;
  }
  function liveQuestionIds(seed) {
    const easy = shuffled(WEEK.reels.map(r => r.id + ':q'), seed + '|e');
    const hard = shuffled(WEEK.reels.flatMap(r => bonusesOf(r).map((_, n) => r.id + ':b' + n)), seed + '|h');
    const ids = easy.slice(0, 6).concat(hard.slice(0, 4));
    for (const x of easy.slice(6)) if (ids.length < LIVE_QUESTIONS) ids.push(x);
    return ids.slice(0, LIVE_QUESTIONS);
  }
  const liveChoices = id => { const q = liveQuestion(id); return shuffled([q.right].concat(q.wrong), 'live|' + id); };

  let lv = null;   // this screen's part in a game

  function openLive() {
    $('liveTitle').textContent = WEEK.title;
    $('live').hidden = false;
  }
  function liveBody(html) { $('liveBody').innerHTML = html; }
  function stopLive() {
    if (lv) { (lv.unsub || []).forEach(f => { try { f(); } catch (e) {} }); clearInterval(lv.tick); }
    lv = null;
  }
  async function closeLive() {
    const was = lv;
    stopLive();
    $('live').hidden = true;
    if (was && was.role === 'host' && was.code) { try { await liveConn().endGame(was.code); } catch (e) {} }
  }

  const modeNote = () => liveConn().kind === 'local'
    ? '<p class="live-mode">Test mode: players join from other tabs of this browser. Playing across phones turns on once the live-game server is set up.</p>'
    : '';

  function liveStart() {   // the chooser
    stopLive();
    openLive();
    liveBody(`
      <div class="clue">
        <p class="clue-q">Play live</p>
        <p class="board-help">The TV or laptop shows the questions. Everyone answers on their own phone or tablet, and the fastest right answers score the most.</p>
        <div class="board-actions">
          <button class="btn" data-live="host">Host on this screen</button>
          <button class="btn ghost" data-live="join">Join with a code</button>
        </div>
        ${modeNote()}
      </div>`);
  }

  /* ----- host (the TV) ----- */

  async function hostLive() {
    stopLive();
    openLive();
    liveBody('<p class="board-help">Starting a game…</p>');
    const L = liveConn();
    try { await L.init(); } catch (e) { liveBody(`<div class="clue"><p class="clue-q">Can't start the game</p><p class="board-help">${esc(e.message)}</p></div>`); return; }
    let code = null;
    for (let i = 0; i < 20 && !code; i++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      if (await L.createGame(c, { week: WEEK.title, qs: liveQuestionIds(c), state: 'lobby', qi: -1, seconds: LIVE_SECONDS })) code = c;
    }
    if (!code) { liveBody('<div class="clue"><p class="clue-q">Couldn&rsquo;t get a game code. Try again.</p></div>'); return; }
    lv = { role: 'host', code, game: null, players: [], answers: [], unsub: [] };
    lv.unsub.push(L.watchGame(code, g => { if (!lv) return; lv.game = g; renderHost(); }));
    lv.unsub.push(L.watchPlayers(code, ps => { if (!lv) return; lv.players = ps; renderHost(); checkAllAnswered(); }));
  }

  function watchAnswersFor(qi) {
    if (lv.offAnswers) lv.offAnswers();
    lv.answers = [];
    lv.offAnswers = liveConn().watchAnswers(lv.code, qi, as => { if (!lv) return; lv.answers = as; renderHost(); checkAllAnswered(); });
    lv.unsub.push(lv.offAnswers);
  }

  async function askQuestion(qi) {
    lv.localStart = Date.now();
    lv.revealedQi = null;                        // a new question (or a new game) starts unrevealed
    watchAnswersFor(qi);
    await liveConn().updateGame(lv.code, { state: 'question', qi, qStart: 'now' });
    clearInterval(lv.tick);
    lv.tick = setInterval(() => {
      if (!lv || !lv.game || lv.game.state !== 'question') return;
      const left = LIVE_SECONDS - Math.floor((Date.now() - lv.localStart) / 1000);
      const el = document.getElementById('liveClock');
      if (el) el.textContent = Math.max(0, left);
      if (left <= 0) reveal();
    }, 250);
  }

  function checkAllAnswered() {
    if (!lv || lv.role !== 'host' || !lv.game || lv.game.state !== 'question' || !lv.players.length) return;
    if (lv.players.every(p => lv.answers.some(a => a.uid === p.uid))) reveal();
  }

  // Reveal once per question. The guard is per question, not a single busy
  // flag: Firebase shows the new state before it confirms the save, so the
  // host can already be on the next question while this one's save finishes.
  async function reveal() {
    if (!lv || !lv.game || lv.game.state !== 'question' || lv.revealedQi === lv.game.qi) return;
    const g = lv.game, q = liveQuestion(g.qs[g.qi]);
    lv.revealedQi = g.qi;
    clearInterval(lv.tick);
    const scores = {};
    lv.players.forEach(p => {
      const a = lv.answers.find(x => x.uid === p.uid);
      const right = !!a && a.choice === q.right;
      let pts = 0;
      if (right) {
        const secs = Math.max(0, ((a.at || 0) - (g.qStart || 0)) / 1000);
        pts = 500 + Math.round(500 * Math.max(0, 1 - secs / LIVE_SECONDS));
      }
      scores[p.uid] = { score: (p.score || 0) + pts, last: pts, lastRight: right, lastAnswered: !!a };
    });
    try {
      await liveConn().setScores(lv.code, scores);
      await liveConn().updateGame(lv.code, { state: 'reveal' });
    } catch (e) {
      if (lv && lv.revealedQi === g.qi) lv.revealedQi = null;   // let the button or the timer try again
      toast("Couldn't reach the game", 'Check the internet and tap Show the answer again');
    }
  }

  async function hostAction(act) {
    const L = liveConn(), g = lv && lv.game;
    if (!g) return;
    if (act === 'start' && g.state === 'lobby' && lv.players.length) await askQuestion(0);
    else if (act === 'reveal') await reveal();
    else if (act === 'next' && g.state === 'reveal') {
      if (g.qi + 1 < g.qs.length) await askQuestion(g.qi + 1);
      else await L.updateGame(lv.code, { state: 'final' });
    } else if (act === 'again') {
      const code = lv.code;
      await L.setScores(code, Object.fromEntries(lv.players.map(p => [p.uid, { score: 0, last: 0 }])));
      await L.updateGame(code, { state: 'lobby', qi: -1, qs: liveQuestionIds(code + '|' + Date.now()) });
    } else if (act === 'end') {
      await closeLive();
    }
  }

  const ranked = ps => ps.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  const fmt = n => Number(n || 0).toLocaleString('en-US');

  function choicesHtml(id, g, counts) {
    const q = liveQuestion(id);
    const shown = g.state !== 'question';
    return `<div class="live-choices">${liveChoices(id).map((c, n) => {
      const right = c === q.right;
      const cls = shown ? (right ? ' right' : ' dim') : '';
      const count = counts ? `<span style="margin-left:auto;font-variant-numeric:tabular-nums">${counts[c] || 0}</span>` : '';
      return `<div class="live-choice${cls}" style="background:${LIVE_COLORS[n]}"><span class="lt">${'ABC'[n]}</span><span>${esc(c)}</span>${count}</div>`;
    }).join('')}</div>`;
  }

  function renderHost() {
    if (!lv || lv.role !== 'host') return;
    const g = lv.game;
    if (!g) { liveBody('<div class="live-big">The game has ended.</div>'); return; }
    const players = ranked(lv.players);
    if (g.state === 'lobby') {
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Join code</div>
          <div class="live-code">${esc(lv.code)}</div>
          <p class="board-help">On each phone or tablet: open Treasure Up, tap 🎮, choose <b>Live game</b>, then <b>Join with a code</b>.</p>
          <div class="live-players">${players.map(p => `<span>${esc(p.name)}</span>`).join('') || '<span style="opacity:.5">Waiting for players…</span>'}</div>
          <div class="board-actions">
            <button class="btn" data-host="start"${players.length ? '' : ' disabled style="opacity:.4"'}>Start · ${g.qs.length} questions</button>
            <button class="btn ghost" data-host="end">Cancel</button>
          </div>
          ${modeNote()}
        </div>`);
      return;
    }
    if (g.state === 'question' || g.state === 'reveal') {
      const id = g.qs[g.qi], q = liveQuestion(id);
      const counts = {};
      if (g.state === 'reveal') lv.answers.forEach(a => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
      const board = g.state === 'reveal' ? `
        <p class="quiz-why" style="margin-top:14px"><b class="ok">Answer:</b> ${esc(q.right)}. ${linkRefs(q.why, homeOfId(id))}</p>
        <div class="grid gap-2" style="margin-top:14px">${players.slice(0, 5).map((p, i) =>
          `<div class="score-row"><span>${i + 1}. ${esc(p.name)} ${p.last ? `<span style="color:var(--right)">+${fmt(p.last)}</span>` : ''}</span><b>${fmt(p.score)}</b></div>`).join('')}</div>
        <div class="board-actions"><button class="btn" data-host="next">${g.qi + 1 < g.qs.length ? 'Next question' : 'Final scores'}</button></div>` : `
        <div class="board-actions"><button class="btn ghost" data-host="reveal">Show the answer now</button></div>`;
      liveBody(`
        <div class="clue">
          <div class="live-row">
            <div class="eyebrow">Question ${g.qi + 1} of ${g.qs.length}${g.state === 'question' ? ` · ${lv.answers.length} of ${players.length} answered` : ''}</div>
            ${g.state === 'question' ? `<div class="live-clock" id="liveClock">${Math.max(0, LIVE_SECONDS - Math.floor((Date.now() - (lv.localStart || Date.now())) / 1000))}</div>` : ''}
          </div>
          <p class="clue-q">${g.state === 'reveal' ? linkRefs(q.q, homeOfId(id)) : esc(q.q)}</p>
          ${choicesHtml(id, g, g.state === 'reveal' ? counts : null)}
          ${board}
        </div>`);
      return;
    }
    if (g.state === 'final') {
      const total = players.reduce((n, p) => n + (p.score || 0), 0);
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Final scores</div>
          <p class="clue-q">Together you scored ${fmt(total)}</p>
          <div class="grid gap-2" style="margin-top:12px">${players.map((p, i) =>
            `<div class="score-row"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${esc(p.name)}</span><b>${fmt(p.score)}</b></div>`).join('')}</div>
          <div class="board-actions">
            <button class="btn" data-host="again">Play again</button>
            <button class="btn ghost" data-host="end">Done</button>
          </div>
        </div>`);
    }
  }

  /* ----- player (a phone or tablet) ----- */

  function joinForm(code, err) {
    stopLive();
    openLive();
    let name = '';
    try { name = localStorage.getItem(NS + 'live.name') || ''; } catch (e) {}
    if (!name && F) name = F.name.slice(0, 16);
    liveBody(`
      <div class="clue" style="max-width:420px">
        <p class="clue-q">Join a live game</p>
        <label class="block text-[12px] text-white/60" for="liveCode">Code on the TV</label>
        <input id="liveCode" class="field" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(code || '')}" style="font-size:28px;letter-spacing:.2em;text-align:center">
        <label class="block mt-3 text-[12px] text-white/60" for="liveName">Your name</label>
        <input id="liveName" class="field" maxlength="16" autocomplete="off" value="${esc(name)}">
        ${err ? `<p class="parent-msg">${esc(err)}</p>` : ''}
        <div class="board-actions"><button class="btn" data-live="joinnow">Join</button></div>
        ${modeNote()}
      </div>`);
  }

  async function joinLive() {
    const code = $('liveCode').value.trim(), name = $('liveName').value.trim();
    if (!/^\d{4}$/.test(code)) return joinForm(code, 'The code is 4 numbers.');
    if (!name) return joinForm(code, 'Type your name.');
    try { localStorage.setItem(NS + 'live.name', name); } catch (e) {}
    const L = liveConn();
    try { await L.init(); } catch (e) { return joinForm(code, e.message); }
    const err = await L.join(code, name);
    if (err) return joinForm(code, err);
    lv = { role: 'player', code, name, game: null, players: [], picked: {}, unsub: [] };
    lv.unsub.push(L.watchGame(code, g => { if (!lv) return; lv.game = g; renderPlayer(); }));
    lv.unsub.push(L.watchPlayers(code, ps => { if (!lv) return; lv.players = ps; renderPlayer(); }));
  }

  async function playerAnswer(choice) {
    const g = lv && lv.game;
    if (!g || g.state !== 'question' || lv.picked[g.qi] != null) return;
    lv.picked[g.qi] = choice;
    renderPlayer();
    await liveConn().answer(lv.code, g.qi, choice);
  }

  function renderPlayer() {
    if (!lv || lv.role !== 'player') return;
    const g = lv.game, L = liveConn();
    if (!g) { liveBody('<div class="live-big">The game has ended.</div><p class="live-sub">Thanks for playing!</p>'); return; }
    if (g.week !== WEEK.title) { liveBody('<div class="live-big">This game is for a different week.</div><p class="live-sub">Refresh Treasure Up and join again.</p>'); return; }
    const players = ranked(lv.players);
    const me = players.find(p => p.uid === L.uid()) || { score: 0 };
    const place = players.findIndex(p => p.uid === L.uid()) + 1;
    const ord = n => n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th';
    const standing = `<p class="live-sub">${fmt(me.score)} points${place ? ' · ' + ord(place) + ' place' : ''}</p>`;
    if (g.state === 'lobby') { liveBody(`<div class="live-big">You're in, ${esc(lv.name)}!</div><p class="live-sub">Watch the TV. The game starts soon.</p>`); return; }
    if (g.state === 'question') {
      const id = g.qs[g.qi], q = liveQuestion(id);
      if (lv.picked[g.qi] != null) { liveBody(`<div class="live-big">Locked in!</div><p class="live-sub">Waiting for the others…</p>`); return; }
      liveBody(`
        <div class="clue">
          <div class="eyebrow">Question ${g.qi + 1} of ${g.qs.length}</div>
          <p class="quiz-q" style="font-size:18px">${esc(q.q)}</p>
          <div class="live-choices">${liveChoices(id).map((c, n) =>
            `<button class="live-choice" style="background:${LIVE_COLORS[n]}" data-lpick="${esc(c)}"><span class="lt">${'ABC'[n]}</span><span>${esc(c)}</span></button>`).join('')}</div>
        </div>`);
      return;
    }
    if (g.state === 'reveal') {
      const right = me.lastRight, answered = me.lastAnswered;
      liveBody(`<div class="live-big">${right ? 'Right! +' + fmt(me.last) : answered ? 'Not this time' : 'Too slow!'}</div>${standing}`);
      return;
    }
    if (g.state === 'final') {
      const total = players.reduce((n, p) => n + (p.score || 0), 0);
      liveBody(`<div class="live-big">${place === 1 ? '🥇 You won!' : 'You finished ' + ord(place)}</div>
        <p class="live-sub">${fmt(me.score)} points · Together: ${fmt(total)}</p>`);
    }
  }

  /* ---------------- Babylon Falls: the family map game ---------------- */

  // Risk-style, for 2 to 5 players. The map (content/boards.js) is on a
  // computer or TV; everyone plays on their own phone or tablet. The
  // computer runs the game: it holds the whole state, and each phone sends
  // moves, which the computer checks before applying, so a phone can't make
  // a move that isn't allowed. Armies come from the week's checked
  // questions: an easy one (a reel's own question, this week's or an
  // earlier week's) for 3, a hard one (find it in the reading) for 5, a
  // miss for 1, plus 1 for every 3 lands held. Battles are dice as in Risk,
  // and Babylon's walls give its defender 3 dice. After the last round the
  // most land wins, Babylonia counting 3. Nothing here changes anyone's XP.
  const RISK = { easy: 3, hard: 5, miss: 1, perLands: 3, start: 4, neutral: 2, wallsNeutral: 3, maxCards: 2, rounds: [5, 8, 12], time: { easy: 30, hard: 180 } };
  const BOARD = () => (window.TU_BOARDS || [])[0] || null;

  function RiskLocal() {
    // Between tabs of one browser, like the live game's test mode: each
    // record is its own localStorage key (risk.<code>.game, .p.<uid>,
    // .m.<time>-<n>-<uid>), and a BroadcastChannel says when one changed.
    const PRE = NS + 'risk.';
    const subs = new Set();
    const bc = 'BroadcastChannel' in window ? new BroadcastChannel('treasureup-risk') : null;
    let uid = null, seq = 0;
    try { uid = sessionStorage.getItem(PRE + 'uid'); } catch (e) {}
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem(PRE + 'uid', uid); } catch (e) {} }
    const get = k => { try { return JSON.parse(localStorage.getItem(PRE + k)); } catch (e) { return null; } };
    const keys = pre => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PRE + pre)) out.push(k.slice(PRE.length)); } } catch (e) {} return out; };
    const notify = c => { subs.forEach(f => f(c)); if (bc) bc.postMessage(c); };
    const put = (c, k, v) => { try { v == null ? localStorage.removeItem(PRE + k) : localStorage.setItem(PRE + k, JSON.stringify(v)); } catch (e) {} notify(c); };
    if (bc) bc.onmessage = e => subs.forEach(f => f(e.data));
    // The message can arrive before another tab's write has reached this
    // one; the storage event comes once it has, so read again then.
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith(PRE)) { const c = e.key.slice(PRE.length).split('.')[0]; subs.forEach(f => f(c)); } });
    const watch = (c, read, cb) => { const f = x => { if (x === c) cb(read()); }; subs.add(f); cb(read()); return () => subs.delete(f); };
    return {
      kind: 'local',
      uid: () => uid,
      init: async () => uid,
      async create(c, game) {
        if (get(c + '.game')) return false;
        put(c, c + '.game', Object.assign({}, game, { host: uid }));
        return true;
      },
      watchGame: (c, cb) => watch(c, () => get(c + '.game'), cb),
      async save(c, fields) { const g = get(c + '.game'); if (g) put(c, c + '.game', Object.assign(g, fields)); },
      watchPlayers: (c, cb) => watch(c, () => keys(c + '.p.').map(k => Object.assign({ uid: k.split('.p.')[1] }, get(k))), cb),
      async join(c, name) {
        if (!get(c + '.game')) return 'No game with that code.';
        put(c, c + '.p.' + uid, { name });
        return null;
      },
      async move(c, m) { put(c, c + '.m.' + Date.now() + '-' + String(seq++).padStart(4, '0') + '-' + uid, Object.assign({}, m, { uid })); },
      watchMoves: (c, cb) => watch(c, () => keys(c + '.m.').sort().map(k => Object.assign({ id: k }, get(k))).filter(m => m.kind), cb),
      async dropMove(c, id) { put(c, id, null); },
      async end(c) { keys(c + '.').forEach(k => { try { localStorage.removeItem(PRE + k); } catch (e) {} }); notify(c); }
    };
  }

  function RiskFirebase() {
    // /risk/{code}: the game, written only by the computer that hosts it;
    // /players/{uid}: each phone's name; /moves: each phone's moves, which
    // only the host reads, applies and deletes (firestore.rules).
    let db, FV;
    const me = () => firebase.auth().currentUser;
    const ref = c => db.collection('risk').doc(c);
    return {
      kind: 'firebase',
      uid: () => (window.firebase && firebase.apps.length && me() ? me().uid : null),
      async init() {
        const u = await fbUser();
        db = firebase.firestore();
        FV = firebase.firestore.FieldValue;
        return u.uid;
      },
      async create(c, game) {
        try {
          await db.runTransaction(async t => {
            if ((await t.get(ref(c))).exists) throw new Error('taken');
            t.set(ref(c), Object.assign({}, game, { host: me().uid, created: FV.serverTimestamp() }));
          });
          return true;
        } catch (e) { if (e.message === 'taken') return false; throw e; }
      },
      watchGame: (c, cb) => ref(c).onSnapshot(s => cb(s.exists ? s.data() : null), () => cb(null)),
      async save(c, fields) { await ref(c).update(fields); },
      watchPlayers: (c, cb) => ref(c).collection('players').onSnapshot(q => cb(q.docs.map(d => Object.assign({ uid: d.id }, d.data()))), () => cb([])),
      async join(c, name) {
        if (!(await ref(c).get()).exists) return 'No game with that code.';
        await ref(c).collection('players').doc(me().uid).set({ name });
        return null;
      },
      async move(c, m) { await ref(c).collection('moves').add(Object.assign({}, m, { uid: me().uid, at: FV.serverTimestamp() })); },
      watchMoves: (c, cb) => ref(c).collection('moves').orderBy('at').onSnapshot(q =>
        cb(q.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })))), () => cb([])),
      async dropMove(c, id) { await ref(c).collection('moves').doc(id).delete(); },
      async end(c) {
        const b = db.batch();
        for (const sub of ['moves', 'players']) (await ref(c).collection(sub).get()).docs.forEach(d => b.delete(d.ref));
        b.delete(ref(c));
        await b.commit();
      }
    };
  }

  let RISKC = null;
  const riskConn = () => RISKC || (RISKC = FIREBASE_CONFIG ? RiskFirebase() : RiskLocal());
  let rk = null;   // this screen's part in a game: { role: 'host' | 'player', code, g, players, ... }

  // Questions, named by id so every screen looks up the same checked one:
  // "isa13-babylon:q" (a reel's own), "isa25-refuge:b1" (a bonus), and
  // "deep:deep39-pride" (a Go-deeper reading). Reels can be from an earlier week.
  const anyReel = id => (window.TU_WEEKS || []).reduce((f, w) => f || w.reels.find(r => r.id === id), null);
  function gameQuestion(id) {
    if (/^deep:/.test(id)) {
      const d = deepItems().find(x => 'deep:' + x.id === id);
      return d ? { q: d, text: d.hunt || d.q, home: deepHome(d), deep: d, week: WEEK } : null;
    }
    const [rid, part] = String(id).split(':'), r = anyReel(rid);
    const q = !r ? null : part === 'q' ? r.question : bonusesOf(r)[Number(String(part).slice(1))];
    if (!q) return null;
    return { q, text: part === 'q' ? q.q : q.hunt || q.q, home: part === 'q' ? r.verse.ref : homeOf(r, q), bonus: part === 'q' ? null : q, week: (window.TU_WEEKS || []).find(w => w.reels.includes(r)) };
  }
  // Easy: reel questions, this week's and earlier weeks' (a review). Hard:
  // this week's reading questions (the reel bonuses and Go deeper) as hunts:
  // they name only the chapter (or the page), never the verse. One that
  // names a verse plays only once it has a `hunt` wording (tools/verify.mjs
  // checks its answer is in that chapter just once).
  const huntable = q => !!q.hunt || !/\d+:\d+/.test(q.q);
  function riskPools() {
    const start = weekStart(WEEK.dates);
    const earlier = (window.TU_WEEKS || []).filter(w => w !== WEEK && weekStart(w.dates) < start);
    return {
      easy: WEEK.reels.concat(...earlier.map(w => w.reels)).map(r => r.id + ':q'),
      hard: WEEK.reels.flatMap(r => bonusesOf(r).map((b, n) => huntable(b) ? r.id + ':b' + n : null)).filter(Boolean)
        .concat(deepItems().filter(huntable).map(d => 'deep:' + d.id))
    };
  }
  const riskChoices = id => { const Q = gameQuestion(id); return shuffled([Q.q.right].concat(Q.q.wrong), 'risk|' + id); };
  // Where to hunt for a hard question's answer: the chapter, from its top
  // (not at the verse), or the page.
  function riskReading(Q) {
    const src = Q.deep ? (isRef(Q.deep.source) ? Q.deep.source : Q.deep.read) : Q.bonus && Q.bonus.source;
    if (!src) return null;
    const url = isRef(src) ? readLink(src, true) : src === 'lesson' ? WEEK.lesson : src;
    return url ? { url, label: sourceLabel(src) } : null;
  }

  // ----- the rules (run by the host) -----

  const seatOf = (g, uid) => (g.seats || []).find(s => s.uid === uid);
  const kingdomOf = k => BOARD().kingdoms.find(x => x.id === k);
  const landsOf = (g, uid) => Object.keys(g.lands || {}).filter(id => g.lands[id].o === uid);
  const landName = id => (BOARD().lands.find(l => l.id === id) || {}).name || id;
  const seatName = s => s ? s.name + ' (' + kingdomOf(s.k).name + ')' : '';
  function adjacent(a, b) { return BOARD().links.some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }
  function riskDie() {
    // The tests set the dice (window.TU_DICE) when there's no Firebase.
    if (!FIREBASE_CONFIG && Array.isArray(window.TU_DICE) && window.TU_DICE.length) return window.TU_DICE.shift();
    return 1 + Math.floor(Math.random() * 6);
  }
  const rollDice = n => Array.from({ length: n }, riskDie).sort((a, b) => b - a);
  function riskLog(g, text) { g.log = (g.log || []).concat(text).slice(-8); }
  // The narrator's line: what just happened, told as a story (and read out
  // on the big screen when its voice is on).
  function riskSay(g, text) {
    g.say = { n: ((g.say && g.say.n) || 0) + 1, text };
    g.says = (g.says || []).concat(g.say).slice(-4);      // so the voice can read every line since it last spoke
    riskLog(g, text);
  }
  const kName = (g, uid) => { const s = uid && seatOf(g, uid); return s ? kingdomOf(s.k).name : 'the neutral army'; };
  const fmtClock = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');

  // The coach's odds: every way one roll can go (ad attacking dice against
  // dd defending), then the chance of taking a land by attacking until it
  // falls or only one army is left to attack from.
  const rollTable = {};
  function rollOdds(ad, dd) {
    const key = ad + ',' + dd;
    if (rollTable[key]) return rollTable[key];
    const out = {}, n = ad + dd, total = Math.pow(6, n);
    for (let k = 0; k < total; k++) {
      const faces = [];
      for (let x = k, i = 0; i < n; i++, x = Math.floor(x / 6)) faces.push(x % 6 + 1);
      const a = faces.slice(0, ad).sort((p, q) => q - p), d = faces.slice(ad).sort((p, q) => q - p);
      let la = 0, ld = 0;
      for (let i = 0; i < Math.min(ad, dd); i++) { if (a[i] > d[i]) ld++; else la++; }
      out[la + ',' + ld] = (out[la + ',' + ld] || 0) + 1 / total;
    }
    return (rollTable[key] = Object.entries(out).map(([k, p]) => { const [la, ld] = k.split(',').map(Number); return { la, ld, p }; }));
  }
  function takeOdds(a, d, walls) {
    const memo = {};
    const go = (a, d) => {
      if (d <= 0) return { win: 1, lost: 0 };
      if (a < 2) return { win: 0, lost: 0 };
      const key = a + ',' + d;
      if (memo[key]) return memo[key];
      let win = 0, lost = 0;
      for (const o of rollOdds(Math.min(3, a - 1), Math.min(walls ? 3 : 2, d))) {
        const r = go(a - o.la, d - o.ld);
        win += o.p * r.win;
        lost += o.p * (o.la + r.lost);
      }
      return (memo[key] = { win, lost });
    };
    return go(Math.min(a, 60), Math.min(d, 60));
  }

  const newTurn = i => ({ i, phase: 'choose', level: null, q: null, armies: 0, result: null, gates: false });

  function riskBegin(g) {
    const B = BOARD();
    g.lands = {};
    B.lands.forEach(l => { g.lands[l.id] = { o: null, a: l.id === B.walls ? RISK.wallsNeutral : RISK.neutral }; });
    g.seats.forEach(s => { g.lands[kingdomOf(s.k).home] = { o: s.uid, a: RISK.start }; });
    g.state = 'play';
    g.round = 1;
    g.cards = {};
    g.used = { easy: [], hard: [] };
    g.dice = null;
    g.log = [];
    g.turn = newTurn(0);
    g.story = true;                            // the narrator tells the story first
    g.say = null;
  }
  // After the story: round 1 begins.
  function riskStoryDone(g) {
    g.story = false;
    riskSay(g, 'Round 1 of ' + g.rounds + '. ' + kingdomOf(g.seats[0].k).name + ' moves first: ' + g.seats[0].name + ', raise your army!');
  }

  function riskNextQuestion(g, level) {
    const pool = riskPools()[level];
    const order = shuffled(pool, rk.code + '|' + level + '|' + Math.floor(g.used[level].length / pool.length));
    let id = order.find(x => !g.used[level].includes(x));
    if (!id) { g.used[level] = []; id = order[0]; }
    g.used[level].push(id);
    return id;
  }

  function riskNextTurn(g) {
    const n = g.seats.length;
    let i = g.turn.i;
    for (let k = 0; k < n; k++) {
      i = (i + 1) % n;
      if (i === 0) g.round++;
      if (!g.seats[i].out) break;
    }
    if (g.round > g.rounds) return riskOver(g);
    g.turn = newTurn(i);
    riskSay(g, (i === 0 || g.seats.slice(0, i).every(s => s.out) ? 'Round ' + g.round + ' of ' + g.rounds + '. ' : '') + kingdomOf(g.seats[i].k).name + "'s turn: " + g.seats[i].name + ', raise your army!');
  }

  // A turn's answer (or its time running out): armies, maybe a prophecy card.
  function riskAnswered(g, right, picked, timeout) {
    const B = BOARD(), t = g.turn, seat = g.seats[t.i], hand = g.cards[seat.uid] || [], K = kingdomOf(seat.k).name;
    const got = right ? RISK[t.level] : RISK.miss, bonus = Math.floor(landsOf(g, seat.uid).length / RISK.perLands);
    let card = null;
    if (right && t.level === 'hard' && hand.length < RISK.maxCards && B.cards.length) {
      card = B.cards[Math.floor(Math.random() * B.cards.length)].id;
      g.cards[seat.uid] = hand.concat(card);
    }
    t.armies = got + bonus;
    t.result = { right, picked, got, bonus, card, timeout };
    t.phase = 'place';
    riskSay(g, (timeout ? "Time's up! " : right ? seat.name + ' knew it! ' : 'Not this time. ') + K + ' raises ' + t.armies + (t.armies === 1 ? ' army' : ' armies') +
      (card ? ' and wins a prophecy card' : '') + '.');
  }
  // The answer's time is up: counts as a miss. Checked on the host's (or the
  // one screen's) own clock, so every phone gets the same time.
  function riskTimeUp(g) {
    const t = g.state === 'play' && !g.story && g.turn;
    if (!t || t.phase !== 'answer' || !t.limit || Date.now() - t.started < t.limit * 1000) return false;
    riskAnswered(g, false, '', true);
    return true;
  }
  // Seconds left to answer. A phone counts from when it first saw the question.
  function riskLeft(t) {
    let start = t.started;
    if (rk.role === 'player') {
      const key = t.i + '|' + t.q;
      if (rk.seen !== key) { rk.seen = key; rk.seenAt = Date.now(); }
      start = rk.seenAt;
    }
    return Math.max(0, Math.ceil(t.limit - (Date.now() - start) / 1000));
  }
  function riskTick() {
    if (!rk || !rk.g) return;
    if ((rk.role === 'host' || rk.role === 'solo') && riskTimeUp(rk.g)) {
      if (rk.role === 'host') riskSave(); else { rk.sel = {}; riskSoloSave(); }
      return riskRender();
    }
    const t = rk.g.turn, el = document.getElementById('rkClock');
    if (el && t && t.limit && t.phase === 'answer') { const left = riskLeft(t); el.textContent = fmtClock(left); el.classList.toggle('low', left <= 10); }
  }

  function riskScores(g) {
    const B = BOARD();
    return g.seats.map(s => {
      const ls = landsOf(g, s.uid);
      return { uid: s.uid, name: s.name, k: s.k, lands: ls.length, babylon: ls.includes(B.walls),
               pts: ls.length + (ls.includes(B.walls) ? 2 : 0), armies: ls.reduce((n, id) => n + g.lands[id].a, 0), out: !!s.out };
    }).sort((a, b) => b.pts - a.pts || b.armies - a.armies);
  }
  function riskOver(g) {
    g.state = 'over';
    g.turn = null;
    g.final = riskScores(g);
    const w = g.final[0];
    riskSay(g, 'The game is over. ' + kingdomOf(w.k).name + ' wins, holding ' + w.lands + (w.lands === 1 ? ' land' : ' lands') + (w.babylon ? ', Babylon among them' : '') + '!');
  }

  // Apply one move from a phone, if it's allowed; one that isn't is
  // dropped. 'wait' means try it again once this screen has caught up
  // (a kingdom picked before the phone's join has arrived here).
  function riskApply(g, m) {
    const B = BOARD();
    if (g.state === 'lobby') {
      if (m.kind !== 'pick' || !kingdomOf(m.a)) return;
      const p = (rk.players || []).find(x => x.uid === m.uid);
      if (!p) return 'wait';
      const mine = seatOf(g, m.uid), holder = g.seats.find(s => s.k === m.a);
      if (holder && holder.uid !== m.uid) return;                       // taken
      if (mine) mine.k = m.a;
      else g.seats = g.seats.concat({ uid: m.uid, name: p.name, k: m.a });
      return;
    }
    if (g.state !== 'play' || !g.turn || g.story) return;
    const t = g.turn, seat = g.seats[t.i];
    if (!seat || seat.uid !== m.uid) return;                             // not your turn
    const uid = m.uid, hand = g.cards[uid] || [];
    if (m.kind === 'level' && t.phase === 'choose' && (m.a === 'easy' || m.a === 'hard')) {
      t.level = m.a;
      t.q = riskNextQuestion(g, m.a);
      t.phase = 'answer';
      t.limit = g.timer === false ? 0 : RISK.time[m.a];
      t.started = Date.now();
    } else if (m.kind === 'answer' && t.phase === 'answer') {
      riskAnswered(g, m.a === gameQuestion(t.q).q.right, m.a || '', false);
    } else if (m.kind === 'place' && t.phase === 'place') {
      const L = g.lands[m.a], n = Math.max(1, Math.min(t.armies, Math.floor(Number(m.n)) || 1));
      if (!L || L.o !== uid) return;
      L.a += n;
      t.armies -= n;
      if (!t.armies) t.phase = 'attack';
    } else if (m.kind === 'card' && (t.phase === 'place' || t.phase === 'attack') && hand.includes(m.a)) {
      const c = B.cards.find(x => x.id === m.a);
      if (m.a === 'gates') t.gates = true;
      else if (m.a === 'weighed') {
        const L = g.lands[B.walls];
        if (L.o === uid) return;                                        // not on your own city
        L.a = Math.max(1, L.a - Math.floor(L.a / 2));
      }
      g.cards[uid] = hand.filter((x, n) => n !== hand.indexOf(m.a));
      riskSay(g, seat.name + ' plays “' + c.title + '”: “' + c.quote + '” (' + c.ref + ').');
    } else if (m.kind === 'attack' && t.phase === 'attack') {
      const A = g.lands[m.a], D = g.lands[m.b];
      if (!A || !D || A.o !== uid || D.o === uid || A.a < 2 || !adjacent(m.a, m.b)) return;
      const walls = m.b === B.walls && !t.gates;
      const ad = Math.min(3, A.a - 1), dd = Math.min(walls ? 3 : 2, D.a);
      const ra = rollDice(ad), rd = rollDice(dd);
      let la = 0, ld = 0;
      for (let k = 0; k < Math.min(ad, dd); k++) { if (ra[k] > rd[k]) ld++; else la++; }
      A.a -= la;
      D.a -= ld;
      const was = D.o;
      g.dice = { a: ra, d: rd, from: m.a, to: m.b, la, ld, walls, won: false, by: uid, n: ((g.dice && g.dice.n) || 0) + 1 };
      const K = kingdomOf(seat.k).name, defK = kName(g, was);
      riskSay(g, K + ' attacks ' + landName(m.b) + (walls ? ', behind Babylon’s walls' : '') + '! ' +
        (ld && !la ? defK + ' loses ' + ld + '.' : la && !ld ? 'The defenders hold: ' + K + ' loses ' + la + '.' : K + ' loses ' + la + ', ' + defK + ' loses ' + ld + '.'));
      if (D.a <= 0) {
        // A capture never costs the attacker anything, so there are always
        // armies to move in: as many as the dice rolled.
        D.o = uid;
        D.a = ad;
        A.a -= ad;
        g.dice.won = true;
        riskSay(g, landName(m.b) + ' falls to ' + K + '!');
        const loser = was && seatOf(g, was);
        if (loser && !landsOf(g, was).length) {
          loser.out = true;
          delete g.cards[was];
          riskSay(g, landName(m.b) + ' falls, and with it the kingdom of ' + kingdomOf(loser.k).name + '!');
        }
        if (g.seats.filter(s => !s.out).length === 1) riskOver(g);
      }
    } else if (m.kind === 'move' && t.phase === 'attack') {
      const A = g.lands[m.a], D = g.lands[m.b];
      const n = Math.floor(Number(m.n)) || 0;
      if (!A || !D || A.o !== uid || D.o !== uid || !adjacent(m.a, m.b) || n < 1 || n > A.a - 1) return;
      A.a -= n;
      D.a += n;
      riskLog(g, kingdomOf(seat.k).name + ' moves ' + n + (n === 1 ? ' army' : ' armies') + ' to ' + landName(m.b) + '.');
      riskNextTurn(g);
    } else if (m.kind === 'end' && t.phase === 'attack') {
      riskNextTurn(g);
    }
  }

  // ----- the map -----

  // The board as SVG. `ui` (phones and the host) marks lands: `can` ones
  // are tappable, `from` and `to` are the chosen ones.
  function riskMap(g, ui) {
    const B = BOARD(), u = ui || {};
    const can = new Set(u.can || []);
    const colorOf = id => { const L = g.lands && g.lands[id], s = L && L.o && seatOf(g, L.o); return s ? kingdomOf(s.k).color : '#566174'; };
    const home = new Set((g.seats || []).map(s => kingdomOf(s.k).home));
    const lands = B.lands.map(l => `<polygon class="rk-land${can.has(l.id) ? ' can' : ''}${u.from === l.id ? ' from' : ''}${u.to === l.id ? ' to' : ''}" data-land="${l.id}"
      points="${l.ring.map(p => p.join(',')).join(' ')}" fill="${colorOf(l.id)}"><title>${esc(l.name)}</title></polygon>`).join('');
    const wall = B.lands.find(l => l.id === B.walls);
    const labels = B.lands.map(l => {
      const L = (g.lands || {})[l.id], [x, y] = l.label;
      return `<g class="rk-lab" transform="translate(${x} ${y})${u.small ? ' scale(1.5)' : ''}">
        <text class="nm" y="-30">${esc(l.name)}${home.has(l.id) ? ' ★' : ''}</text>
        ${L ? `<circle r="21" class="badge"/><text class="ar" y="8">${L.a}</text>` : ''}</g>`;
    }).join('');
    const seas = B.seas.map(s => {
      const cx = s.ring.reduce((n, p) => n + p[0], 0) / s.ring.length, cy = s.ring.reduce((n, p) => n + p[1], 0) / s.ring.length;
      return `<text class="sea" x="${Math.round(cx)}" y="${Math.round(cy)}">${esc(s.name)}</text>`;
    }).join('');
    return `<svg class="rk-map" viewBox="0 0 ${B.size[0]} ${B.size[1]}" role="img" aria-label="Map of the ancient Near East">
      <rect width="${B.size[0]}" height="${B.size[1]}" class="rk-sea"/>${seas}${lands}
      ${wall ? `<polygon class="rk-walls" points="${wall.ring.map(p => p.join(',')).join(' ')}"/>` : ''}${labels}</svg>`;
  }

  // A die face: 3×3 spots, the right ones shown.
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const pips = n => Array.from({ length: 9 }, (_, i) => `<i${PIPS[n].includes(i) ? ' class="on"' : ''}></i>`).join('');
  const dieHtml = (n, cls) => `<span class="rk-die ${cls}" data-n="${n}" aria-label="${n}">${pips(n)}</span>`;
  // A new roll tumbles across the map, then lands on its numbers. It's
