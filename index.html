<style>
  /* ------------------------------------------------------------------
     Core layout lives in plain CSS (not Tailwind) on purpose: if the
     Tailwind CDN is slow or unreachable, the feed still scrolls and
     snaps correctly instead of collapsing into an unusable page.
     ------------------------------------------------------------------ */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a14; color: #fff;
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    overscroll-behavior: none;
  }

  /* Hide every scrollbar; this should feel like an app, not a web page. */
  ::-webkit-scrollbar { display: none !important; width: 0 !important; }
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }

  /* The feed: one full-screen reel at a time, snapped. */
  #feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
  .reel {
    position: relative;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    touch-action: manipulation; /* kills iOS double-tap zoom so double-tap = like */
  }

  /* Soft moving blobs behind the text, so each reel has depth. */
  .blob {
    position: absolute; border-radius: 9999px;
    filter: blur(70px); opacity: .5; pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(8%, -6%, 0) scale(1.25); }
  }

  /* Legibility scrim: text sits over gradients, so darken top and bottom. */
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,5,12,.72) 0%, rgba(5,5,12,0) 26%),
      linear-gradient(to top,   rgba(5,5,12,.88) 0%, rgba(5,5,12,0) 52%);
  }

  /* Double-tap hearts that float up from the tap point. */
  .pop-heart {
    position: fixed; pointer-events: none; z-index: 70;
    font-size: 30px; will-change: transform, opacity;
    animation: floatUp .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes floatUp {
    0%   { transform: translate(-50%,-50%) scale(.3) rotate(var(--r,0deg)); opacity: 0; }
    18%  { transform: translate(-50%,-50%) scale(1.25) rotate(var(--r,0deg)); opacity: 1; }
    100% { transform: translate(-50%,-190%) scale(.85) rotate(var(--r,0deg)); opacity: 0; }
  }
  .big-heart {
    position: absolute; left: 50%; top: 45%; z-index: 60;
    transform: translate(-50%,-50%); font-size: 110px; pointer-events: none;
    animation: thump .7s cubic-bezier(.22,1,.36,1) forwards;
    filter: drop-shadow(0 8px 30px rgba(244,63,94,.6));
  }
  @keyframes thump {
    0%   { transform: translate(-50%,-50%) scale(.2); opacity: 0; }
    35%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    70%  { transform: translate(-50%,-50%) scale(.95); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.05); opacity: 0; }
  }

  .heart-btn.liked { animation: beat .45s ease; }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    40%     { transform: scale(1.4); }
  }

  /* The audio title strip, scrolling like a Reels track credit. */
  .marquee { overflow: hidden; white-space: nowrap; max-width: 62vw; }
  .marquee span {
    display: inline-block; padding-left: 100%;
    animation: slide 13s linear infinite;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }

  /* Daily-quest bottom sheet. */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(.22,1,.36,1);
    padding-bottom: calc(18px + var(--sab));
    max-height: 82dvh; overflow-y: auto;
  }
  #sheet.open { transform: translateY(0); }
  #backdrop {
    position: fixed; inset: 0; z-index: 85;
    background: rgba(3,3,10,.66); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  #backdrop.open { opacity: 1; pointer-events: auto; }

  /* XP bar fill. */
  #xpFill { transition: width .6s cubic-bezier(.22,1,.36,1); }

  /* Toasts for XP gains and quest completions. */
  #toasts {
    position: fixed; z-index: 95; left: 0; right: 0;
    bottom: calc(var(--sab) + 96px);
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    pointer-events: none;
  }
  .toast { animation: toastIn .35s cubic-bezier(.22,1,.36,1), toastOut .4s ease 1.9s forwards; }
  @keyframes toastIn  { from { transform: translateY(14px) scale(.9); opacity: 0; } }
  @keyframes toastOut { to   { transform: translateY(-8px); opacity: 0; } }

  /* Level-up celebration. */
  #levelup {
    position: fixed; inset: 0; z-index: 99;
    display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(251,191,36,.22), rgba(3,3,10,.94));
  }
  #levelup.show { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .lv-card { animation: lvPop .6s cubic-bezier(.22,1,.36,1); }
  @keyframes lvPop {
    0%   { transform: scale(.6) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* ------------------------------------------------------------------
     Safe-area offsets. These live here rather than as Tailwind arbitrary
     values because `calc(var(--sab)+10px)` is invalid CSS — the spec
     requires whitespace around `+`, and a class like
     bottom-[calc(var(--sab)+10px)] silently compiles to nothing.
     Both vars default to 0px, so these are correct on non-notched screens.
     ------------------------------------------------------------------ */
  .hud-pad     { padding-top: calc(var(--sat) + 10px); }
  .tab-pos     { bottom: calc(var(--sab) + 10px); }
  .hint-pos    { bottom: calc(var(--sab) + 56px); }
  .side-pos    { bottom: calc(var(--sab) + 130px); }

  /* The text column. Rich reels are taller than a small phone, so this
     scrolls inside the reel. Overscroll chaining is left at the default:
     read to the end of a long reel and the next swipe advances the feed. */
  .content-pad {
    padding-top: calc(var(--sat) + 68px);   /* clears the HUD when tall */
    padding-bottom: calc(var(--sab) + 96px);
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Type scales with viewport HEIGHT, so a 640px Android gets smaller text
     instead of a wall that has to be scrolled. Measured against 360x640,
     390x844 and 430x932. */
  .reel-hook {
    font-size: clamp(20px, 3.05vh, 27px);
    line-height: 1.13; font-weight: 900;
    letter-spacing: -0.02em; margin-bottom: 10px;
  }
  .reel-body {
    font-size: clamp(12.5px, 1.72vh, 14.5px);
    line-height: 1.5; color: rgba(255,255,255,.87);
  }
  .verse-text { font-size: clamp(12.5px, 1.68vh, 14px); line-height: 1.38; }
  .dig-text   { font-size: clamp(12px, 1.58vh, 13.5px); line-height: 1.5; }

  .dig-body { display: none; }
  .dig-body.open { display: block; animation: digIn .35s ease; }
  @keyframes digIn { from { opacity: 0; transform: translateY(-6px); } }

  /* Thin position rail down the right edge. */
  /* Position dots. The active one stretches, so it reads as a position
     indicator rather than a scrollbar thumb. */
  #rail { position: fixed; right: 6px; top: 50%; transform: translateY(-50%);
          z-index: 40; display: flex; flex-direction: column;
          gap: 5px; align-items: center; pointer-events: none; }
  .rail-dot { width: 4px; height: 4px; border-radius: 999px;
              background: rgba(255,255,255,.3); transition: all .3s ease; }
  .rail-dot.on { background: #fff; height: 15px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .blob { animation: none; }
    .marquee span { animation: none; padding-left: 0; }
  }
</style>
</head>

     bottom of this file for that.

<script>
const ScriptureTok = (function () {
  'use strict';

  /* ---------------- tuning knobs ---------------- */

  const STORE_KEY = 'scripturetok.v1';

  // XP awarded the first time he does each thing to a given reel.
  const XP = { view: 10, like: 20, dig: 15 };

  // Level titles double as the level cap (8 levels).
  const LEVEL_TITLES = [
    'Seeker', 'Scroll Reader', 'Truth Tracker', 'Rod Holder',
    'Isaiah Decoder', 'Watchman', "Prophet's Apprentice", 'Marvelous Worker'
  ];

  // Cumulative XP needed to *reach* level L. L1=0, L2=80, L3=240, L4=480, L5=800.
  const xpAt = L => 40 * (L - 1) * L;
  const levelFor = xp => {
    let L = 1;
    while (L < LEVEL_TITLES.length && xpAt(L + 1) <= xp) L++;
    return L;
  };

  // Daily quests. `counter` points at a tally in state.daily; `goal` of 0
  // means "all the reels this week" and gets filled in at boot.
  const QUESTS = [
    { id: 'open',   icon: '☀️', label: 'Open ScriptureTok today',      counter: 'opened', goal: 1, xp: 20 },
    { id: 'view3',  icon: '📜', label: 'Swipe through 3 reels',      counter: 'views',  goal: 3, xp: 30 },
    { id: 'like1',  icon: '❤️', label: 'Like a post',                counter: 'likes',  goal: 1, xp: 25 },
    { id: 'dig2',   icon: '🔎', label: 'Dig deeper on 2 reels',      counter: 'digs',   goal: 2, xp: 35 },
    { id: 'finish', icon: '🏁', label: "Finish the whole week's feed", counter: 'views', goal: 0, xp: 60 }
  ];

  // Optional Google Sheets sync. Leave mode:'local' to use the CONTENT
  // block at the bottom of this file. See README for the two-minute setup.
  const CONTENT_SOURCE = { mode: 'local', csvUrl: '' };

  /* ---------------- state ---------------- */

  let WEEK = null;
  let S = null;
  let booted = false;

  const freshState = () => ({
    xp: 0, streak: 0, lastDay: null,
    liked: [],        // currently liked reel ids
    likedEverIds: [], // reels ever liked (so like XP is paid once)
    seen: [],   // reels ever viewed (so view XP is paid once)
    dug: [],    // reels ever expanded
    daily: null
  });

  const freshDaily = day => ({ day, opened: 1, views: [], likes: [], digs: [], claimed: [] });

  // Every storage access is wrapped: private windows and blocked site data
  // throw here, and a scripture app should still work when they do.
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(freshState(), JSON.parse(raw));
    } catch (e) { /* fall through to a fresh profile */ }
    return freshState();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------------- dates & streak ---------------- */

  const dayKey = (d = new Date()) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const dayDiff = (a, b) =>
    Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

  // Bump the streak, or reset it, and roll the daily quests over.
  function rollDay() {
    const today = dayKey();
    if (S.lastDay === today) {
      if (!S.daily || S.daily.day !== today) S.daily = freshDaily(today);
      return;
    }
    const gap = S.lastDay ? dayDiff(S.lastDay, today) : null;
    S.streak = gap === 1 ? S.streak + 1 : 1;   // missed a day -> back to 1
    S.lastDay = today;
    S.daily = freshDaily(today);
  }

  /* ---------------- helpers ---------------- */

  const $ = id => document.getElementById(id);

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const reduceMotion = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Build a link to the real scripture text so any verse here is verifiable.
  function readLink(reel) {
    if (reel.read) return reel.read;
    if (!reel.chapter) return null;
    const book = reel.book || 'isa';
    const vol = reel.volume || 'ot';
    return 'https://www.churchofjesuschrist.org/study/scriptures/' + vol + '/' + book + '/' + reel.chapter + '?lang=eng';
  }

  /* ---------------- rendering ---------------- */

  function reelHtml(r, i) {
    const liked = S.liked.includes(r.id);
    const link = readLink(r);

    const tags = (r.tags || [])
      .map(t => '<span class="text-[11px] font-semibold text-white/55">' + esc(t) + '</span>')
      .join('');

    const verse = r.verse ? `
      <div class="mt-4 rounded-2xl bg-black/35 backdrop-blur-sm ring-1 ring-white/15 px-4 py-3">
        <p class="verse-text font-medium text-white/95">“${esc(r.verse.text)}”</p>
        <div class="mt-2 flex items-center justify-between gap-3">
          <span class="text-[11px] font-bold tracking-wide text-amber-300">${esc(r.verse.ref)}</span>
          ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer"
                       data-notap class="text-[10px] font-semibold text-white/55 underline decoration-white/30 shrink-0">open scriptures ↗</a>` : ''}
        </div>
      </div>` : '';

    const dig = r.deepDive ? `
      <button data-notap data-dig="${esc(r.id)}"
              class="mt-3 flex items-center gap-2 rounded-full bg-white/12 ring-1 ring-white/20 px-3.5 py-2 active:scale-95 transition">
        <span class="text-[13px]">🔎</span>
        <span class="text-[12px] font-extrabold tracking-wide">Dig deeper</span>
        <span class="text-[10px] font-bold text-amber-300">+${XP.dig} XP</span>
      </button>
      <div data-digbody="${esc(r.id)}" class="dig-body mt-3 rounded-2xl bg-violet-950/55 backdrop-blur-sm ring-1 ring-violet-300/25 px-4 py-3">
        <p class="dig-text text-white/90">${esc(r.deepDive)}</p>
      </div>` : '';

    return `
    <article class="reel" data-id="${esc(r.id)}" data-index="${i}">
      <div class="absolute inset-0" style="background-image:${r.gradient || 'linear-gradient(150deg,#1e293b,#0f172a)'}"></div>
      <div class="blob" style="width:58vw;height:58vw;left:-14vw;top:8vh;background:${r.blobA || 'rgba(255,255,255,.28)'}"></div>
      <div class="blob" style="width:48vw;height:48vw;right:-10vw;top:42vh;background:${r.blobB || 'rgba(0,0,0,.3)'};animation-delay:-6s"></div>
      <div class="scrim"></div>

      <!-- side actions -->
      <div class="absolute right-3 side-pos z-30 flex flex-col items-center gap-5">
        <button data-notap data-like="${esc(r.id)}" class="flex flex-col items-center active:scale-90 transition">
          <span class="heart-btn text-[32px] leading-none ${liked ? 'liked' : ''}">${liked ? '❤️' : '🤍'}</span>
        </button>
      </div>

      <!-- main content -->
      <div class="relative z-20 px-5 content-pad pr-[56px]">
        <div class="flex items-center gap-2 mb-3">
          <div class="grid place-items-center w-9 h-9 rounded-full bg-black/45 ring-1 ring-white/25 text-lg">${esc(r.avatar || '📖')}</div>
          <div class="min-w-0">
            <div class="flex items-center gap-1">
              <span class="text-[13px] font-extrabold truncate">${esc(r.handle)}</span>
              ${r.verified === false ? '' : '<span class="text-[11px] text-sky-400">✔︎</span>'}
            </div>
            <div class="text-[10px] text-white/55">${esc(r.role || 'Come, Follow Me')}</div>
          </div>
        </div>

        <h2 class="reel-hook">${esc(r.hook)}</h2>
        <p class="reel-body">${esc(r.body)}</p>
        ${verse}
        ${dig}
        <div class="mt-3.5 flex flex-wrap gap-2">${tags}</div>

        <div class="mt-3 flex items-center gap-2">
          <span class="text-[13px]">♫</span>
          <div class="marquee text-[11px] font-semibold text-white/70"><span>${esc(r.audio || 'original audio')} &nbsp;•&nbsp; ${esc(r.handle)} &nbsp;•&nbsp;</span></div>
        </div>
      </div>
    </article>`;
  }

  function renderFeed() {
    $('feed').innerHTML = WEEK.reels.map(reelHtml).join('');
    $('rail').innerHTML = WEEK.reels.map(() => '<div class="rail-dot"></div>').join('');
    WEEK.reels.forEach(r => {
      if (S.dug.includes(r.id)) {
        const body = document.querySelector('[data-digbody="' + r.id + '"]');
        if (body) body.classList.add('open');
      }
    });
  }

  /* ---------------- HUD ---------------- */

  function renderHud() {
    const L = levelFor(S.xp);
    const capped = L >= LEVEL_TITLES.length;
    const floor = xpAt(L);
    const ceil = capped ? floor : xpAt(L + 1);
    const pct = capped ? 100 : Math.max(0, Math.min(100, ((S.xp - floor) / (ceil - floor)) * 100));

    $('levelNum').textContent = L;
    $('levelTitle').textContent = LEVEL_TITLES[L - 1];
    $('xpText').textContent = S.xp + ' XP';
    $('xpFill').style.width = pct + '%';
    $('nextLevel').textContent = capped
      ? 'Max level — you finished the whole path'
      : (ceil - S.xp) + ' XP to ' + LEVEL_TITLES[L];
    $('streakNum').textContent = S.streak;
  }

  /* ---------------- quests ---------------- */

  const questProgress = q =>
    q.counter === 'opened' ? S.daily.opened : (S.daily[q.counter] || []).length;

  function renderQuests() {
    const done = QUESTS.filter(q => S.daily.claimed.includes(q.id)).length;
    const left = QUESTS.length - done;

    $('questBadge').textContent = left;
    $('questBadge').classList.toggle('bg-emerald-400', left === 0);
    $('questBadge').classList.toggle('text-emerald-950', left === 0);

    $('questSub').textContent = left === 0
      ? 'All done today. Come back tomorrow to keep your streak alive.'
      : 'Resets every morning. ' + left + ' left today.';

    $('questList').innerHTML = QUESTS.map(q => {
      const p = Math.min(questProgress(q), q.goal);
      const complete = S.daily.claimed.includes(q.id);
      const pct = q.goal ? (p / q.goal) * 100 : 0;
      return `
      <div class="rounded-2xl px-3.5 py-3 ring-1 ${complete ? 'bg-emerald-500/10 ring-emerald-400/30' : 'bg-white/5 ring-white/10'}">
        <div class="flex items-center gap-3">
          <span class="text-lg shrink-0">${complete ? '✅' : q.icon}</span>
          <div class="flex-1 min-w-0">
            <div class="text-[13px] font-bold ${complete ? 'text-emerald-300 line-through decoration-emerald-400/50' : ''}">${esc(q.label)}</div>
            <div class="mt-1.5 h-1.5 rounded-full bg-white/10 overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500 ${complete ? 'bg-emerald-400' : 'bg-gradient-to-r from-violet-400 to-fuchsia-400'}" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[11px] font-black ${complete ? 'text-emerald-300' : 'text-amber-300'}">+${q.xp}</div>
            <div class="text-[9px] text-white/40">${p}/${q.goal}</div>
          </div>
        </div>
      </div>`;
    }).join('');

    const everViewed = WEEK.reels.filter(r => S.seen.includes(r.id)).length;
    const total = WEEK.reels.length;
    $('weekProgressText').textContent = everViewed + ' of ' + total + ' reels';
    $('weekFill').style.width = (total ? (everViewed / total) * 100 : 0) + '%';
    $('weekLabel').textContent = WEEK.title + ' · ' + WEEK.reference + ' · ' + WEEK.dates;
  }

  // Pay out any quest that just crossed its goal.
  function checkQuests() {
    let paid = false;
    QUESTS.forEach(q => {
      if (S.daily.claimed.includes(q.id)) return;
      if (questProgress(q) >= q.goal) {
        S.daily.claimed.push(q.id);
        grantXp(q.xp, 'Quest: ' + q.label, true);
        paid = true;
      }
    });
    if (paid) {
      const left = QUESTS.length - S.daily.claimed.length;
      if (left === 0) toast('🏆', 'Every quest done today!', '');
    }
    return paid;
  }

  /* ---------------- XP ---------------- */

  function grantXp(amount, reason, quiet) {
    const before = levelFor(S.xp);
    S.xp += amount;
    const after = levelFor(S.xp);
    if (!quiet) toast('＋' + amount + ' XP', reason, 'xp');
    else toast('＋' + amount + ' XP', reason, 'quest');
    renderHud();
    if (after > before) levelUp(after);
    save();
  }

  let lvTimer = null;
  function levelUp(L) {
    $('lvNum').textContent = L;
    $('lvTitle').textContent = LEVEL_TITLES[L - 1];
    $('levelup').classList.add('show');
    clearTimeout(lvTimer);
    lvTimer = setTimeout(closeLevelUp, 5000);
  }
  function closeLevelUp() {
    clearTimeout(lvTimer);
    $('levelup').classList.remove('show');
  }

  /* ---------------- toasts ---------------- */

  function toast(big, small, kind) {
    const wrap = $('toasts');
    while (wrap.children.length >= 2) wrap.firstChild.remove();  // don't bury the reel
    const el = document.createElement('div');
    const ring = kind === 'quest' ? 'ring-emerald-400/40' : 'ring-amber-300/40';
    el.className = 'toast max-w-[86%] flex items-center gap-2.5 rounded-full bg-black/80 backdrop-blur-md px-4 py-2 ring-1 ' + ring;
    el.innerHTML = '<span class="text-[13px] font-black ' + (kind === 'quest' ? 'text-emerald-300' : 'text-amber-300') + '">' + esc(big) + '</span>' +
                   (small ? '<span class="text-[11px] font-semibold text-white/70 truncate">' + esc(small) + '</span>' : '');
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }

  /* ---------------- actions ---------------- */

  function markViewed(id) {
    let changed = false;

    if (!S.daily.views.includes(id)) { S.daily.views.push(id); changed = true; }
    if (!S.seen.includes(id)) {
      S.seen.push(id);
      grantXp(XP.view, '');   // fires on every reel; keep the pill small
      changed = true;
    }
    if (changed) { checkQuests(); renderQuests(); save(); }
  }

  function setLiked(id, on, x, y) {
    const idx = S.liked.indexOf(id);
    const was = idx !== -1;
    if (on === was) {
      // Double-tapping an already-liked reel still shows hearts, like Instagram.
      if (on && x != null) burst(x, y, id);
      return;
    }

    if (on) S.liked.push(id); else S.liked.splice(idx, 1);

    // Refresh just this reel's heart.
    const reel = document.querySelector('.reel[data-id="' + id + '"]');
    if (reel) {
      const heart = reel.querySelector('.heart-btn');
      if (heart) {
        heart.textContent = on ? '❤️' : '🤍';
        heart.classList.remove('liked');
        if (on && !reduceMotion()) { void heart.offsetWidth; heart.classList.add('liked'); }
      }
    }

    if (on) {
      if (x != null) burst(x, y, id);
      if (!S.daily.likes.includes(id)) S.daily.likes.push(id);
      if (!S.likedEverIds) S.likedEverIds = [];   // profiles saved before this field existed
      if (!S.likedEverIds.includes(id)) {
        S.likedEverIds.push(id);
        grantXp(XP.like, 'Liked a reel');
      }
      checkQuests();
    }
    renderQuests();
    save();
  }

  function toggleDig(id) {
    const body = document.querySelector('[data-digbody="' + id + '"]');
    if (!body) return;
    const opening = !body.classList.contains('open');
    body.classList.toggle('open', opening);
    if (!opening) return;

    if (!S.daily.digs.includes(id)) S.daily.digs.push(id);
    if (!S.dug.includes(id)) {
      S.dug.push(id);
      grantXp(XP.dig, 'Dug deeper');
    }
    checkQuests();
    renderQuests();
    save();

    // Nudge the revealed text into view without yanking him off the reel.
    setTimeout(() => body.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }), 60);
  }

  /* ---------------- double-tap hearts ---------------- */

  function burst(x, y, id) {
    if (reduceMotion()) return;
    const reel = document.querySelector('.reel[data-id="' + id + '"]');
    if (reel) {
      const big = document.createElement('div');
      big.className = 'big-heart';
      big.textContent = '❤️';
      reel.appendChild(big);
      setTimeout(() => big.remove(), 750);
    }
    for (let i = 0; i < 6; i++) {
      const h = document.createElement('div');
      h.className = 'pop-heart';
      h.textContent = ['❤️', '💜', '💛', '❤️', '✨', '💫'][i];
      h.style.left = (x + (Math.random() * 90 - 45)) + 'px';
      h.style.top  = (y + (Math.random() * 40 - 20)) + 'px';
      h.style.setProperty('--r', (Math.random() * 50 - 25) + 'deg');
      h.style.animationDelay = (i * 55) + 'ms';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1100 + i * 55);
    }
  }

  /* ---------------- sheet ---------------- */

  function openSheet(on) {
    $('sheet').classList.toggle('open', on);
    $('backdrop').classList.toggle('open', on);
    $('questTab').style.opacity = on ? '0' : '1';
    $('questTab').style.pointerEvents = on ? 'none' : 'auto';
    if (on) renderQuests();
  }

  /* ---------------- wiring ---------------- */

  function wire() {
    const feed = $('feed');

    // Track which reel is on screen, and pay view XP after a short dwell so
    // a fast flick past a reel doesn't count as reading it.
    let dwell = null;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting || en.intersectionRatio < 0.6) return;
        const reel = en.target;
        const i = Number(reel.dataset.index);

        document.querySelectorAll('.rail-dot').forEach((d, n) => d.classList.toggle('on', n === i));

        clearTimeout(dwell);
        dwell = setTimeout(() => markViewed(reel.dataset.id), 1100);
      });
    }, { root: feed, threshold: [0, 0.6, 0.95] });
    document.querySelectorAll('.reel').forEach(r => io.observe(r));

    // Retire the swipe hint once he's moved.
    feed.addEventListener('scroll', function once() {
      if (feed.scrollTop > 40) { $('hint').remove(); feed.removeEventListener('scroll', once); }
    }, { passive: true });

    // Taps: buttons handle themselves; two quick taps anywhere else = like.
    let lastTap = 0, lastEl = null;
    feed.addEventListener('click', e => {
      const likeBtn = e.target.closest('[data-like]');
      if (likeBtn) {
        const id = likeBtn.dataset.like;
        const r = likeBtn.getBoundingClientRect();
        setLiked(id, !S.liked.includes(id), r.left + r.width / 2, r.top);
        return;
      }
      const digBtn = e.target.closest('[data-dig]');
      if (digBtn) { toggleDig(digBtn.dataset.dig); return; }
      if (e.target.closest('[data-notap]')) return;

      const reel = e.target.closest('.reel');
      if (!reel) return;

      const now = Date.now();
      if (now - lastTap < 330 && lastEl === reel) {
        lastTap = 0; lastEl = null;
        setLiked(reel.dataset.id, true, e.clientX, e.clientY);
      } else {
        lastTap = now; lastEl = reel;
      }
    });

    // Quest sheet: tap the tab, swipe the grabber down, tap the backdrop.
    $('questTab').addEventListener('click', () => openSheet(true));
    $('sheetClose').addEventListener('click', () => openSheet(false));
    $('backdrop').addEventListener('click', () => openSheet(false));

    let dragStart = null;
    const grabber = $('grabber');
    grabber.addEventListener('touchstart', e => { dragStart = e.touches[0].clientY; }, { passive: true });
    grabber.addEventListener('touchmove', e => {
      if (dragStart == null) return;
      const dy = e.touches[0].clientY - dragStart;
      if (dy > 0) $('sheet').style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    grabber.addEventListener('touchend', e => {
      const dy = (e.changedTouches[0].clientY) - (dragStart || 0);
      $('sheet').style.transform = '';
      if (dy > 70) openSheet(false);
      dragStart = null;
    });

    // Swipe up anywhere near the bottom edge opens the quests.
    let edgeStart = null;
    document.addEventListener('touchstart', e => {
      const t = e.touches[0];
      edgeStart = (window.innerHeight - t.clientY < 46) ? t.clientY : null;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (edgeStart == null) return;
      if (edgeStart - e.changedTouches[0].clientY > 45) openSheet(true);
      edgeStart = null;
    });

    // Tap anywhere on the celebration to get back to the feed.
    $('levelup').addEventListener('click', closeLevelUp);

    // Desktop: arrows page the feed, so this is testable without a phone.
    document.addEventListener('keydown', e => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      feed.scrollBy({ top: (e.key === 'ArrowDown' ? 1 : -1) * window.innerHeight, behavior: 'smooth' });
    });

    // Coming back after midnight should roll the streak without a reload.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (S.daily && S.daily.day !== dayKey()) {
        rollDay(); save(); renderHud(); renderQuests();
      }
    });
  }

  /* ---------------- optional Google Sheets content ---------------- */

  // Minimal RFC-4180-ish parser: handles quoted fields, embedded commas,
  // escaped quotes and both newline styles.
  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(v => v !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some(v => v !== '')) rows.push(row);
    return rows;
  }

  // Sheet columns -> reel objects. Column order doesn't matter; header names do.
  function rowsToReels(rows) {
    if (!rows.length) return [];
    const head = rows[0].map(h => h.trim().toLowerCase());
    const at = (r, name) => {
      const i = head.indexOf(name);
      return i === -1 ? '' : (r[i] || '').trim();
    };
    return rows.slice(1).map((r, n) => {
      const reel = {
        id: at(r, 'id') || 'row-' + n,
        handle: at(r, 'handle') || '@come_follow_me',
        avatar: at(r, 'avatar') || '📖',
        role: at(r, 'role'),
        hook: at(r, 'hook'),
        body: at(r, 'body'),
        deepDive: at(r, 'deepdive'),
        audio: at(r, 'audio'),
        gradient: at(r, 'gradient') || 'linear-gradient(150deg,#334155,#0f172a)',
        chapter: at(r, 'chapter'),
        book: at(r, 'book') || 'isa',
        tags: at(r, 'tags') ? at(r, 'tags').split(/\s+/).filter(Boolean) : []
      };
      const vt = at(r, 'verse'), vr = at(r, 'ref');
      if (vt) reel.verse = { text: vt, ref: vr };
      return reel;
    }).filter(r => r.hook || r.body);
  }

  async function resolveContent(week) {
    if (CONTENT_SOURCE.mode !== 'sheet' || !CONTENT_SOURCE.csvUrl) return week;
    try {
      const res = await fetch(CONTENT_SOURCE.csvUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const reels = rowsToReels(parseCsv(await res.text()));
      if (!reels.length) throw new Error('sheet had no usable rows');
      return Object.assign({}, week, { reels });
    } catch (err) {
      // Never leave him staring at an empty feed because a sheet was down.
      console.warn('[ScriptureTok] Sheet load failed, using built-in content:', err);
      return week;
    }
  }

  /* ---------------- boot ---------------- */

  async function boot(week) {
    if (booted) return;
    booted = true;

    S = load();
    rollDay();

    WEEK = await resolveContent(week);
    QUESTS.find(q => q.id === 'finish').goal = WEEK.reels.length;

    // Drop saved ids that no longer exist, so old weeks don't inflate progress.
    const live = new Set(WEEK.reels.map(r => r.id));
    ['liked', 'seen', 'dug'].forEach(k => { S[k] = (S[k] || []).filter(id => live.has(id)); });
    if (S.likedEverIds) S.likedEverIds = S.likedEverIds.filter(id => live.has(id));

    renderFeed();
    renderHud();
    checkQuests();   // the "open today" quest pays out immediately
    renderQuests();
    wire();
    save();
  }

  return { boot: boot };
})();
</script>
